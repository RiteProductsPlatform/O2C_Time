<title>O2C Timesheet Module — Working Prototype (V4, Aug 2026)</title>
<style>
:root{
  --rw-coal:#2a2c33; --rw-ink-2:#3a3c44; --rw-slate:#5b5d65; --rw-oyster:#f6f6f4; --rw-paper:#ffffff;
  --rw-border:#dcdbd7; --rw-border-2:#eceae6; --rw-hover:#f0efeb;
  --rw-danger:#a73d2f; --rw-success:#1f6a4a; --rw-warning:#a26a0a; --rw-info:#1f5d83;
  --shell-header-height:56px;
}

body{ color:var(--rw-ink-2); background:var(--rw-oyster); }
.rw-app{ display:flex; flex-direction:column; height:100vh; overflow:hidden; background:var(--rw-oyster); }

/* ---- top bar ---- */
.rw-topbar{ height:var(--shell-header-height); min-height:var(--shell-header-height); background:#3a3530; border-bottom:3px solid #a23541; display:flex; align-items:center; justify-content:space-between; padding:0 20px; gap:12px; flex-shrink:0; }
.rw-brand{ font-size:16px; font-weight:700; color:#fff; letter-spacing:.01em; }
.rw-brand small{ font-weight:600; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.45); margin-left:8px; }
.rw-topbar-right{ display:flex; align-items:center; gap:12px; }
.rw-role-switch{ display:flex; background:rgba(255,255,255,0.08); border-radius:6px; padding:2px; gap:2px; }
.rw-role-btn{ border:none; background:transparent; color:rgba(255,255,255,0.65); font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:5px; cursor:pointer; font-family:inherit; }

.rw-user-name{ font-size:13px; font-weight:600; color:rgba(255,255,255,0.92); }
.rw-user-role{ font-size:9.5px; font-weight:700; letter-spacing:.06em; color:rgba(255,255,255,0.6); background:rgba(255,255,255,0.12); padding:2px 7px; border-radius:3px; }

/* ---- drawer ---- */
.rw-drawer-overlay{ position:fixed; inset:0; background:rgba(20,18,16,0.30); z-index:150; opacity:0; pointer-events:none; transition:opacity .2s; }
.rw-drawer-overlay.open{ opacity:1; pointer-events:auto; }
.rw-drawer{ position:fixed; top:0; right:0; height:100vh; width:280px; background:#3a3530; color:#fff; z-index:200; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .24s ease; box-shadow:-8px 0 28px rgba(0,0,0,0.22); }

.rw-drawer-nav{ flex:1; overflow-y:auto; padding:10px 10px 24px; }
.rw-nav-group-label{ font-size:10.5px; font-weight:700; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:.08em; padding:14px 12px 6px; }
.rw-nav-item{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:6px; font-size:13.5px; font-weight:600; color:rgba(255,255,255,0.9); cursor:pointer; border:none; background:transparent; width:100%; text-align:left; font-family:inherit; position:relative; }
.rw-nav-item:hover{ background:rgba(255,255,255,0.1); color:#fff; }
.rw-nav-item.active{ background:rgba(255,255,255,0.16); color:#fff; }

/* ---- page furniture ---- */
.page-band{ background:linear-gradient(135deg,#2f3a37 0%,#3f504b 50%,#5d716a 100%); padding:24px 32px 20px; color:#fff; }
.page-band-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; color:rgba(255,255,255,0.65); margin:0 0 6px; }
.page-band-header{ display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; }
.page-band-title{ font-family:Georgia,"Times New Roman",serif; font-size:24px; font-weight:400; color:#fff; margin:0; flex:1; min-width:0; }
.page-band-sub{ font-size:13px; color:rgba(255,255,255,0.75); margin-top:6px; max-width:820px; line-height:1.55; }
.rw-body{ padding:20px 28px 56px; }
.rw-toolbar{ display:flex; align-items:center; gap:8px; padding:0 0 16px; flex-wrap:wrap; }

/* ---- controls ---- */
.btn{ display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; white-space:nowrap; line-height:1.4; min-height:32px; font-family:inherit; }
.btn-primary{ background:var(--rw-coal); color:#fff; } .btn-primary:hover{ background:#1a1c22; }
.btn-outline{ background:#fff; color:var(--rw-ink-2); border-color:var(--rw-border); } .btn-outline:hover{ background:var(--rw-hover); }
.btn-ghost{ background:transparent; color:var(--rw-ink-2); } .btn-ghost:hover{ background:var(--rw-hover); }
.btn-danger{ background:var(--rw-danger); color:#fff; } .btn-danger:hover{ background:#8b2f23; }
.btn-go{ background:var(--rw-success); color:#fff; } .btn-go:hover{ background:#17513a; }

.btn:disabled{ opacity:.42; cursor:not-allowed; }
select,input[type=text],input[type=date],input[type=number],textarea{ font-family:inherit; font-size:13px; padding:6px 9px; border:1px solid var(--rw-border); border-radius:4px; background:#fff; color:var(--rw-ink-2); }
select:focus,input:focus,textarea:focus{ outline:2px solid #6d8f84; outline-offset:0; }
label.fl{ display:block; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--rw-slate); margin-bottom:4px; }

/* ---- chips ---- */
.chip{ display:inline-flex; align-items:center; padding:2px 9px; border-radius:3px; font-size:11px; font-weight:600; white-space:nowrap; letter-spacing:.02em; }
.chip-draft{ background:#eceae6; color:#5b5d65; }
.chip-open{ background:#dbeeff; color:#1f4a7a; }
.chip-submitted{ background:#dbe7f4; color:#1f4a7a; }
.chip-approved{ background:#d8ede2; color:#1f6a4a; }
.chip-rejected{ background:#f6dcd7; color:#a73d2f; }
.chip-defaulted{ background:#f4e6c8; color:#8a5a08; }
.chip-late{ background:#f9e2c4; color:#94540a; }
.chip-warn{ background:#f4e6c8; color:#8a5a08; }
.chip-closed{ background:#e4e2dd; color:#6a6c74; }
.chip-info{ background:#dbeeff; color:#1f4a7a; }
.chip-nb{ background:#ece9f5; color:#4a3f7a; }
.flag-chip{ display:inline-flex; align-items:center; padding:1px 7px; border-radius:3px; font-size:10px; font-weight:700; letter-spacing:.03em; background:#f4e6c8; color:#8a5a08; margin-left:4px; }

/* ---- cards and tables ---- */
.card{ background:var(--rw-paper); border:1px solid var(--rw-border); border-radius:6px; margin-bottom:16px; overflow:hidden; }
.card-hd{ padding:12px 16px; border-bottom:1px solid var(--rw-border-2); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:#fbfbf9; }
.card-hd h3{ margin:0; font-size:14px; font-weight:700; color:var(--rw-coal); }
.card-body{ padding:16px; }
.card-body.tight{ padding:0; }
.section-title{ font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--rw-slate); margin:0 0 10px; }
.tbl-wrap{ overflow-x:auto; }
table.dt{ width:100%; border-collapse:collapse; font-size:13px; }
table.dt th{ text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--rw-slate); padding:9px 12px; border-bottom:1px solid var(--rw-border); background:#fbfbf9; white-space:nowrap; }
table.dt td{ padding:8px 12px; border-bottom:1px solid var(--rw-border-2); vertical-align:middle; }
table.dt tbody tr:hover td{ background:#fafaf8; }
table.dt tfoot td{ font-weight:700; background:#f4f4f1; border-top:1px solid var(--rw-border); }
.rt{ text-align:right; font-variant-numeric:tabular-nums; }
.mono{ font-family:ui-monospace,Consolas,"Courier New",monospace; font-size:12px; }
.muted{ color:var(--rw-slate); }
.sm{ font-size:11.5px; }
.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px; margin-bottom:16px; }
.stat-card{ background:#fff; border:1px solid var(--rw-border); border-radius:6px; padding:11px 13px; }
.stat-card .lbl{ font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--rw-slate); }
.stat-card .val{ font-size:20px; font-weight:700; color:var(--rw-coal); font-variant-numeric:tabular-nums; margin-top:2px; }
.hdr-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px 20px; }
.hdr-item{ display:flex; flex-direction:column; gap:2px; }
.form-label{ font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--rw-slate); }
.form-value{ font-size:13.5px; font-weight:600; color:var(--rw-coal); }

/* ---- grid entry ---- */
.hin{ width:52px; text-align:right; padding:5px 6px; font-variant-numeric:tabular-nums; font-size:13px; }
.hin[readonly]{ background:#f4f4f1; color:var(--rw-slate); }
td.wknd{ background:#f6f6f3; }
th.wknd{ background:#f1f1ed; }
.daycol{ min-width:64px; text-align:center; }
.leaverow td{ background:#fbf7ec; }

/* ---- notes ---- */
.note{ border-left:3px solid var(--rw-info); background:#f2f7fb; padding:11px 14px; border-radius:0 5px 5px 0; font-size:12.5px; line-height:1.6; margin-bottom:14px; color:var(--rw-ink-2); }
.note strong{ color:var(--rw-coal); }
.note.warn{ border-left-color:var(--rw-warning); background:#fdf6e8; }
.note.bad{ border-left-color:var(--rw-danger); background:#fbf0ee; }
.note.ok{ border-left-color:var(--rw-success); background:#eef7f2; }
.rule-tag{ display:inline-block; font-family:ui-monospace,Consolas,monospace; font-size:10px; font-weight:700; color:var(--rw-slate); border:1px solid var(--rw-border); border-radius:2px; padding:0 4px; margin-left:4px; }

/* ---- modal and toast ---- */
.modal{ position:fixed; inset:0; background:rgba(20,18,16,.42); display:none; align-items:center; justify-content:center; z-index:300; padding:20px; }
.modal.show{ display:flex; }
.modal-box{ background:#fff; border-radius:8px; width:min(620px,100%); max-height:86vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,.3); }
.modal-hd{ padding:14px 18px; border-bottom:1px solid var(--rw-border-2); display:flex; justify-content:space-between; align-items:center; }
.modal-hd h3{ margin:0; font-size:15px; font-weight:700; color:var(--rw-coal); }
.modal-bd{ padding:18px; }
.modal-ft{ padding:12px 18px; border-top:1px solid var(--rw-border-2); display:flex; justify-content:flex-end; gap:8px; background:#fbfbf9; }
.toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px); background:#2a2c33; color:#fff; padding:11px 18px; border-radius:6px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:all .22s; z-index:400; max-width:min(560px,92vw); box-shadow:0 10px 30px rgba(0,0,0,.3); }
.toast.show{ opacity:1; transform:translateX(-50%); }
.toast.bad{ background:var(--rw-danger); }

/* ---- axis grid ---- */
table.axis td.hit{ background:#e6f0eb; font-size:11.5px; color:#1f6a4a; font-weight:600; }
table.axis td{ text-align:center; }
table.axis th[scope=row]{ text-align:left; font-family:ui-monospace,Consolas,monospace; font-size:11.5px; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--rw-slate); margin-top:8px; }
@media (max-width:820px){ .rw-body{ padding:16px 14px 48px; } .page-band{ padding:18px 16px 16px; } }
</style>

  <div class="rw-topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <span class="rw-brand">O2C Timesheet<small>prototype &middot; V4 &middot; Aug 2026</small></span>

        <button class="rw-role-btn active" onclick="setRole('Employee',this)">EMPLOYEE</button>

        <button class="rw-role-btn" onclick="setRole('Admin',this)">FINANCE ADMIN</button>
      </div>
      <div class="rw-user-badge">
        <div class="rw-user-avatar" id="userAvatar">SJ</div>
        <div style="display:flex;flex-direction:column;line-height:1.25">
          <span class="rw-user-name" id="userName">Sam Joshuva S</span>

  <div class="rw-drawer-hd">

      <p class="rw-drawer-title" id="drawerTitle">My Timesheet</p>
      <p class="rw-drawer-sub">O2C Time Module</p>

<script>
/* ============================================================
   O2C TIMESHEET MODULE - working prototype
   Rebuilt 21-Aug-2026 against the V4 two-axis status model.

   Everything below reflects decisions taken since the 30-Jul
   prototype. The ones that changed behaviour, not just wording:

     - two status axes, not one list of seven
     - five flags, never deleted, only cleared
     - transitions are DATA (24 rows), not code
     - day-level approval retired: approve the week, days cascade
     - leave loss coverage has NO approval step - assigning is
       the decision, and the status stops at Assigned
     - project loss hours are allocation-scoped, not raw absence
     - leave is apportioned across projects by allocation %
     - roles are derived from HCM/PPM, never typed
     - several periods may be Open at once
     - Cancel is now Reversal
     - Period Control screen removed (reference data only)

   Sample data is the live pod: project 555, seven real people,
   August 2026, with the absences actually booked in Fusion.
   ============================================================ */

var TODAY = new Date(2026, 7, 21);          // Fri 21-Aug-2026
var TODAY_STR = '21-Aug-2026';

/* ---- reference: periods (RULE-017 relaxed - two Open at once) ---- */
var PERIODS = [
  {key:'JUL-2026', name:'July 2026',      y:2026, m:6, status:'Open',   editable:false,
   weeklyCut:'Monday 17:00', deliveryCut:'04-Aug-2026',
   why:'Open, but past its delivery cut-off - visible and read-only.'},
  {key:'AUG-2026', name:'August 2026',    y:2026, m:7, status:'Open',   editable:true,
   weeklyCut:'Monday 17:00', deliveryCut:'03-Sep-2026',
   why:'The month being worked.'},
  {key:'SEP-2026', name:'September 2026', y:2026, m:8, status:'Future', editable:false,
   weeklyCut:'Monday 17:00', deliveryCut:'05-Oct-2026',
   why:'Frozen until it opens (RULE-004).'},
  {key:'JUN-2026', name:'June 2026',      y:2026, m:5, status:'Closed', editable:false,
   weeklyCut:'Monday 17:00', deliveryCut:'03-Jul-2026',
   why:'Confirmed to accrual. Visible, read-only.'}
];
function period(k){ for(var i=0;i<PERIODS.length;i++) if(PERIODS[i].key===k) return PERIODS[i]; return PERIODS[1]; }

/* ---- reference: projects. MAIN code is the O2C main application's ---- */
var PROJECTS = [
  {id:'555', name:'Opportunity To Cash', customer:'RITE Digital', model:'Fixed price',
   main:'PRJ-2026-33', mgr:'RI9001', leaveLoss:true,
   tasks:[{code:'T-100',name:'Delivery'},{code:'T-110',name:'Design'},{code:'T-120',name:'Testing'},{code:'T-900',name:'Internal / Bench'}]},
  {id:'444', name:'RitePulse', customer:'RITE Digital', model:'T&M',
   main:'PRJ-2026-32', mgr:'RI9001', leaveLoss:false,
   tasks:[{code:'R-100',name:'Delivery'},{code:'R-200',name:'Support'}]},
  {id:'PCS10034', name:'PCS Managed Services', customer:'Pearl Consulting', model:'Milestone',
   main:'PRJ-2026-34', mgr:'RI9001', leaveLoss:true,
   tasks:[{code:'P-100',name:'Managed Service'},{code:'P-200',name:'Enhancement'}]}
];
function proj(id){ for(var i=0;i<PROJECTS.length;i++) if(PROJECTS[i].id===id) return PROJECTS[i]; return null; }
function taskName(pid, code){ var p=proj(pid); if(!p) return code;
  for(var i=0;i<p.tasks.length;i++) if(p.tasks[i].code===code) return p.tasks[i].code+' - '+p.tasks[i].name; return code; }

/* ---- reference: workers.
   APP_ROLE is DERIVED, never typed:
     manager    = is PROJECT_MANAGER_ID on an active project
     contractor = WORKER_TYPE Contractor
     employee   = has an active allocation
     none       = in HCM, on none of our projects
   Manager outranks contractor - a contingent worker can run a
   project. The employee/contractor rules read WORKER_TYPE, never
   APP_ROLE, or they would miss a contractor who manages.        */
var WORKERS = [
  {id:'RI2824',  name:'Sam Joshuva S',                type:'Employee',   std:8,
   role:'Associate Project Manager', billing:'Billable',
   alloc:[{p:'555',pct:25},{p:'444',pct:75}]},
  {id:'RI2894',  name:'Santosh Kumar Kanala',         type:'Employee',   std:8,
   role:'Architect Senior', billing:'Billable',
   alloc:[{p:'555',pct:50},{p:'444',pct:50}]},
  {id:'RI2900',  name:'SaiSowmith Kantipudi',         type:'Employee',   std:8,
   role:'Cloud Engineer', billing:'Billable',
   alloc:[{p:'555',pct:100}]},
  {id:'CRI0398', name:'Kishore Krovvidi',             type:'Contractor', std:8,
   role:'Developer', billing:'Unbilled',
   alloc:[{p:'555',pct:100}]},
  {id:'RI2914',  name:'Venkata Bhaskar Reddy Sangana',type:'Employee',   std:9,
   role:'Engineer', billing:'Unbilled',
   alloc:[{p:'555',pct:100}]},
  {id:'7781',    name:'User Rite',                    type:'Employee',   std:8,
   role:'Business Analyst', billing:'Unbilled',
   alloc:[{p:'555',pct:100}]},
  {id:'RI9001',  name:'Navamani Solairajan',          type:'Employee',   std:8,
   role:'Project Manager', billing:'Billable',
   alloc:[{p:'555',pct:25}]}
];
function wkr(id){ for(var i=0;i<WORKERS.length;i++) if(WORKERS[i].id===id) return WORKERS[i]; return null; }
function derivedRole(id){
  var w = wkr(id); if(!w) return 'ROLE_TIME_NONE';
  for(var i=0;i<PROJECTS.length;i++) if(PROJECTS[i].mgr===id) return 'ROLE_TIME_MANAGER';
  if(w.type==='Contractor') return 'ROLE_TIME_CONTRACTOR';
  if(w.alloc && w.alloc.length) return 'ROLE_TIME_EMPLOYEE';
  return 'ROLE_TIME_NONE';
}
function allocPct(empId, pid){
  var w=wkr(empId); if(!w) return 0;
  for(var i=0;i<w.alloc.length;i++) if(w.alloc[i].p===pid) return w.alloc[i].pct;
  return 0;
}
function empsOn(pid){ return WORKERS.filter(function(w){ return allocPct(w.id,pid)>0; }); }

/* ---- absence, read LIVE from Fusion per person.
   These are the ones actually booked on the pod for August.
   A withdrawn absence stays APPROVED in Fusion and is marked
   ORA_WITHDRAWN - so we test the absence status, never the
   approval status, or withdrawn leave reads as real leave.   */
var ABSENCE = [
  {emp:'RI2824', date:'2026-08-07', hours:8, type:'Annual',   status:'Active'},
  {emp:'RI2824', date:'2026-08-10', hours:8, type:'Annual',   status:'Active'},
  {emp:'RI2824', date:'2026-08-14', hours:8, type:'Annual',   status:'Active'},
  {emp:'RI2824', date:'2026-08-19', hours:8, type:'Sick',     status:'Active'},
  {emp:'RI2824', date:'2026-08-20', hours:8, type:'Annual',   status:'ORA_WITHDRAWN'},
  {emp:'RI2894', date:'2026-08-18', hours:8, type:'Annual',   status:'Active'},
  {emp:'RI2894', date:'2026-08-19', hours:8, type:'Annual',   status:'Active'}
];
function absenceOn(empId, iso){
  for(var i=0;i<ABSENCE.length;i++){
    var a=ABSENCE[i];
    if(a.emp===empId && a.date===iso && a.status.indexOf('WITHDRAWN')<0) return a;
  }
  return null;
}
/* Leave apportioned by allocation, quarter-rounded. A full day off
   costs 555 two hours for Sam, not eight. RULE-010.            */
function leaveShare(empId, iso, pid){
  var a = absenceOn(empId, iso); if(!a) return 0;
  return Math.round(a.hours * allocPct(empId,pid) / 100 * 4) / 4;
}

var UNBILLED_REASONS = ['Customer Holiday','Training','Travel','Bench'];
var REJECT_REASONS   = ['Manager driven','Client driven','Absence'];

/* ============================================================
   V4 STATUS ENGINE - the transitions are DATA
   A new status is an INSERT here, not a code change.
   NULL in fromSub / fromAppr means "any state" - and that is

/* ---- week store ---- */
var WEEKSTORE = {};   // key emp|proj|periodKey|weekIdx
var AUDIT = [];       // append-only. Cannot be updated or deleted.
var seqAudit = 1;

function wkey(e,p,pk,i){ return e+'|'+p+'|'+pk+'|'+i; }
function week(e,p,pk,i){
  var k = wkey(e,p,pk,i);
  if(!WEEKSTORE[k]) WEEKSTORE[k] = {
    emp:e, proj:p, pk:pk, idx:i,
    sub:'NotYetSubmitted', appr:'Pending',
    flags:[], versions:[], locked:false, defaultedBy:null, entries:null
  };
  return WEEKSTORE[k];
}
function raiseFlag(w, f){
  if(!f) return;
  for(var i=0;i<w.flags.length;i++){
    if(w.flags[i].flag===f){ w.flags[i].clearedOn = null; return; }  // re-raising does not move setOn
  }
  w.flags.push({flag:f, setOn:TODAY_STR, clearedOn:null});
}
function hasFlag(w,f){ for(var i=0;i<w.flags.length;i++) if(w.flags[i].flag===f && !w.flags[i].clearedOn) return true; return false; }
function activeFlags(w){ return w.flags.filter(function(f){ return !f.clearedOn; }).map(function(f){ return f.flag; }); }

/* The engine. Returns {ok:true, rule} or {ok:false, err} - it never
   fails silently: no matching rule is refused BY NAME (-20034).   */
function applyEvent(w, ev, opt){
  opt = opt || {};
  for(var i=0;i<TRANSITIONS.length;i++){
    var t = TRANSITIONS[i];
    if(t.e !== ev) continue;
    if(t.fs !== null && t.fs !== w.sub) continue;
    if(t.fa !== null && t.fa !== w.appr) continue;
    if(t.late === true && !opt.late) continue;
    if(ev === 'Submit' && t.o === 1 && opt.late) continue;   // on-time rule must not swallow a late submit
    // matched
    if(t.ts) w.sub  = t.ts;
    if(t.ta) w.appr = t.ta;
    raiseFlag(w, t.fl);
    if(t.by)   w.defaultedBy = t.by;
    if(t.lock) w.locked = true;
    if(ev === 'Submit' || ev === 'Revoke') w.locked = false;
    w.versions.push({no:w.versions.length+1, ev:ev, sub:w.sub, appr:w.appr,
                     on:TODAY_STR, by:opt.actor||'-', reason:opt.reason||null});
    AUDIT.push({id:seqAudit++, wk:wkey(w.emp,w.proj,w.pk,w.idx), ev:ev,
                sub:w.sub, appr:w.appr, on:TODAY_STR, by:opt.actor||'-',
                reason:opt.reason||null, trace:opt.trace||null});
    return {ok:true, rule:t};
  }
  return {ok:false, err:'ORA-20034: no transition rule matches ' + ev +
    ' from ' + w.sub + ' / ' + w.appr + '. The engine refuses by name rather than doing nothing.'};
}

/* ---- calendar: weeks CLIPPED to the month.
   A calendar week straddling a month boundary becomes TWO rows, so
   a week never contributes hours to two periods and the month
   cannot double-count.                                          */
var DOW_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function iso(d){
  var m = d.getMonth()+1, day = d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
}
function pretty(d){ return (d.getDate()<10?'0':'')+d.getDate()+'-'+MON_SHORT[d.getMonth()]; }
function buildWeeks(y, m){
  var first = new Date(y,m,1), last = new Date(y,m+1,0), out = [], cur = new Date(first);
  while(cur <= last){
    var dow = cur.getDay();                      // 0 Sun .. 6 Sat
    var backToMon = (dow===0) ? 6 : dow-1;
    var mon = new Date(cur); mon.setDate(cur.getDate()-backToMon);
    var start = (mon < first) ? new Date(first) : new Date(mon);
    var end   = new Date(start); end.setDate(start.getDate() + (6 - ((start.getDay()===0)?6:start.getDay()-1)));
    if(end > last) end = new Date(last);
    var days = [], d = new Date(start);
    while(d <= end){ days.push({d:new Date(d), iso:iso(d), dow:d.getDay(),
                                wknd:(d.getDay()===0||d.getDay()===6)}); d.setDate(d.getDate()+1); }
    out.push({idx:out.length, start:new Date(start), end:new Date(end), days:days,
              label:pretty(start)+' to '+pretty(end)});
    cur = new Date(end); cur.setDate(cur.getDate()+1);
  }
  return out;
}
var WEEKS_BY_PERIOD = {};
function weeksOf(pk){
  if(!WEEKS_BY_PERIOD[pk]){ var p=period(pk); WEEKS_BY_PERIOD[pk]=buildWeeks(p.y,p.m); }
  return WEEKS_BY_PERIOD[pk];
}
function currentWeekIdx(pk){
  var ws = weeksOf(pk);
  for(var i=0;i<ws.length;i++) if(TODAY >= ws[i].start && TODAY <= ws[i].end) return i;
  return ws.length-1;
}

/* ---- prepopulated entries: allocation x working day, less leave ---- */
function buildEntries(empId, pid, pk, widx){
  var w = wkr(empId), wkD = weeksOf(pk)[widx], pct = allocPct(empId,pid);
  var task = proj(pid).tasks[0].code;
  var line = {proj:pid, task:task, type:(w.billing==='Billable'?'Billable':'Non-billable'),
              reason:(w.billing==='Billable'?'':'Bench'), hrs:[]};
  var leave = {proj:pid, task:'LEAVE', type:'Leave', reason:'', hrs:[], isLeave:true};
  var any = false;
  wkD.days.forEach(function(dy){
    if(dy.wknd){ line.hrs.push(0); leave.hrs.push(0); return; }
    var full = Math.round(w.std * pct / 100 * 4)/4;
    var lv   = leaveShare(empId, dy.iso, pid);
    if(lv > 0) any = true;
    line.hrs.push(Math.max(0, Math.round((full - lv)*4)/4));
    leave.hrs.push(lv);
  });
  var lines = [line];
  if(any) lines.push(leave);
  return lines;
}
function entriesFor(empId, pid, pk, widx){
  var w = week(empId,pid,pk,widx);
  if(!w.entries) w.entries = buildEntries(empId,pid,pk,widx);
  return w.entries;
}
function lineTotal(l){ var t=0; for(var i=0;i<l.hrs.length;i++) t+=num(l.hrs[i]); return t; }
function dayTotal(lines, di){ var t=0; lines.forEach(function(l){ t+=num(l.hrs[di]); }); return t; }

/* ---- leave loss coverage.
   LOSS is what THIS PROJECT lost, not what the person was away.
   Three different numbers for one absent day, and only the middle
   one belongs on this screen.                                    */
var LLC = [];
function buildLLC(){
  LLC = [];
  PROJECTS.forEach(function(p){
    if(!p.leaveLoss) return;
    ABSENCE.forEach(function(a){
      if(a.status.indexOf('WITHDRAWN')>=0) return;
      var pct = allocPct(a.emp, p.id); if(!pct) return;
      var w = wkr(a.emp);
      var loss = Math.round(pct/100 * Math.min(1, a.hours/w.std) * w.std * 4)/4;
      if(loss<=0) return;
      LLC.push({proj:p.id, emp:a.emp, date:a.date, absenceHours:a.hours,
                loss:loss, cover:null, status:'Open', coverHours:0});
    });
  });
  LLC.sort(function(x,y){ return x.date<y.date?-1:x.date>y.date?1:0; });
  // the five already assigned on the pod
  var pre = {'RI2824|2026-08-07':'CRI0398','RI2824|2026-08-10':'RI2914',
             'RI2824|2026-08-14':'CRI0398','RI2824|2026-08-19':'CRI0398',
             'RI2894|2026-08-18':'RI2914','RI2894|2026-08-19':'RI2914'};
  LLC.forEach(function(r){
    var k = r.emp+'|'+r.date;
    if(pre[k]){ r.cover = pre[k]; r.status='Assigned'; r.coverHours = r.loss; }
  });
}

var MONTH_SEED = {

    'CRI0398':{b:0,   n:168, l:0},

    'RI2900' :{b:168, n:0,   l:0},

    '7781'   :{b:88,  n:0,   l:0},
    'RI2914' :{b:0,   n:168, l:0}
  }
};
function monthTotals(empId, pid, pk){
  var s = MONTH_SEED[pid+'|'+pk];
  if(s && s[empId]) return {b:s[empId].b, n:s[empId].n, l:s[empId].l};
  var b=0,n=0,l=0;
  weeksOf(pk).forEach(function(wd, i){
    if(allocPct(empId,pid)<=0) return;
    entriesFor(empId,pid,pk,i).forEach(function(ln){
      var t = lineTotal(ln);
      if(ln.isLeave) l+=t; else if(ln.type==='Billable') b+=t; else n+=t;
    });
  });
  return {b:b, n:n, l:l};
}

      '<span class="rule-tag">RULE-004</span><span class="rule-tag">RULE-007</span></div>';
  } else if(w.locked){
    h += '<div class="note bad"><strong>This week is locked.</strong> The weekly cut-off passed before it was submitted, '+
      'so it was defaulted from the prepopulated hours and your salary is on hold until it is submitted.'+
      '<span class="rule-tag">RULE-016</span></div>';

  h += '<div class="card"><div class="card-hd"><h3>Week '+(view.widx+1)+' &middot; '+wd.label+'</h3>'+
    '<span class="sm muted">'+proj(pid).name+' &middot; '+proj(pid).model+'</span></div>'+
    '<div class="card-body tight"><div class="tbl-wrap"><table class="dt"><thead><tr>'+
    '<th>Task</th><th>Type</th><th>Unbilled reason</th>';
  wd.days.forEach(function(dy){
    h += '<th class="daycol'+(dy.wknd?' wknd':'')+'">'+DOW_SHORT[dy.dow]+'<br><span class="muted">'+pretty(dy.d)+'</span></th>';
  });
  h += '<th class="rt">Total</th><th></th></tr></thead><tbody>';

  lines.forEach(function(ln, li){
    var isL = !!ln.isLeave;
    h += '<tr'+(isL?' class="leaverow"':'')+'>';

      h += '<td><strong>Leave</strong> <span class="muted sm">from Fusion Absence</span></td>'+
           '<td><span class="chip chip-nb">Leave</span></td><td class="muted sm">apportioned by allocation</td>';
    } else {
      h += '<td><select onchange="setTask('+li+',this.value)"'+(editable?'':' disabled')+'>'+

        '</select></td>'+
        '<td><select onchange="setType('+li+',this.value)"'+(editable?'':' disabled')+'>'+

        '<td>'+(ln.type==='Non-billable'

            UNBILLED_REASONS.map(function(r){ return '<option'+(r===ln.reason?' selected':'')+'>'+r+'</option>'; }).join('')+'</select>'
          : '<span class="muted sm">-</span>')+'</td>';
    }
    ln.hrs.forEach(function(v, di){
      var dy = wd.days[di];
      h += '<td class="daycol'+(dy.wknd?' wknd':'')+'">'+
        '<input class="hin" value="'+f2(v)+'"'+((editable && !isL)?'':' readonly')+

  });

  h += '</tbody><tfoot><tr><td colspan="3">Day total</td>';
  var grand=0;
  wd.days.forEach(function(dy,di){ var t=dayTotal(lines,di); grand+=t;
    h += '<td class="daycol rt'+(dy.wknd?' wknd':'')+'">'+f2(t)+'</td>'; });

    '<button class="btn btn-outline btn-sm" onclick="addLine()">+ Add line</button>'+

  h += '</div>';

  /* absence panel */
  var abs = ABSENCE.filter(function(a){ return a.emp===e.id && a.date>=iso(wd.start) && a.date<=iso(wd.end); });
  h += '<div class="card"><div class="card-hd"><h3>Absence this week</h3>'+
    '<span class="sm muted">read live from Fusion at page load</span></div><div class="card-body">';

    h += '<p class="muted sm" style="margin:0">Nothing booked in Fusion for this week.</p>';
  } else {
    h += '<div class="tbl-wrap"><table class="dt"><thead><tr><th>Date</th><th>Type</th>'+
      '<th class="rt">Away</th><th class="rt">Charged to '+pid+'</th><th>Fusion status</th></tr></thead><tbody>';
    abs.forEach(function(a){
      var wd2 = new Date(a.date+'T00:00:00');

    'cancelled in Fusion retracts here, along with the hours behind it. The scheduled feed sends no window and can only add.'+

    'It is marked withdrawn on a different column. Filtering on approval status alone lets cancelled leave through as real '+
    'leave, so the module tests the absence status - which is why 20-Aug above is greyed out rather than charged.</div>';
  h += '</div></div>';

  h += '</div>';
  document.getElementById('mainArea').innerHTML = h;
}

function curLines(){ return entriesFor(selfEmp(), view.proj, view.pk, view.widx); }
function curWeek(){ return week(selfEmp(), view.proj, view.pk, view.widx); }

function setHrs(li, di, v){
  var e = wkr(selfEmp()), lines = curLines();
  var n = num(v);
  if(n < 0) n = 0;
  var q = Math.round(n*4)/4;
  if(Math.abs(q-n) > 0.001){
    toast('Hours are recorded in quarters. '+f2(n)+' was rounded to '+f2(q)+'.');
  }
  var prev = lines[li].hrs[di];
  lines[li].hrs[di] = q;
  var tot = dayTotal(lines, di);
  if(tot > e.std){
    lines[li].hrs[di] = prev;
    toast('A day cannot hold more than the '+f2(e.std)+' hours of this person’s shift. '+
          'That day would come to '+f2(tot)+'.', true);
  } else {
    afterEdit();
  }
  renderMyTimesheet();
}
function afterEdit(){
  var w = curWeek();
  if(w.appr==='Approved' || w.appr==='Rejected'){
    var r = applyEvent(w, 'DailyChange', {actor:wkr(selfEmp()).name});
    if(r.ok) toast('That week had already been decided, so the change reopened it and flagged it Adjusted.');
  }
}
function setTask(li,v){ curLines()[li].task=v; afterEdit(); renderMyTimesheet(); }
function setType(li,v){ var l=curLines()[li]; l.type=v; if(v==='Billable') l.reason=''; else if(!l.reason) l.reason=UNBILLED_REASONS[0]; afterEdit(); renderMyTimesheet(); }
function setReason(li,v){ curLines()[li].reason=v; }
function addLine(){
  var p = proj(view.proj), w = curWeek();
  w.entries.push({proj:view.proj, task:p.tasks[0].code, type:'Billable', reason:'',
                  hrs:weeksOf(view.pk)[view.widx].days.map(function(){ return 0; })});
  renderMyTimesheet();
}
function delLine(li){ curWeek().entries.splice(li,1); renderMyTimesheet(); }
function saveTS(){ toast('Draft saved. You can keep editing until the weekly cut-off.'); }

function submitTS(){
  var w = curWeek(), e = wkr(selfEmp()), wd = weeksOf(view.pk)[view.widx];
  var lines = curLines();
  /* RULE-002: no empty week */
  var total = 0; lines.forEach(function(l){ total += lineTotal(l); });
  if(total <= 0){ toast('There are no hours on this week, so there is nothing to submit.', true); return; }
  /* timing is computed HERE, never passed in - the page may have
     worked it out minutes ago and be on the wrong side of 17:00 */
  var cut = new Date(wd.end); cut.setDate(cut.getDate()+1);  // Monday after week end
  var late = TODAY > cut;
  var r = applyEvent(w, 'Submit', {actor:e.name, late:late});
  if(!r.ok){ toast(r.err, true); return; }
  toast(late
    ? 'Submitted after the weekly cut-off, so the week carries a Late submission flag. The week itself is still Submitted.'
    : 'Week submitted. It is now with '+wkr(proj(view.proj).mgr).name+' for approval.');
  renderMyTimesheet();
}
function showAlloc(){
  var e = wkr(selfEmp());
  var h = '<div class="modal-hd"><h3>My allocation</h3><button class="btn btn-ghost btn-sm" onclick="closeModal()">&times;</button></div><div class="modal-bd">'+
    '<p class="sm muted" style="margin-top:0">Allocation comes from PPM Project Team, and it is what splits your day across projects. '+
    'It is also what makes a day of leave cost each project a different number of hours.</p>'+
    '<div class="tbl-wrap"><table class="dt"><thead><tr><th>Project</th><th>Model</th><th class="rt">Allocation</th>'+
    '<th class="rt">Hours/day</th><th class="rt">A day of leave costs</th></tr></thead><tbody>';
  var tot=0;
  e.alloc.forEach(function(a){
    tot += a.pct;
    var hpd = Math.round(e.std*a.pct/100*4)/4;
    h += '<tr><td class="mono">'+a.p+'</td><td>'+proj(a.p).model+'</td><td class="rt">'+a.pct+'%</td>'+
      '<td class="rt">'+f2(hpd)+'</td><td class="rt">'+f2(hpd)+'</td></tr>';

  h += '</tbody><tfoot><tr><td colspan="2">Total</td><td class="rt">'+tot+'%</td>'+
    '<td class="rt">'+f2(e.std)+'</td><td class="rt">'+f2(e.std)+'</td></tr></tfoot></table></div>'+
    '</div><div class="modal-ft"><button class="btn btn-primary" onclick="closeModal()">Close</button></div>';
  openModal(h);
}

  team.forEach(function(e){ ws.forEach(function(x,i){
    var w = week(e.id,pid,view.pk,i); cnt[w.sub]++; if(w.appr==='Approved') cnt.Approved++; if(w.appr==='Rejected') cnt.Rejected++;

    statCard('Awaiting you', cnt.Submitted+cnt.LateSubmission, 'submitted, not decided')+
    statCard('Not submitted', cnt.NotYetSubmitted, 'employee has not sent it')+

    statCard('Approved', cnt.Approved, '')+
    '</div>';

  h += '<div class="note"><strong>Weeks are clipped to the month.</strong> A calendar week straddling a month boundary '+
    'becomes two rows, so a week never contributes hours to two periods and the month cannot double-count. That is why '+
    ws.length+' weeks appear for '+p.name+' and the first and last are short.</div>';

  h += '<div class="card"><div class="card-body tight"><div class="tbl-wrap"><table class="dt"><thead><tr>'+
    '<th>Employee</th><th>Role on client</th>';
  ws.forEach(function(x,i){ h += '<th class="daycol">W'+(i+1)+'<br><span class="muted sm">'+x.label+'</span></th>'; });
  h += '<th class="rt">Month hrs</th><th></th></tr></thead><tbody>';

  team.forEach(function(e){

    h += '<tr><td><strong>'+e.name+'</strong><br><span class="mono muted sm">'+e.id+' &middot; '+e.type+'</span></td>'+

    ws.forEach(function(x,i){
      var w = week(e.id,pid,view.pk,i);
      h += '<td class="daycol" style="text-align:center">'+
        '<button class="btn btn-ghost btn-sm" style="flex-direction:column;gap:2px" onclick="openDetail(\''+e.id+'\','+i+')">'+

function openDetail(empId, widx){ view.mgrEmp=empId; view.mgrWeek=widx; go('detail'); }

function runCutoffs(){
  var pid = view.proj, ws = weeksOf(view.pk), n=0, held=0;
  empsOn(pid).forEach(function(e){
    ws.forEach(function(x,i){
      if(x.end >= TODAY) return;                       // week not finished
      var cut = new Date(x.end); cut.setDate(cut.getDate()+1);
      if(TODAY <= cut) return;                          // cut-off not passed
      var w = week(e.id,pid,view.pk,i);
      var r = applyEvent(w, 'WeeklyCutoff', {actor:'SCHEDULER'});
      if(r.ok){ n++; if(e.type!=='Contractor') held++; }
      else if(TODAY > new Date(period(view.pk).deliveryCut.replace(/-/g,' '))){
        // the DELIVERY cut-off is the manager's, and it is a month-level date.
        // Firing it while it is still in the future would blame a manager who
        // is not late yet -- the same fault as a NULL FROM column.
        var r2 = applyEvent(w, 'DeliveryCutoff', {actor:'SCHEDULER'});
        if(r2.ok) n++;
      }
    });
  });
  toast(n ? (n+' week(s) defaulted. '+held+' salary hold(s) raised - the weekly cut-off holds pay, the delivery cut-off never does.')
          : 'Nothing to default: every finished week is already past its cut-off state.');
  go('team');
}

    hdrItem('Flags', activeFlags(w).length?flagChips(w):'<span class="muted sm">none</span>')+
    hdrItem('Defaulted by', w.defaultedBy || '<span class="muted sm">-</span>')+
    hdrItem('Versions', w.versions.length)+
    hdrItem('Delivery cut-off', p.deliveryCut)+
    '</div></div></div>';

  if(!canDecide && w.sub==='NotYetSubmitted'){
    h += '<div class="note warn"><strong>Nothing to approve.</strong> This week has not been submitted, and the '+
      'engine refuses Approve from NotYetSubmitted by name. That guard is deliberate: it was once seeded as '+
      '"any state" on the reasoning that the screen would never offer the button, and the REST endpoint is directly '+
      'callable, so the screen is not the control.</div>';
  }

  /* day grid */
  h += '<div class="card"><div class="card-hd"><h3>Week '+(widx+1)+' &middot; '+wd.label+'</h3>'+
    '<span class="sm muted">day level, read-only - approval is at the week</span></div>'+
    '<div class="card-body tight"><div class="tbl-wrap"><table class="dt"><thead><tr><th>Task</th><th>Type</th>';
  wd.days.forEach(function(dy){ h += '<th class="daycol'+(dy.wknd?' wknd':'')+'">'+DOW_SHORT[dy.dow]+'<br><span class="muted">'+pretty(dy.d)+'</span></th>'; });
  h += '<th class="rt">Total</th></tr></thead><tbody>';
  lines.forEach(function(ln){
    h += '<tr'+(ln.isLeave?' class="leaverow"':'')+'>'+
      '<td>'+(ln.isLeave?'<strong>Leave</strong> <span class="muted sm">apportioned</span>':taskName(pid,ln.task))+'</td>'+
      '<td>'+(ln.isLeave?'<span class="chip chip-nb">Leave</span>'
        :'<span class="chip '+(ln.type==='Billable'?'chip-approved':'chip-nb')+'">'+ln.type+'</span>'+
          (ln.reason?' <span class="sm muted">'+ln.reason+'</span>':''))+'</td>';
    ln.hrs.forEach(function(v,di){ h += '<td class="daycol rt'+(wd.days[di].wknd?' wknd':'')+'">'+f2(v)+'</td>'; });
    h += '<td class="rt"><strong>'+f2(lineTotal(ln))+'</strong></td></tr>';
  });
  h += '</tbody><tfoot><tr><td colspan="2">Day total</td>';
  var g=0; wd.days.forEach(function(dy,di){ var t=dayTotal(lines,di); g+=t;
    h += '<td class="daycol rt'+(dy.wknd?' wknd':'')+'">'+f2(t)+'</td>'; });
  h += '<td class="rt">'+f2(g)+'</td></tr></tfoot></table></div></div></div>';

  /* version trail */
  h += '<div class="card"><div class="card-hd"><h3>Version trail</h3>'+
    '<span class="sm muted">every event, numbered</span></div><div class="card-body tight">';
  if(!w.versions.length){
    h += '<div class="card-body"><p class="muted sm" style="margin:0">Nothing has happened to this week yet.</p></div>';
  } else {
    h += '<div class="tbl-wrap"><table class="dt"><thead><tr><th>#</th><th>Event</th><th>Submission</th>'+
      '<th>Approval</th><th>By</th><th>On</th><th>Reason</th></tr></thead><tbody>';
    w.versions.forEach(function(v){
      h += '<tr><td class="mono">'+v.no+'</td><td><strong>'+v.ev+'</strong></td>'+
        '<td>'+subChip(v.sub)+'</td><td>'+apprChip(v.appr)+'</td>'+
        '<td class="sm">'+v.by+'</td><td class="sm mono">'+v.on+'</td>'+
        '<td class="sm">'+(v.reason?esc(v.reason):'<span class="muted">-</span>')+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div></div>';

  h += '<div class="note"><strong>Day-level approval is retired.</strong> Approve the week and every day in it '+
    'approves, in one statement; reject it and every day rejects. The old per-day procedures still exist only so '+
    'the REST handlers give a message rather than a missing-identifier error.</div>';
  h += '</div>';
  document.getElementById('mainArea').innerHTML = h;
}

/* ---- PAGE-006 Leave Loss Coverage ---- */
function renderLLC(){
  var pid = view.proj, p = proj(pid);
  var rows = LLC.filter(function(r){ return r.proj===pid; });

  var h = band('PAGE-006 &middot; Team', 'Leave Loss Coverage',
    'On a fixed-price project the client is owed a level of effort whoever takes leave. This lists every absent day '+
    'on the project, what the project actually lost, and who picked the work up.');
  h += '<div class="rw-body">';
  h += '<div class="rw-toolbar">'+
    '<div><label class="fl">Project</label><select onchange="view.proj=this.value;go(\'llc\')">'+
      mgrProjects().map(function(x){ return '<option value="'+x.id+'"'+(x.id===pid?' selected':'')+'>'+x.id+' - '+x.name+
        (x.leaveLoss?'':' (not applicable)')+'</option>'; }).join('')+
    '</select></div>'+
    '<div><label class="fl">Period</label>'+periodPicker('setPeriod(this.value)')+'</div>'+
    '</div>';

  if(!p.leaveLoss){
    h += '<div class="note warn"><strong>'+pid+' is a '+p.model+' project.</strong> Leave loss coverage applies where the '+
      'client is owed a level of effort regardless of who delivers it. On '+p.model+' the client is billed for the hours '+
      'actually worked, so there is nothing to recover.</div></div>';
    document.getElementById('mainArea').innerHTML = h; return;
  }

  var totLoss=0, covered=0;
  rows.forEach(function(r){ totLoss+=r.loss; if(r.cover) covered++; });
  h += '<div class="stat-row">'+
    statCard('Absent days', rows.length, 'on this project')+
    statCard('Project loss', f2(totLoss), 'hours')+
    statCard('Covered', covered+' / '+rows.length, '')+
    statCard('Uncovered', rows.length-covered, 'surfaced, not hidden')+
    '</div>';

  h += '<div class="card"><div class="card-body tight"><div class="tbl-wrap"><table class="dt"><thead><tr>'+
    '<th>Date</th><th>Day</th><th>Absent</th><th class="rt">Away</th><th class="rt">Project loss</th>'+
    '<th>Covered by</th><th>Status</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r, ri){
    var d = new Date(r.date+'T00:00:00');
    var idx = LLC.indexOf(r);
    var eligible = empsOn(pid).filter(function(x){
      if(x.id===r.emp) return false;
      if(absenceOn(x.id, r.date)) return false;                       // cannot cover while absent
      for(var i=0;i<LLC.length;i++){                                   // one person, one cover per day
        if(LLC[i]!==r && LLC[i].date===r.date && LLC[i].cover===x.id) return false;
      }
      return true;
    });
    h += '<tr><td class="mono">'+pretty(d)+'</td><td class="muted sm">'+DOW_SHORT[d.getDay()].toUpperCase()+'</td>'+
      '<td><strong>'+wkr(r.emp).name+'</strong><br><span class="mono muted sm">'+r.emp+' &middot; '+allocPct(r.emp,pid)+'% here</span></td>'+
      '<td class="rt muted">'+f2(r.absenceHours)+'</td>'+
      '<td class="rt"><strong>'+f2(r.loss)+'</strong></td>'+
      '<td><select onchange="assignCover('+idx+',this.value)">'+
        '<option value="">- not assigned -</option>'+
        eligible.map(function(x){ return '<option value="'+x.id+'"'+(x.id===r.cover?' selected':'')+'>'+x.name+'</option>'; }).join('')+
        (r.cover && !eligible.some(function(x){return x.id===r.cover;})
          ? '<option value="'+r.cover+'" selected>'+wkr(r.cover).name+'</option>' : '')+
        '</select></td>'+
      '<td>'+(r.status==='Assigned'
        ? '<span class="chip chip-approved">Assigned</span>'
        : '<span class="chip chip-draft">Open</span>')+'</td>'+
      '<td>'+(r.cover?'<button class="btn btn-ghost btn-sm" onclick="retractCover('+idx+')">Retract</button>':'')+'</td></tr>';
  });
  h += '</tbody><tfoot><tr><td colspan="4">'+rows.length+' absent days</td>'+
    '<td class="rt">'+f2(totLoss)+'</td><td colspan="3">'+covered+' assigned</td></tr></tfoot></table></div></div></div>';

  h += '<div class="card"><div class="card-hd"><h3>One absent day, three numbers</h3></div><div class="card-body tight">'+
    '<div class="tbl-wrap"><table class="dt"><thead><tr><th>Number</th><th class="rt">Sam, 19 Aug</th><th>Is about</th></tr></thead><tbody>'+
    '<tr><td>Hours the person was away</td><td class="rt">8.00</td><td>the <strong>person</strong></td></tr>'+
    '<tr><td>Hours <em>this project</em> lost</td><td class="rt">2.00</td><td>the <strong>project</strong> - Sam is 25% here</td></tr>'+
    '<tr><td>Hours the cover actually moved</td><td class="rt">2.00</td><td>the <strong>recovery</strong></td></tr>'+
    '</tbody></table></div></div></div>';

  h += '<div class="note ok"><strong>Assigning the cover is the decision - there is no approval step.</strong> '+
    'The manager doing it is the person who would approve it, so the status stops at <em>Assigned</em>. '+
    'This screen used to carry an Approve action and an invoice annexure; both were removed. '+
    'The annexure belongs downstream, from the confirmed month.</div>';
  h += '<div class="note"><strong>Coverage is a statement, not a transfer of hours.</strong> '+
    'Recording that somebody picked the work up does not move hours off one timesheet onto another - both people book '+
    'their own time, and the module must not invent hours neither of them typed.</div>';
  h += '<div class="note warn"><strong>Two people may be uncovered on the same day; one person may not cover two.</strong> '+
    'The constraint is on the cover, not the absence - so the dropdown above hides anyone already covering that date, '+
    'and anyone who is themselves absent.</div>';
  h += '</div>';
  document.getElementById('mainArea').innerHTML = h;
}
function assignCover(i, empId){
  var r = LLC[i];
  if(!empId){ retractCover(i); return; }
  r.cover = empId; r.status='Assigned'; r.coverHours = r.loss;
  toast(wkr(empId).name+' recorded as covering '+wkr(r.emp).name+' on '+r.date+'. No hours were moved.');
  go('llc');
}
function retractCover(i){
  var r = LLC[i];
  if(r.status!=='Open' && r.status!=='Assigned'){ toast('Only an Open or Assigned row can be retracted.', true); return; }
  r.cover=null; r.status='Open'; r.coverHours=0;
  toast('Coverage retracted. The day is uncovered again and shows as such.');
  go('llc');
}

/* ---- PAGE-007 Salary Stopping ---- */
function renderSalStop(){
  var pid = view.proj, ws = weeksOf(view.pk);
  var holds = [];
  empsOn(pid).forEach(function(e){
    ws.forEach(function(x,i){
      var w = week(e.id,pid,view.pk,i);
      if(w.sub==='Defaulted' && w.defaultedBy==='EMPLOYEE'){
        holds.push({emp:e, widx:i, label:x.label, contractor:(e.type==='Contractor')});
      }
    });
  });
  var active = holds.filter(function(x){ return !x.contractor; });

  var h = band('PAGE-007 &middot; Team', 'Salary Stopping',
    'Two cut-offs exist and only one of them holds pay. This screen shows the holds the weekly cut-off raised, '+
    'and who is exempt.');
  h += '<div class="rw-body">';
  h += '<div class="rw-toolbar">'+
    '<div><label class="fl">Project</label><select onchange="view.proj=this.value;go(\'salstop\')">'+
      mgrProjects().map(function(x){ return '<option value="'+x.id+'"'+(x.id===pid?' selected':'')+'>'+x.id+' - '+x.name+'</option>'; }).join('')+
    '</select></div>'+
    '<div><label class="fl">Period</label>'+periodPicker('setPeriod(this.value)')+'</div>'+
    '<div style="flex:1"></div>'+
    '<button class="btn btn-outline" onclick="runCutoffs()">Run cut-offs now</button>'+
    '</div>';

  h += '<div class="card"><div class="card-hd"><h3>What each cut-off does</h3></div><div class="card-body tight">'+
    '<div class="tbl-wrap"><table class="dt"><thead><tr><th>Cut-off</th><th>Whose lateness</th>'+
    '<th>Effect on the week</th><th>Holds salary?</th></tr></thead><tbody>'+
    '<tr><td><strong>Weekly</strong></td><td>The employee&rsquo;s</td><td>Defaults it and <strong>locks</strong> it</td>'+
    '<td><span class="chip chip-rejected">Yes</span></td></tr>'+
    '<tr><td><strong>Delivery</strong></td><td>The manager&rsquo;s</td><td>Defaults it, stays editable</td>'+
    '<td><span class="chip chip-approved">Never</span></td></tr>'+
    '</tbody></table></div></div></div>';

  h += '<div class="stat-row">'+
    statCard('Holds active', active.length, 'employees')+
    statCard('Exempt', holds.length-active.length, 'contractors')+
    statCard('Manager-defaulted', ws.length? countManagerDefaults(pid) : 0, 'no hold raised')+
    '</div>';

  h += '<div class="card"><div class="card-hd"><h3>Salary holds</h3>'+
    '<span class="sm muted">released automatically on submission</span></div><div class="card-body tight">';
  if(!holds.length){
    h += '<div class="card-body"><p class="muted sm" style="margin:0">No weekly cut-off has defaulted a week on this '+
      'project yet. Use <em>Run cut-offs now</em> to see what the scheduler would do today.</p></div>';
  } else {
    h += '<div class="tbl-wrap"><table class="dt"><thead><tr><th>Employee</th><th>Worker type</th><th>Week</th>'+
      '<th>Defaulted by</th><th>Hold</th><th></th></tr></thead><tbody>';
    holds.forEach(function(x){
      h += '<tr><td><strong>'+x.emp.name+'</strong><br><span class="mono muted sm">'+x.emp.id+'</span></td>'+
        '<td>'+x.emp.type+'</td><td class="sm">Week '+(x.widx+1)+' &middot; '+x.label+'</td>'+
        '<td><span class="chip chip-defaulted">EMPLOYEE</span></td>'+
        '<td>'+(x.contractor
          ? '<span class="chip chip-closed">Exempt</span>'
          : '<span class="chip chip-rejected">On hold</span>')+'</td>'+
        '<td class="sm muted">'+(x.contractor?'Contractors are not on payroll':'Releases when the week is submitted')+'</td></tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '</div></div>';

  h += '<div class="note"><strong>A manager&rsquo;s lateness must never cost the employee.</strong> '+
    'The weekly cut-off writes EMPLOYEE and holds pay; the delivery cut-off writes MANAGER and does not. '+
    'The hold and its automatic release both filter on EMPLOYEE, so a manager-defaulted week never reaches payroll.'+
    '<span class="rule-tag">RULE-016</span><span class="rule-tag">RA-012</span></div>';
  h += '<div class="note warn"><strong>The employee cannot see this screen.</strong> RA-011 asked for a self-view and '+
    'it was recorded as manager-only. Worth revisiting - somebody whose pay is held has an obvious interest in knowing why.</div>';
  h += '</div>';
  document.getElementById('mainArea').innerHTML = h;
}
function countManagerDefaults(pid){
  var n=0;
  empsOn(pid).forEach(function(e){ weeksOf(view.pk).forEach(function(x,i){
    var w = week(e.id,pid,view.pk,i); if(w.defaultedBy==='MANAGER') n++; }); });
  return n;
}

function confirmDialog(){
  var pid = view.proj, ws = weeksOf(view.pk), team = empsOn(pid);
  var pending = 0, defaulted = 0, total = 0;
  team.forEach(function(e){ ws.forEach(function(x,i){
    var w = week(e.id,pid,view.pk,i); total++;
    if(w.appr!=='Approved') pending++;
    if(w.sub==='Defaulted') defaulted++;
  }); });
  var canNormal = (pending===0);

  var h = '<div class="modal-hd"><h3>Confirm '+period(view.pk).name+' &middot; '+pid+'</h3>'+
    '<button class="btn btn-ghost btn-sm" onclick="closeModal()">&times;</button></div><div class="modal-bd">'+
    '<div class="hdr-grid" style="margin-bottom:14px">'+
      hdrItem('Weeks', total)+hdrItem('Not approved', pending)+hdrItem('Defaulted', defaulted)+
    '</div>'+
    '<label class="fl">Confirmation type</label>'+
    '<select id="cfType" style="width:100%">'+
      '<option value="Normal"'+(canNormal?'':' disabled')+'>Normal - every week approved'+(canNormal?'':' (blocked: '+pending+' outstanding)')+'</option>'+
      '<option value="Advance closure"'+(canNormal?'':' selected')+'>Advance closure - go out anyway</option>'+
    '</select>'+
    '<div class="note'+(canNormal?'':' warn')+'" style="margin:14px 0 0">'+
      (canNormal
        ? '<strong>Every week is approved</strong>, so this is an ordinary confirmation.'
        : '<strong>'+pending+' week(s) are not approved.</strong> RULE-020 blocks a normal confirm. Advance closure is '+
          'the explicit exception: defaulted hours are treated as approved so the month can go out, and the '+
          'confirmation records that it went out this way. The payload has to mirror that - it once filtered on '+
          'approved days only, so an advance closure confirmed successfully and handed accrual an empty batch, '+
          'which reads as "no time this month" rather than "nobody approved it".')+
    '</div>'+
    '<div class="note" style="margin:10px 0 0">Confirming freezes the month. A later correction does not restate it - '+
    'it travels separately as a reversal and a replacement, so the number accrual already posted stays put.</div>'+
    '</div><div class="modal-ft"><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-go" onclick="confirmGo()">Confirm month</button></div>';
  openModal(h);
}
function confirmGo(){
  var type = document.getElementById('cfType').value;
  var pid = view.proj, pk = view.pk, ws = weeksOf(pk), team = empsOn(pid);
  var cid = seqConfirm++, rows = 0, hours = 0;
  var p = proj(pid);

  team.forEach(function(e){
    ws.forEach(function(x, wi){
      var w = week(e.id,pid,pk,wi);
      /* the payload mirrors the gate: an advance closure accepts a
         week that is still Pending, or the batch comes out empty */
      var take = (w.appr==='Approved') || (type==='Advance closure' && w.appr==='Pending');
      if(!take) return;
      entriesFor(e.id,pid,pk,wi).forEach(function(ln){
        ln.hrs.forEach(function(v, di){
          if(num(v)===0) return;
          var dy = x.days[di];
          IFACE.push({
            confirmId:cid, period:pk, y:period(pk).y, m:period(pk).m+1,
            mainId:p.main, mainNo:p.main,               /* denormalised on purpose */
            projNo:pid, projName:p.name, customer:p.customer, model:p.model,
            emp:e.id, empName:e.name, type:e.type, role:e.role,
            date:dy.iso, day:DOW_SHORT[dy.dow].toUpperCase(),
            task:(ln.isLeave?'LEAVE':ln.task), taskName:(ln.isLeave?'Leave':taskName(pid,ln.task)),
            entryType:(w.sub==='Defaulted'?'Default':'Actual'),
            flag:(activeFlags(w)[0]||null),
            bill:(!ln.isLeave && ln.type==='Billable')?num(v):0,
            nonbill:(!ln.isLeave && ln.type!=='Billable')?num(v):0,
            leave:(ln.isLeave)?num(v):0
          });
          rows++; hours += num(v);
        });
      });
    });
  });

  CONFIRMS.push({id:cid, proj:pid, pk:pk, type:type, on:TODAY_STR,
                 by:wkr(SELF.Manager).name, rows:rows, hours:hours});
  closeModal();
  if(rows===0){
    toast('Confirmed, but the batch is empty - nothing matched the payload filter. That is the failure mode worth '+
          'watching: it reads as "no time this month".', true);
  } else {
    toast('Month confirmed as '+type+'. '+rows+' interface rows, '+f2(hours)+' hours handed to accrual.');
  }
  go('summary');
}

    'not to request during build. Bounded by a 24-hour expiry, deletion on logout and one session per user - but '+
    'genuinely weaker than it should be. The fix is one line plus the grant, and existing sessions keep working '+
    'through it.</div>';
  h += '</div>';
  document.getElementById('mainArea').innerHTML = h;
}

/* ============================================================
   STATUS AND FLAG MODEL  (V4)
   ============================================================ */
function renderModel(){
  var h = band('Reference', 'Status &amp; Flag Model (V4)',
    'A week&rsquo;s state is not one status. It is who has done their part, crossed with what the manager decided. '+
    'Collapsing them into one list is what produced statuses like "rejected but also late".');
  h += '<div class="rw-body">';

  /* axis */
  var CELLS = {
    'NotYetSubmitted|Pending':'start',
    'Submitted|Pending':'awaiting', 'Submitted|Approved':'done', 'Submitted|Rejected':'sent back',
    'LateSubmission|Pending':'awaiting', 'LateSubmission|Approved':'done', 'LateSubmission|Rejected':'sent back',
    'Defaulted|Pending':'employee late', 'Defaulted|Approved':'force-closed', 'Defaulted|ManagerDefaulted':'manager late'
  };
  h += '<div class="card"><div class="card-hd"><h3>Two axes</h3>'+
    '<span class="sm muted">submission down the side, approval across the top</span></div>'+
    '<div class="card-body tight"><div class="tbl-wrap"><table class="dt axis"><thead><tr><th></th>'+
    APPR_STATES.map(function(a){ return '<th style="text-align:center">'+a+'</th>'; }).join('')+
    '</tr></thead><tbody>'+
    SUB_STATES.map(function(s){ return '<tr><th scope="row">'+s+'</th>'+
      APPR_STATES.map(function(a){ var c=CELLS[s+'|'+a];
        return c ? '<td class="hit">'+c+'</td>' : '<td class="muted">&middot;</td>'; }).join('')+'</tr>'; }).join('')+
    '</tbody></table></div></div></div>';

  /* flags */
  h += '<div class="card"><div class="card-hd"><h3>Five flags</h3>'+
    '<span class="sm muted">each a timestamped row, never a column</span></div><div class="card-body tight">'+
    '<div class="tbl-wrap"><table class="dt"><thead><tr><th>Flag</th><th>Raised when</th></tr></thead><tbody>'+
    [['Defaulted','The weekly cut-off passed with nothing submitted. Locks the week and holds pay.'],
     ['LateSubmission','Submitted after the cut-off, or resubmitted after a rejection. The week is still Submitted.'],
     ['Overridden','A manager corrected the hours and approved in one action. Reason is mandatory.'],
     ['Adjusted','A change after a decision, an advance closure, or a reversal. All three surface here.'],
     ['ManagerDefaulted','The delivery cut-off passed with the week awaiting approval. Never holds pay.']]
      .map(function(r){ return '<tr><td><span class="flag-chip">'+r[0]+'</span></td><td class="sm">'+r[1]+'</td></tr>'; }).join('')+
    '</tbody></table></div></div></div>';
  h += '<div class="note"><strong>A flag is never deleted.</strong> Clearing one records when it cleared, and '+
    're-raising does not move the original timestamp - so the history of a week survives the week being fixed.</div>';

  /* transitions */
  h += '<div class="card"><div class="card-hd"><h3>The rules are data &mdash; '+TRANSITIONS.length+' rows</h3>'+
    '<span class="sm muted">a new status is an INSERT, not a code change</span></div>'+
    '<div class="card-body tight"><div class="tbl-wrap"><table class="dt"><thead><tr>'+
    '<th>#</th><th>Event</th><th>From submission</th><th>From approval</th><th>To submission</th>'+
    '<th>To approval</th><th>Flag</th><th>Note</th></tr></thead><tbody>'+
    TRANSITIONS.map(function(t){ return '<tr><td class="mono">'+t.o+'</td><td><strong>'+t.e+'</strong></td>'+
      '<td class="sm">'+(t.fs||'<span class="muted">any</span>')+'</td>'+
      '<td class="sm">'+(t.fa||'<span class="muted">any</span>')+'</td>'+
      '<td class="sm">'+(t.ts||'<span class="muted">unchanged</span>')+'</td>'+
      '<td class="sm">'+(t.ta||'<span class="muted">unchanged</span>')+'</td>'+
      '<td>'+(t.fl?'<span class="flag-chip">'+t.fl+'</span>':'<span class="muted">-</span>')+'</td>'+
      '<td class="sm muted">'+(t.n||'')+'</td></tr>'; }).join('')+
    '</tbody></table></div></div></div>';

  h += '<div class="note warn"><strong>Leave the FROM columns guarded.</strong> A null means "any state", and that '+
    'caused the same bug twice in opposite directions - the delivery cut-off blamed a manager for not approving a '+
    'week nobody submitted, and Approve let them approve it. Both were seeded null because "the screen would never '+
    'do that". The screen is not the control.</div>';
  h += '<div class="note"><strong>Nothing fails quietly.</strong> An event with no matching rule is refused by name '+
    'rather than doing nothing. Try Approve on a week that has not been submitted - the message names the states it '+
    'was in.</div>';
  h += '<div class="note"><strong>There is no Closed.</strong> A week is not editable because the cut-off passed; a '+
    'rejection reopens it as LateSubmission; a change after the delivery cut-off is an adjustment. Confirmation lives '+
    'on the month, not on the week.</div>';
  h += '</div>';
  document.getElementById('mainArea').innerHTML = h;
}

/* ============================================================
   BOOT
   ============================================================ */
function seed(){
  buildLLC();
  var pk = 'AUG-2026', ws = weeksOf(pk), pid = '555';
  var cur = currentWeekIdx(pk);
  empsOn(pid).forEach(function(e){
    ws.forEach(function(x, i){
      var w = week(e.id, pid, pk, i);
      entriesFor(e.id, pid, pk, i);
      if(i < cur - 1){
        applyEvent(w, 'Submit', {actor:e.name});
        applyEvent(w, 'Approve', {actor:wkr(SELF.Manager).name});
      } else if(i === cur - 1){
        /* last full week: a spread worth demoing */
        if(e.id==='RI2824' || e.id==='RI2900'){ applyEvent(w,'Submit',{actor:e.name}); }
        else if(e.id==='RI2894'){ applyEvent(w,'Submit',{actor:e.name, late:true}); }
        else if(e.id==='RI2914'){ applyEvent(w,'WeeklyCutoff',{actor:'SCHEDULER'}); }
        else if(e.id==='CRI0398'){ applyEvent(w,'WeeklyCutoff',{actor:'SCHEDULER'}); }
        else { applyEvent(w,'Submit',{actor:e.name}); applyEvent(w,'Approve',{actor:wkr(SELF.Manager).name}); }
      }
      /* the current week and anything after stay NotYetSubmitted */
    });
  });
  /* July: everything defaulted and never approved - the real state on the pod */
  weeksOf('JUL-2026').forEach(function(x, i){
    empsOn(pid).forEach(function(e){
      var w = week(e.id, pid, 'JUL-2026', i);
      entriesFor(e.id, pid, 'JUL-2026', i);
      applyEvent(w, 'WeeklyCutoff', {actor:'SCHEDULER'});
    });
  });
}
seed();
renderSidebar();
go('mytime');
document.addEventListener('keydown', function(ev){ if(ev.key==='Escape'){ closeModal(); toggleDrawer(false); } });

</script>
