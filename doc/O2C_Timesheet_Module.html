<title>O2C Timesheet Walkthrough</title>
<style>
:root{
  --rw-coal:#2a2c33; --rw-ink-2:#3a3c44; --rw-slate:#5b5d65; --rw-oyster:#f6f6f4; --rw-paper:#ffffff;
  --rw-border:#dcdbd7; --rw-border-2:#eceae6; --rw-hover:#f0efeb;
  --rw-danger:#a73d2f; --rw-success:#1f6a4a; --rw-warning:#a26a0a; --rw-info:#1f5d83;
  --shell-header-height:56px;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif; }
body{ color:var(--rw-ink-2); background:var(--rw-oyster); }
.rw-app{ display:flex; flex-direction:column; height:100vh; overflow:hidden; background:var(--rw-oyster); }

/* ---- top bar ---- */
.rw-topbar{ height:var(--shell-header-height); min-height:var(--shell-header-height); background:#3a3530; border-bottom:3px solid #a23541; display:flex; align-items:center; justify-content:space-between; padding:0 20px; gap:12px; flex-shrink:0; }
.rw-brand{ font-size:16px; font-weight:700; color:#fff; letter-spacing:.01em; }
.rw-brand small{ font-weight:600; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.45); margin-left:8px; }
.rw-topbar-right{ display:flex; align-items:center; gap:12px; }
.rw-role-switch{ display:flex; background:rgba(255,255,255,0.08); border-radius:6px; padding:2px; gap:2px; }
.rw-role-btn{ border:none; background:transparent; color:rgba(255,255,255,0.65); font-size:11.5px; font-weight:700; padding:6px 12px; border-radius:5px; cursor:pointer; font-family:inherit; }
.rw-role-btn.active{ background:#fff; color:#1a1c22; }
.rw-user-badge{ display:flex; align-items:center; gap:8px; }
.rw-user-avatar{ width:28px; height:28px; border-radius:50%; background:#1f6a4a; color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
.rw-user-name{ font-size:13px; font-weight:600; color:rgba(255,255,255,0.92); }
.rw-user-role{ font-size:9.5px; font-weight:700; letter-spacing:.06em; color:rgba(255,255,255,0.6); background:rgba(255,255,255,0.12); padding:2px 7px; border-radius:3px; }
.rw-hamburger{ background:transparent; border:none; color:#fff; font-size:20px; cursor:pointer; padding:4px 6px; line-height:1; }
.rw-main{ flex:1; overflow-y:auto; overflow-x:hidden; }

/* ---- drawer ---- */
.rw-drawer-overlay{ position:fixed; inset:0; background:rgba(20,18,16,0.30); z-index:150; opacity:0; pointer-events:none; transition:opacity .2s; }
.rw-drawer-overlay.open{ opacity:1; pointer-events:auto; }
.rw-drawer{ position:fixed; top:0; right:0; height:100vh; width:280px; background:#3a3530; color:#fff; z-index:200; display:flex; flex-direction:column; transform:translateX(100%); transition:transform .24s ease; box-shadow:-8px 0 28px rgba(0,0,0,0.22); }
.rw-drawer.open{ transform:none; }
.rw-drawer-hd{ height:var(--shell-header-height); min-height:var(--shell-header-height); padding:0 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.1); }
.rw-drawer-title{ font-size:14px; font-weight:700; margin:0; }
.rw-drawer-sub{ font-size:9.5px; color:rgba(255,255,255,0.5); margin:2px 0 0; letter-spacing:.06em; text-transform:uppercase; }
.rw-drawer-close{ background:none; border:none; color:rgba(255,255,255,0.7); font-size:22px; cursor:pointer; line-height:1; }
.rw-drawer-nav{ flex:1; overflow-y:auto; padding:10px 10px 24px; }
.rw-nav-group-label{ font-size:10.5px; font-weight:700; color:rgba(255,255,255,0.4); text-transform:uppercase; letter-spacing:.08em; padding:14px 12px 6px; }
.rw-nav-item{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-radius:6px; font-size:13.5px; font-weight:600; color:rgba(255,255,255,0.9); cursor:pointer; border:none; background:transparent; width:100%; text-align:left; font-family:inherit; position:relative; }
.rw-nav-item:hover{ background:rgba(255,255,255,0.1); color:#fff; }
.rw-nav-item.active{ background:rgba(255,255,255,0.16); color:#fff; }
.rw-nav-item.active::before{ content:''; position:absolute; right:0; top:7px; bottom:7px; width:3px; background:#fff; border-radius:2px 0 0 2px; }
.rw-nav-item .ico{ width:18px; text-align:center; font-size:14px; flex-shrink:0; }

/* ---- page furniture ---- */
.page-band{ background:linear-gradient(135deg,#2f3a37 0%,#3f504b 50%,#5d716a 100%); padding:24px 32px 20px; color:#fff; }
.page-band-eyebrow{ font-size:11px; font-weight:700; letter-spacing:.10em; text-transform:uppercase; color:rgba(255,255,255,0.65); margin:0 0 6px; }
.page-band-header{ display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; }
.page-band-title{ font-family:Georgia,"Times New Roman",serif; font-size:24px; font-weight:400; color:#fff; margin:0; flex:1; min-width:0; }
.page-band-sub{ font-size:13px; color:rgba(255,255,255,0.75); margin-top:6px; max-width:820px; line-height:1.55; }
.rw-body{ padding:20px 28px 56px; }
.rw-toolbar{ display:flex; align-items:center; gap:8px; padding:0 0 16px; flex-wrap:wrap; }

/* ---- controls ---- */
.btn{ display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; white-space:nowrap; line-height:1.4; min-height:32px; font-family:inherit; }
.btn-primary{ background:var(--rw-coal); color:#fff; } .btn-primary:hover{ background:#1a1c22; }
.btn-outline{ background:#fff; color:var(--rw-ink-2); border-color:var(--rw-border); } .btn-outline:hover{ background:var(--rw-hover); }
.btn-ghost{ background:transparent; color:var(--rw-ink-2); } .btn-ghost:hover{ background:var(--rw-hover); }
.btn-danger{ background:var(--rw-danger); color:#fff; } .btn-danger:hover{ background:#8b2f23; }
.btn-go{ background:var(--rw-success); color:#fff; } .btn-go:hover{ background:#17513a; }
.btn-sm{ padding:4px 10px; font-size:12px; min-height:26px; }
.btn:disabled{ opacity:.42; cursor:not-allowed; }
select,input[type=text],input[type=date],input[type=number],textarea{ font-family:inherit; font-size:13px; padding:6px 9px; border:1px solid var(--rw-border); border-radius:4px; background:#fff; color:var(--rw-ink-2); }
select:focus,input:focus,textarea:focus{ outline:2px solid #6d8f84; outline-offset:0; }
label.fl{ display:block; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--rw-slate); margin-bottom:4px; }

/* ---- chips ---- */
.chip{ display:inline-flex; align-items:center; padding:2px 9px; border-radius:3px; font-size:11px; font-weight:600; white-space:nowrap; letter-spacing:.02em; }
.chip-draft{ background:#eceae6; color:#5b5d65; }
.chip-open{ background:#dbeeff; color:#1f4a7a; }
.chip-submitted{ background:#dbe7f4; color:#1f4a7a; }
.chip-approved{ background:#d8ede2; color:#1f6a4a; }
.chip-rejected{ background:#f6dcd7; color:#a73d2f; }
.chip-defaulted{ background:#f4e6c8; color:#8a5a08; }
.chip-late{ background:#f9e2c4; color:#94540a; }
.chip-warn{ background:#f4e6c8; color:#8a5a08; }
.chip-closed{ background:#e4e2dd; color:#6a6c74; }
.chip-info{ background:#dbeeff; color:#1f4a7a; }
.chip-nb{ background:#ece9f5; color:#4a3f7a; }
.flag-chip{ display:inline-flex; align-items:center; padding:1px 7px; border-radius:3px; font-size:10px; font-weight:700; letter-spacing:.03em; background:#f4e6c8; color:#8a5a08; margin-left:4px; }

/* ---- cards and tables ---- */
.card{ background:var(--rw-paper); border:1px solid var(--rw-border); border-radius:6px; margin-bottom:16px; overflow:hidden; }
.card-hd{ padding:12px 16px; border-bottom:1px solid var(--rw-border-2); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; background:#fbfbf9; }
.card-hd h3{ margin:0; font-size:14px; font-weight:700; color:var(--rw-coal); }
.card-body{ padding:16px; }
.card-body.tight{ padding:0; }
.section-title{ font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--rw-slate); margin:0 0 10px; }
.tbl-wrap{ overflow-x:auto; }
table.dt{ width:100%; border-collapse:collapse; font-size:13px; }
table.dt th{ text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--rw-slate); padding:9px 12px; border-bottom:1px solid var(--rw-border); background:#fbfbf9; white-space:nowrap; }
table.dt td{ padding:8px 12px; border-bottom:1px solid var(--rw-border-2); vertical-align:middle; }
table.dt tbody tr:hover td{ background:#fafaf8; }
table.dt tfoot td{ font-weight:700; background:#f4f4f1; border-top:1px solid var(--rw-border); }
.rt{ text-align:right; font-variant-numeric:tabular-nums; }
.mono{ font-family:ui-monospace,Consolas,"Courier New",monospace; font-size:12px; }
.muted{ color:var(--rw-slate); }
.sm{ font-size:11.5px; }
.stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px; margin-bottom:16px; }
.stat-card{ background:#fff; border:1px solid var(--rw-border); border-radius:6px; padding:11px 13px; }
.stat-card .lbl{ font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--rw-slate); }
.stat-card .val{ font-size:20px; font-weight:700; color:var(--rw-coal); font-variant-numeric:tabular-nums; margin-top:2px; }
.hdr-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px 20px; }
.hdr-item{ display:flex; flex-direction:column; gap:2px; }
.form-label{ font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--rw-slate); }
.form-value{ font-size:13.5px; font-weight:600; color:var(--rw-coal); }

/* ---- grid entry ---- */
.hin{ width:52px; text-align:right; padding:5px 6px; font-variant-numeric:tabular-nums; font-size:13px; }
.hin[readonly]{ background:#f4f4f1; color:var(--rw-slate); }
td.wknd{ background:#f6f6f3; }
th.wknd{ background:#f1f1ed; }
.daycol{ min-width:64px; text-align:center; }
.leaverow td{ background:#fbf7ec; }

/* ---- notes ---- */
.note{ border-left:3px solid var(--rw-info); background:#f2f7fb; padding:11px 14px; border-radius:0 5px 5px 0; font-size:12.5px; line-height:1.6; margin-bottom:14px; color:var(--rw-ink-2); }
.note strong{ color:var(--rw-coal); }
.note.warn{ border-left-color:var(--rw-warning); background:#fdf6e8; }
.note.bad{ border-left-color:var(--rw-danger); background:#fbf0ee; }
.note.ok{ border-left-color:var(--rw-success); background:#eef7f2; }
.rule-tag{ display:inline-block; font-family:ui-monospace,Consolas,monospace; font-size:10px; font-weight:700; color:var(--rw-slate); border:1px solid var(--rw-border); border-radius:2px; padding:0 4px; margin-left:4px; }

/* ---- modal and toast ---- */
.modal{ position:fixed; inset:0; background:rgba(20,18,16,.42); display:none; align-items:center; justify-content:center; z-index:300; padding:20px; }
.modal.show{ display:flex; }
.modal-box{ background:#fff; border-radius:8px; width:min(620px,100%); max-height:86vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,.3); }
.modal-hd{ padding:14px 18px; border-bottom:1px solid var(--rw-border-2); display:flex; justify-content:space-between; align-items:center; }
.modal-hd h3{ margin:0; font-size:15px; font-weight:700; color:var(--rw-coal); }
.modal-bd{ padding:18px; }
.modal-ft{ padding:12px 18px; border-top:1px solid var(--rw-border-2); display:flex; justify-content:flex-end; gap:8px; background:#fbfbf9; }
.toast{ position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px); background:#2a2c33; color:#fff; padding:11px 18px; border-radius:6px; font-size:13px; font-weight:600; opacity:0; pointer-events:none; transition:all .22s; z-index:400; max-width:min(560px,92vw); box-shadow:0 10px 30px rgba(0,0,0,.3); }
.toast.show{ opacity:1; transform:translateX(-50%); }
.toast.bad{ background:var(--rw-danger); }

/* ---- axis grid ---- */
table.axis td.hit{ background:#e6f0eb; font-size:11.5px; color:#1f6a4a; font-weight:600; }
table.axis td{ text-align:center; }
table.axis th[scope=row]{ text-align:left; font-family:ui-monospace,Consolas,monospace; font-size:11.5px; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--rw-slate); margin-top:8px; }
@media (max-width:820px){ .rw-body{ padding:16px 14px 48px; } .page-band{ padding:18px 16px 16px; } }
</style>

<div class="rw-app">
  <div class="rw-topbar">

<script>
/* ============================================================
   O2C TIMESHEET — DEMO WALKTHROUGH
   Rebuilt 21-Aug-2026 from the APP'S OWN PAGE FILES, not from the
   requirement pack. The previous prototype was written from
   CLAUDE.md and described the module as documented rather than as
   built: it invented a Status & Flag Model page, put Monthly Summary
   in the menu when it is a drill-down, made Team Approvals an
   employee grid when it is a project list, omitted Salary on Hold
   entirely, and stated that the employee self-view "was recorded as
   manager-only" when the page exists and ships.

   Menu, page titles, subtitles and column headers below are lifted
   from webApps/.../flows/main/pages/*.html and navModel.js.

   The normal flow is what works end to end:

     sign in -> My Timesheet -> submit
             -> Team Approvals -> open project
             -> Monthly Summary -> open employee
             -> Approval Detail -> approve
             -> Confirm month -> Accrual Integration

   Sample data is the live pod: 555 Opportunity To Cash, the six
   allocated people, July and August 2026.
   ============================================================ */

var TODAY = new Date(2026, 7, 21);        // Fri 21-Aug-2026
var TODAY_STR = '21-Aug-2026';

/* ---- periods ---- */
var PERIODS = [
  {key:'JUL-2026', name:'JUL-2026', y:2026, m:6, status:'Closed', editable:false,
   deliveryCut:'04-Aug-2026', note:'Confirmed to accrual on 21-Aug. Read-only.'},
  {key:'AUG-2026', name:'AUG-2026', y:2026, m:7, status:'Open', editable:true,
   deliveryCut:'03-Sep-2026', note:'The month being worked.'},
  {key:'SEP-2026', name:'SEP-2026', y:2026, m:8, status:'Future', editable:false,
   deliveryCut:'05-Oct-2026', note:'Frozen until it opens (RULE-004).'}
];
function period(k){ for(var i=0;i<PERIODS.length;i++) if(PERIODS[i].key===k) return PERIODS[i]; return PERIODS[1]; }

/* ---- projects. MAIN is the O2C main application's code, and it is
   the column accrual joins on. A project without one is refused at
   confirmation (-20023, added 21-Aug). ---- */
var PROJECTS = [
  {id:'555', name:'555 Opportunity To Cash', client:'Rite Digital', model:'FCP',
   main:'PRJ-2026-33', mgr:'RI9001', leaveLoss:true, tsStart:'01-Jul-25', tsEnd:'31-Dec-26',
   tasks:[{code:'01.01.111', name:'Delivery'},{code:'01.01.112', name:'Design'},{code:'01.02.100', name:'Internal'}]},
  {id:'444', name:'444 Opportunity To Cash', client:'Rite Digital', model:'T&M',
   main:'PRJ-2026-32', mgr:'RI9001', leaveLoss:false, tsStart:'01-Apr-25', tsEnd:'31-Mar-27',
   tasks:[{code:'02.01.100', name:'Delivery'},{code:'02.02.100', name:'Support'}]},
  {id:'PCS10034', name:'Business World RODS Upgrade', client:'Business World', model:'Milestone',
   main:'PRJ-2026-34', mgr:'RI9001', leaveLoss:true, tsStart:'01-Jan-26', tsEnd:'31-Dec-26',
   tasks:[{code:'03.01.100', name:'Managed Service'}]}
];
function proj(id){ for(var i=0;i<PROJECTS.length;i++) if(PROJECTS[i].id===id) return PROJECTS[i]; return null; }
function taskName(pid,c){ var p=proj(pid); if(!p) return c;
  for(var i=0;i<p.tasks.length;i++) if(p.tasks[i].code===c) return p.tasks[i].name; return c; }

/* ---- workers.
   PATTERN matters and is not cosmetic: RI2824 and RI2894 work
   SUNDAY TO THURSDAY. Confirmed intentional 21-Aug-2026. They show
   22 working days in July where the others show 18, they carry
   weekend dates into the accrual batch, and any check that assumes
   Mon-Fri marks them wrong when they are right.               ---- */
var WORKERS = [
  {id:'CRI0398', name:'Kishore Krovvidi',              type:'Employee', std:8, country:'India',
   role:'Developer',                 billing:'Unbilled', pattern:'MON_FRI',
   alloc:[{p:'555',pct:100}]},
  {id:'RI9001',  name:'Navamani Solairajan',           type:'Employee', std:8, country:'India',
   role:'Project Manager',           billing:'Billable', pattern:'MON_FRI',
   alloc:[{p:'555',pct:25}]},
  {id:'RI2900',  name:'SaiSowmith Kantipudi',          type:'Employee', std:8, country:'India',
   role:'Cloud Engineer',            billing:'Billable', pattern:'MON_FRI',
   alloc:[{p:'555',pct:100}]},
  {id:'RI2824',  name:'Sam Joshuva S',                 type:'Employee', std:8, country:'India',
   role:'Associate Project Manager', billing:'Billable', pattern:'SUN_THU',
   alloc:[{p:'555',pct:25},{p:'444',pct:75}]},
  {id:'RI2894',  name:'Santosh Kumar Kanala',          type:'Employee', std:8, country:'India',
   role:'Architect Senior',          billing:'Billable', pattern:'SUN_THU',
   alloc:[{p:'555',pct:50},{p:'444',pct:50}]},
  {id:'RI2914',  name:'Venkata Bhaskar Reddy Sangana', type:'Employee', std:8, country:'India',
   role:'Engineer',                  billing:'Unbilled', pattern:'MON_FRI',
   alloc:[{p:'555',pct:100}]}
];
function wkr(id){ for(var i=0;i<WORKERS.length;i++) if(WORKERS[i].id===id) return WORKERS[i]; return null; }
function allocPct(e,p){ var w=wkr(e); if(!w) return 0;
  for(var i=0;i<w.alloc.length;i++) if(w.alloc[i].p===p) return w.alloc[i].pct; return 0; }
function empsOn(p){ return WORKERS.filter(function(w){ return allocPct(w.id,p)>0; }); }
function derivedRole(id){
  for(var i=0;i<PROJECTS.length;i++) if(PROJECTS[i].mgr===id) return 'ROLE_TIME_MANAGER';
  var w=wkr(id); if(!w) return 'ROLE_TIME_NONE';
  if(w.type==='Contractor') return 'ROLE_TIME_CONTRACTOR';
  return w.alloc.length ? 'ROLE_TIME_EMPLOYEE' : 'ROLE_TIME_NONE';
}
/* is this a working day for this person? SUN_THU is a real pattern here. */
function worksOn(empId, dow){         // dow 0=Sun .. 6=Sat
  var w=wkr(empId);
  return w && w.pattern==='SUN_THU' ? (dow>=0 && dow<=4) : (dow>=1 && dow<=5);
}

/* ---- absence, read live from Fusion per person ---- */
var ABSENCE = [
  {emp:'RI2824', date:'2026-08-07', hours:8, type:'Annual', status:'Active'},
  {emp:'RI2824', date:'2026-08-10', hours:8, type:'Annual', status:'Active'},
  {emp:'RI2824', date:'2026-08-19', hours:8, type:'Sick',   status:'Active'},
  {emp:'RI2824', date:'2026-08-20', hours:8, type:'Annual', status:'ORA_WITHDRAWN'},
  {emp:'RI2894', date:'2026-08-18', hours:8, type:'Annual', status:'Active'},
  {emp:'RI2894', date:'2026-08-19', hours:8, type:'Annual', status:'Active'}
];
function absenceOn(e,iso){
  for(var i=0;i<ABSENCE.length;i++){
    var a=ABSENCE[i];
    if(a.emp===e && a.date===iso && a.status.indexOf('WITHDRAWN')<0) return a;
  }
  return null;
}
/* Leave is apportioned by allocation. A full day off costs 555 two
   hours for Sam, not eight (RULE-010). */
function leaveShare(e,iso,p){
  var a=absenceOn(e,iso); if(!a) return 0;
  return Math.round(a.hours*allocPct(e,p)/100*4)/4;
}

var UNBILLED_REASONS = ['Customer Holiday','Training','Travel','Bench'];
var REJECT_REASONS   = ['Manager driven','Client driven','Absence'];

/* ============================================================
   V4 STATUS ENGINE — two axes, and the transitions are data.
   ============================================================ */
var SUB_STATES  = ['NotYetSubmitted','Submitted','LateSubmission','Defaulted'];
var APPR_STATES = ['Pending','Approved','Rejected','ManagerDefaulted'];

var TRANSITIONS = [

var WEEKSTORE = {}, AUDIT = [], seqAudit = 1;

/* THE WEEK IS ABOVE THE PROJECT. OC_TS_WEEK carries EMPLOYEE_ID,
   PERIOD_ID and WEEK_INDEX and no project at all; the project lives
   on the entry, in UK_OC_TSE_CELL (ts_week_id, project_id, task_id,
   entry_date, entry_type). So one week holds lines for every project
   the person is allocated to, and a day is the sum across them. */
function wkey(e,pk,i){ return e+'|'+pk+'|'+i; }
function week(e,pk,i){
  var k=wkey(e,pk,i);
  if(!WEEKSTORE[k]) WEEKSTORE[k]={emp:e,pk:pk,idx:i,sub:'NotYetSubmitted',appr:'Pending',
                                  flags:[],versions:[],locked:false,defaultedBy:null,entries:null};
  return WEEKSTORE[k];
}
function raiseFlag(w,f){
  if(!f) return;
  for(var i=0;i<w.flags.length;i++) if(w.flags[i].flag===f){ w.flags[i].clearedOn=null; return; }
  w.flags.push({flag:f,setOn:TODAY_STR,clearedOn:null});
}
function activeFlags(w){ return w.flags.filter(function(f){return !f.clearedOn;}).map(function(f){return f.flag;}); }

function applyEvent(w,ev,opt){
  opt=opt||{};
  for(var i=0;i<TRANSITIONS.length;i++){
    var t=TRANSITIONS[i];
    if(t.e!==ev) continue;
    if(t.fs!==null && t.fs!==w.sub) continue;
    if(t.fa!==null && t.fa!==w.appr) continue;
    if(t.late===true && !opt.late) continue;
    if(ev==='Submit' && t.o===1 && opt.late) continue;
    var from = w.sub+' / '+w.appr;
    if(t.ts) w.sub=t.ts;
    if(t.ta) w.appr=t.ta;
    raiseFlag(w,t.fl);
    if(t.by) w.defaultedBy=t.by;
    if(t.lock) w.locked=true;
    if(ev==='Submit'||ev==='Revoke') w.locked=false;
    w.versions.push({no:w.versions.length+1,ev:ev,from:from,to:w.sub+' / '+w.appr,
                     on:TODAY_STR,by:opt.actor||'-',reason:opt.reason||null,
                     delta:opt.delta||null});
    AUDIT.push({id:seqAudit++,wk:wkey(w.emp,w.proj,w.pk,w.idx),ev:ev,on:TODAY_STR,
                by:opt.actor||'-',reason:opt.reason||null});
    return {ok:true,rule:t};
  }
  return {ok:false,err:'ORA-20034: no transition rule matches '+ev+' from '+w.sub+' / '+w.appr+
    '. The engine refuses by name rather than doing nothing.'};
}

/* ---- weeks, CLIPPED to the month ---- */
var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function iso(d){ var m=d.getMonth()+1,y=d.getDate();
  return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(y<10?'0':'')+y; }
function pretty(d){ return (d.getDate()<10?'0':'')+d.getDate()+'-'+MON[d.getMonth()]; }
function buildWeeks(y,m){
  var first=new Date(y,m,1), last=new Date(y,m+1,0), out=[], cur=new Date(first);
  while(cur<=last){
    var dow=cur.getDay(), back=(dow===0)?6:dow-1;
    var mon=new Date(cur); mon.setDate(cur.getDate()-back);
    var st=(mon<first)?new Date(first):new Date(mon);
    var en=new Date(st); en.setDate(st.getDate()+(6-((st.getDay()===0)?6:st.getDay()-1)));
    if(en>last) en=new Date(last);
    var days=[], d=new Date(st);
    while(d<=en){ days.push({d:new Date(d),iso:iso(d),dow:d.getDay()}); d.setDate(d.getDate()+1); }
    out.push({idx:out.length,start:new Date(st),end:new Date(en),days:days,
              label:pretty(st)+' - '+pretty(en)});
    cur=new Date(en); cur.setDate(cur.getDate()+1);
  }
  return out;
}
var WK={};
function weeksOf(pk){ if(!WK[pk]){ var p=period(pk); WK[pk]=buildWeeks(p.y,p.m); } return WK[pk]; }
function currentWeekIdx(pk){
  var ws=weeksOf(pk);
  for(var i=0;i<ws.length;i++) if(TODAY>=ws[i].start && TODAY<=ws[i].end) return i;
  return ws.length-1;
}

/* ---- prepopulated entries, ACROSS ALL PROJECTS ---- */
function buildEntries(e,pk,wi){
  var w=wkr(e), wd=weeksOf(pk)[wi], out=[];
  w.alloc.forEach(function(a){
    var p=proj(a.p); if(!p) return;
    var line={proj:a.p, task:p.tasks[0].code,
              type:(w.billing==='Billable'?'Billable':'Non-billable'),
              reason:(w.billing==='Billable'?'':'Bench'), hrs:[]};
    var lv={proj:a.p, task:'LEAVE', type:'Leave', reason:'', hrs:[], isLeave:true};
    var any=false;
    wd.days.forEach(function(dy){
      if(!worksOn(e,dy.dow)){ line.hrs.push(0); lv.hrs.push(0); return; }
      var full=Math.round(w.std*a.pct/100*4)/4, l=leaveShare(e,dy.iso,a.p);
      if(l>0) any=true;
      line.hrs.push(Math.max(0,Math.round((full-l)*4)/4));
      lv.hrs.push(l);
    });
    out.push(line);
    if(any) out.push(lv);
  });
  return out;
}
function entriesFor(e,pk,wi){
  var w=week(e,pk,wi);
  if(!w.entries) w.entries=buildEntries(e,pk,wi);
  return w.entries;
}
/* A manager screen is project-scoped even though the week is not. */
function linesFor(e,pk,wi,p){
  return entriesFor(e,pk,wi).filter(function(l){ return !p || l.proj===p; });
}
function lineTotal(l){ var t=0; for(var i=0;i<l.hrs.length;i++) t+=num(l.hrs[i]); return t; }
function dayTotal(ls,i){ var t=0; ls.forEach(function(l){ t+=num(l.hrs[i]); }); return t; }
function weekTotals(e,pk,wi,p){
  var b=0,n=0,l=0;
  linesFor(e,pk,wi,p).forEach(function(x){
    var t=lineTotal(x);
    if(x.isLeave) l+=t; else if(x.type==='Billable') b+=t; else n+=t;
  });
  return {b:b,n:n,l:l,t:b+n+l};
}
function monthTotals(e,pk,p){
  var b=0,n=0,l=0,days={};
  weeksOf(pk).forEach(function(wd,i){
    var t=weekTotals(e,pk,i,p); b+=t.b; n+=t.n; l+=t.l;
    linesFor(e,pk,i,p).forEach(function(ln){
      ln.hrs.forEach(function(h,di){ if(num(h)>0) days[i+'|'+di]=1; });
    });
  });
  return {b:b,n:n,l:l,t:b+n+l,days:Object.keys(days).length};
}

/* ---- leave loss coverage. LOSS is what the PROJECT lost. Assigning
   the cover IS the decision — there is no approval step, so the
   status stops at Assigned. ---- */
var LLC=[];
function buildLLC(){
  LLC=[];
  PROJECTS.forEach(function(p){
    if(!p.leaveLoss) return;
    ABSENCE.forEach(function(a){
      if(a.status.indexOf('WITHDRAWN')>=0) return;
      var pct=allocPct(a.emp,p.id); if(!pct) return;
      var w=wkr(a.emp);
      var loss=Math.round(pct/100*Math.min(1,a.hours/w.std)*w.std*4)/4;
      if(loss<=0) return;
      LLC.push({proj:p.id,emp:a.emp,date:a.date,type:a.type,hours:a.hours,
                loss:loss,cover:null,status:'Open'});
    });
  });
  LLC.sort(function(x,y){ return x.date<y.date?-1:1; });
  var pre={'RI2824|2026-08-07':'CRI0398','RI2824|2026-08-10':'RI2914',
           'RI2824|2026-08-19':'CRI0398','RI2894|2026-08-18':'RI2914',
           'RI2894|2026-08-19':'RI2914'};
  LLC.forEach(function(r){ var k=r.emp+'|'+r.date;
    if(pre[k]){ r.cover=pre[k]; r.status='Assigned'; } });
}

  var h=pageBand('main-my-timesheet');
  h+='<div class="rw-body">';
  h+='<div class="rw-toolbar">'+
    '<div><label class="fl">Month</label>'+periodSelect('setPeriod(this.value)')+'</div>'+
    '<div><label class="fl">Select week</label><select onchange="view.widx=+this.value;go(\'main-my-timesheet\')">'+
      ws.map(function(x,i){ return '<option value="'+i+'"'+(i===view.widx?' selected':'')+'>Week '+(i+1)+' &middot; '+x.label+'</option>'; }).join('')+
    '</select></div>'+
    '<div style="flex:1"></div>'+
    '<button class="btn btn-outline" onclick="showAlloc()">My allocation</button>'+
    '<button class="btn btn-outline" onclick="saveDraft()"'+(editable?'':' disabled')+'>Save draft</button>'+
    (w.sub==='Submitted'||w.sub==='LateSubmission'
      ? '<button class="btn btn-outline" onclick="withdraw()">Withdraw submission</button>' : '')+
    '<button class="btn btn-primary" onclick="submitWeek()"'+(editable?'':' disabled')+'>Submit week</button>'+
    '</div>';

  h+='<div class="card"><div class="card-body"><div class="hdr-grid">'+
    hdrItem('Worker', e.name+' <span class="mono muted">'+e.id+'</span>')+
    hdrItem('Pattern', e.pattern==='SUN_THU'
      ? 'Sunday&ndash;Thursday <span class="chip chip-info">not Mon&ndash;Fri</span>'
      : 'Monday&ndash;Friday')+
    hdrItem('Standard / day', e.std+' hrs')+
    hdrItem('Projects', e.alloc.map(function(a){ return a.p+' '+a.pct+'%'; }).join(' &middot; '))+
    hdrItem('Employee status', subChip(w.sub))+
    hdrItem('Manager status', apprChip(w.appr))+
    hdrItem('Flags', activeFlags(w).length?flagChips(w):'<span class="muted sm">none</span>')+
    '</div></div></div>';

  if(!p.editable) h+='<div class="note warn"><strong>'+p.name+' is '+p.status.toLowerCase()+
    ' and read-only.</strong> '+p.note+' Every period stays visible &mdash; only editing is gated.</div>';
  if(w.locked) h+='<div class="note bad"><strong>This week is locked.</strong> The weekly cut-off passed '+
    'before it was submitted, so it defaulted from the prepopulated hours and pay is held until it is submitted.</div>';

  /* THE GRID. Project | Task (WBS) | days | Total -- project on the LINE,
     because OC_TS_WEEK has no project and UK_OC_TSE_CELL is
     (ts_week_id, project_id, task_id, entry_date, entry_type). One week
     carries every project the person is on, and the day total is the sum
     across them. A project picker in the toolbar would hide exactly that. */
  h+='<div class="card"><div class="card-hd"><h3>Week '+(view.widx+1)+' &middot; '+wd.label+'</h3>'+
    '<span class="sm muted">'+lines.length+' line(s) across '+e.alloc.length+' project(s)</span></div>'+
    '<div class="card-body tight"><div class="tbl-wrap"><table class="dt"><thead><tr>'+
    '<th>Project</th><th>Task (WBS)</th>';
  wd.days.forEach(function(dy){
    var off=!worksOn(e.id,dy.dow);
    h+='<th class="daycol'+(off?' wknd':'')+'">'+DOW[dy.dow]+'<br><span class="muted">'+pretty(dy.d)+'</span></th>';
  });
  h+='<th class="rt">Total</th></tr></thead><tbody>';
  lines.forEach(function(ln,li){
    var isL=!!ln.isLeave, pr=proj(ln.proj);
    h+='<tr'+(isL?' class="leaverow"':'')+'>'+
      '<td><strong>'+pr.id+'</strong><br><span class="sm muted">'+pr.name+'</span></td>';
    if(isL){
      h+='<td><span class="chip chip-nb">Leave</span> <span class="muted sm">apportioned</span></td>';
    } else {
      h+='<td><select onchange="setTask('+li+',this.value)"'+(editable?'':' disabled')+'>'+
        pr.tasks.map(function(t){ return '<option value="'+t.code+'"'+(t.code===ln.task?' selected':'')+'>'+t.code+' &middot; '+t.name+'</option>'; }).join('')+
        '</select>'+
        '<div class="sm muted" style="margin-top:3px">'+ln.type+
        (ln.reason?' &middot; '+ln.reason:'')+'</div></td>';
    }
    ln.hrs.forEach(function(v,di){
      var off=!worksOn(e.id,wd.days[di].dow);
      h+='<td class="daycol'+(off?' wknd':'')+'"><input class="hin" value="'+f2(v)+'"'+
        ((editable&&!isL)?'':' readonly')+' onchange="setHrs('+li+','+di+',this.value)"></td>';
    });
    h+='<td class="rt"><strong>'+f2(lineTotal(ln))+'</strong></td></tr>';
  });
  h+='</tbody><tfoot><tr><td colspan="2">Day total</td>';
  var g=0;
  wd.days.forEach(function(dy,di){ var t=dayTotal(lines,di); g+=t;
    var over=t>e.std;
    h+='<td class="daycol rt'+(!worksOn(e.id,dy.dow)?' wknd':'')+'"'+
      (over?' style="color:var(--rw-danger);font-weight:700"':'')+'>'+f2(t)+'</td>'; });
  h+='<td class="rt">'+f2(g)+'</td></tr></tfoot></table></div></div></div>';

  if(e.alloc.length>1) h+='<div class="note"><strong>One day, two projects.</strong> '+
    e.name.split(' ')[0]+' is '+e.alloc.map(function(a){return a.pct+'% on '+a.p;}).join(' and ')+
    ', so the day arrives split and the Day total is the sum of the lines &mdash; not one project at a time. '+
    'That is the grain of the module: the week belongs to the person, the project belongs to the line.</div>';

  if(e.pattern==='SUN_THU') h+='<div class="note"><strong>This person works Sunday to Thursday.</strong> '+
    'Friday is greyed out and Sunday is not. That is their HCM work pattern, confirmed intentional &mdash; '+
    'it makes their month 22 working days where a Mon&ndash;Fri colleague has 18, and it puts weekend dates '+
    'into the accrual batch. Any check that assumes Mon&ndash;Fri marks them wrong when they are right.</div>';

  h+='</div>';
  document.getElementById('mainArea').innerHTML=h;
};
function curLines(){ return entriesFor(me(),view.pk,view.widx); }
function curWeek(){ return week(me(),view.pk,view.widx); }
function setHrs(li,di,v){
  var e=wkr(me()), ls=curLines(), n=num(v); if(n<0) n=0;
  var q=Math.round(n*4)/4;
  if(Math.abs(q-n)>0.001) toast('Hours are recorded in quarters. '+f2(n)+' was rounded to '+f2(q)+'.');
  var prev=ls[li].hrs[di]; ls[li].hrs[di]=q;
  var tot=dayTotal(ls,di);
  if(tot>e.std){
    ls[li].hrs[di]=prev;
    toast('A day cannot hold more than the '+f2(e.std)+" hours of this person's shift. "+
          'Across all lines that day would come to '+f2(tot)+'.',true);
  } else {
    var w=curWeek();
    if(w.appr==='Approved'||w.appr==='Rejected'){
      applyEvent(w,'DailyChange',{actor:wkr(me()).name});
      toast('That week had already been decided, so the change reopened it and flagged it Adjusted.');
    }
  }
  go('main-my-timesheet');
}
function setTask(li,v){ curLines()[li].task=v; go('main-my-timesheet'); }
function saveDraft(){ toast('Draft saved. You can keep editing until the weekly cut-off.'); }
function submitWeek(){
  var w=curWeek(), e=wkr(me()), wd=weeksOf(view.pk)[view.widx], ls=curLines(), tot=0;
  ls.forEach(function(l){ tot+=lineTotal(l); });
  if(tot<=0){ toast('There are no hours on this week, so there is nothing to submit.',true); return; }
  var cut=new Date(wd.end); cut.setDate(cut.getDate()+1);
  var late=TODAY>cut;
  var r=applyEvent(w,'Submit',{actor:e.name,late:late});
  if(!r.ok){ toast(r.err,true); return; }
  var projs={}; ls.forEach(function(l){ projs[l.proj]=1; });
  toast((late?'Submitted after the weekly cut-off, so the week carries a Late submission flag. ':'Week submitted. ')+
        'One week, '+Object.keys(projs).length+' project(s), now with the approving manager.');
  go('main-my-timesheet');
}
function withdraw(){
  var r=applyEvent(curWeek(),'Revoke',{actor:wkr(me()).name});
  if(!r.ok){ toast(r.err,true); return; }
  toast('Submission withdrawn. The week is editable again.');
  go('main-my-timesheet');
}

/* ============================================================
   TEAM APPROVALS  —  A PROJECT LIST, not an employee grid.
   Columns lifted from main-team-approvals-page.html:
   Project | Number | TS start | TS end | Team | Billable |
   Non-billable | Leave | Status
   ============================================================ */
function mgrProjects(){ return PROJECTS.filter(function(p){ return p.mgr===SELF.mgr; }); }

function projStatus(pid){
  var team=empsOn(pid), ws=weeksOf(view.pk), pend=0, rej=0, n=0;
  team.forEach(function(e){ ws.forEach(function(x,i){
    var w=week(e.id,view.pk,i); n++;
    if(w.appr==='Rejected') rej++;
    else if(w.appr!=='Approved') pend++;
  }); });
  if(confirmOf(pid)) return 'Confirmed';
  if(rej) return 'Rejected';
  return pend ? 'Pending' : 'Approved';
}
function confirmOf(pid){
  for(var i=0;i<CONFIRMS.length;i++)
    if(CONFIRMS[i].proj===pid && CONFIRMS[i].pk===view.pk) return CONFIRMS[i];
  return null;
}

/* ============================================================
   MONTHLY SUMMARY  (main-view-timesheet)
   Emp ID | Name | Role | Billable status | Billable | Non-billable |
   Leave | Total | Cap | Weeks | Month status

function empMonthStatus(eid,pid){
  var ws=weeksOf(view.pk), ap=0, rj=0;
  ws.forEach(function(x,i){ var w=week(eid,view.pk,i);
    if(w.appr==='Approved') ap++; else if(w.appr==='Rejected') rj++; });
  if(rj) return 'Rejected';
  return ap===ws.length ? 'Approved' : 'Pending';
}

    ws.forEach(function(x,i){ if(week(e.id,view.pk,i).appr==='Approved') ap++; });

      '<td class="rt">'+f2(t.b)+'</td><td class="rt">'+f2(t.n)+'</td><td class="rt">'+f2(t.l)+'</td>'+

    '<p class="sm muted" style="margin:0 0 12px;max-width:none">Confirms the whole project month for '+
    '<strong>all employees at once</strong> and fills the accrual interface with the consolidated timesheet '+
    '(employee &times; project &times; task &times; day) plus any day-wise Reversal(&minus;)/Adjustment(+) rows. '+
    'The accrual application collects it from there.</p>'+
    '<div style="display:flex;justify-content:flex-end">'+
    (cf ? '<button class="btn btn-go" disabled>Month already confirmed</button>'
        : '<button class="btn btn-primary" onclick="confirmDialog()">Confirm month for all employees</button>')+
    '</div></div></div>';

  h+='</div>';

function toggleSel(id){

function selAllPending(){

function bulkApprove(){
  var pid=view.mgrProj, ws=weeksOf(view.pk), ok=0, fail=0, self=0;
  view.sel.forEach(function(eid){
    ws.forEach(function(x,i){
      var w=week(eid,view.pk,i);

/* ============================================================

      '</div><div class="card-body tight"><div class="tbl-wrap"><table class="dt"><thead><tr>'+
      '<th>Date</th><th>Project</th><th>Task</th><th class="rt">Hours</th><th>Type</th><th>Shift</th>'+

      trail.map(function(r){ return '<tr><td class="sm">W'+r.wk+'</td><td><strong>'+r.v.ev+'</strong></td>'+
        '<td class="sm muted">'+r.v.from+'</td><td class="sm">'+r.v.to+'</td>'+
        '<td class="sm">'+(r.v.delta||'<span class="muted">&mdash;</span>')+'</td>'+
        '<td class="sm">'+(r.v.reason?esc(r.v.reason):'<span class="muted">&mdash;</span>')+'</td>'+
        '<td class="sm">'+r.v.by+'</td><td class="sm mono">'+r.v.on+'</td></tr>'; }).join('')+
      '</tbody></table></div>';
  }
  h+='</div></div>';

  if(view.mgrEmp===SELF.mgr) h+='<div class="note"><strong>This is the manager&rsquo;s own week.</strong> '+
    'RULE-015 sent it to their reporting manager until 21-Aug-2026, when self-approval was turned on by '+
    'decision. The requirement pack still states the old rule.</div>';

  h+='</div>';

};
function toggleWk(i){ var k=view.sel.indexOf(i); if(k>=0) view.sel.splice(k,1); else view.sel.push(i);
  go('main-approval-detail'); }
function openWk(i){ view.mgrWeek=i; go('main-approval-detail'); }
function selAllWeeks(){
  var pid=view.mgrProj, e=view.mgrEmp;
  view.sel=weeksOf(view.pk).map(function(x,i){return i;})
    .filter(function(i){ return week(e,view.pk,i).appr==='Pending'; });
  go('main-approval-detail');
}
function eachSelWeek(fn){
  var pid=view.mgrProj, e=view.mgrEmp, ok=0, err=null;
  view.sel.forEach(function(i){
    var r=fn(week(e,view.pk,i));
    if(r.ok) ok++; else err=r.err;
  });
  view.sel=[];
  return {ok:ok,err:err};
}
function approveWeeks(){
  var r=eachSelWeek(function(w){ return applyEvent(w,'Approve',{actor:wkr(SELF.mgr).name}); });
  if(!r.ok && r.err){ toast(r.err,true); } else { toast(r.ok+' week(s) approved. Every day in them approved with them.'); }
  go('main-approval-detail');
}
function rejectWeeks(){
  var h='<div class="modal-hd"><h3>Reject selected</h3>'+
    '<button class="btn btn-ghost btn-sm" onclick="closeModal()">&times;</button></div><div class="modal-bd">'+
    '<label class="fl">Rejection reason</label><select id="rw" style="width:100%">'+
    REJECT_REASONS.map(function(r){return '<option>'+r+'</option>';}).join('')+'</select>'+

}
function rejectWeeksGo(){

function correctWeeks(){

    '<button class="btn btn-ghost btn-sm" onclick="closeModal()">&times;</button></div><div class="modal-bd">'+
    '<p class="sm muted" style="margin-top:0">The manager overrides what was submitted and approves in one '+
    'action. The week is flagged <strong>Overridden</strong>.</p>'+
    '<label class="fl">Reason (required)</label><textarea id="ov" rows="3" style="width:100%"></textarea>'+
    '<div class="note warn" style="margin-top:14px"><strong>The audit trail cannot be rewritten.</strong> '+
    'The table refuses updates and deletes outright, so this reason is carried <em>into</em> the audit row as '+
    'it is written rather than patched on afterwards. The button failed on every call until that was fixed.</div>'+
    '</div><div class="modal-ft"><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-go" onclick="correctGo()">Apply correction</button></div>';

}
function correctGo(){
  var reason=(document.getElementById('ov').value||'').trim();
  if(!reason){ toast('A correction needs a reason. A correction with no reason is not one.',true); return; }
  closeModal();

    {actor:wkr(SELF.mgr).name,reason:reason,delta:'manager override'}); });
  toast(r.ok+' week(s) corrected and approved. The reason is in the audit row, not beside it.');
  go('main-approval-detail');
}
function undoDecision(){
  var r=eachSelWeek(function(w){ return applyEvent(w,'RevokeDecision',{actor:wkr(SELF.mgr).name}); });
  if(!r.ok && r.err){ toast(r.err,true); } else { toast(r.ok+' decision(s) revoked. Submission axis untouched.'); }

/* ============================================================
   MONTH CONFIRMATION -> the accrual interface
   ============================================================ */
function confirmDialog(){
  var pid=view.mgrProj, p=proj(pid), ws=weeksOf(view.pk), team=empsOn(pid);
  var pend=0,total=0,defd=0;
  team.forEach(function(e){ ws.forEach(function(x,i){
    var w=week(e.id,view.pk,i); total++;
    if(w.appr!=='Approved') pend++;
    if(w.sub==='Defaulted') defd++; }); });
  var canNormal=(pend===0);

  var h='<div class="modal-hd"><h3>Confirm '+period(view.pk).name+' &middot; '+p.name+'</h3>'+
    '<button class="btn btn-ghost btn-sm" onclick="closeModal()">&times;</button></div><div class="modal-bd">'+
    '<div class="hdr-grid" style="margin-bottom:14px">'+
      hdrItem('Weeks',total)+hdrItem('Not approved',pend)+hdrItem('Defaulted',defd)+
      hdrItem('O2C project code','<span class="mono">'+(p.main||'<span class="chip chip-rejected">missing</span>')+'</span>')+
    '</div>'+
    '<label class="fl">Confirmation type</label><select id="cft" style="width:100%">'+
      '<option value="Normal"'+(canNormal?'':' disabled')+'>Normal &mdash; every week approved'+
        (canNormal?'':' (blocked: '+pend+' outstanding)')+'</option>'+
      '<option value="Advance closure"'+(canNormal?'':' selected')+'>Advance closure &mdash; go out anyway</option>'+
    '</select>'+
    '<div class="note'+(canNormal?'':' warn')+'" style="margin-top:14px">'+
      (canNormal ? '<strong>Every week is approved</strong>, so this is an ordinary confirmation.'
        : '<strong>'+pend+' week(s) are not approved.</strong> RULE-020 blocks a normal confirm. Advance '+
          'closure is the explicit exception: defaulted hours are treated as approved so the month can go '+
          'out, and the confirmation records that it went out that way.')+'</div>'+
    '<div class="note" style="margin-top:10px">Confirming freezes the month. A later correction does not '+
    'restate it &mdash; it travels separately as a Reversal(&minus;) and an Adjustment(+).</div>'+
    '</div><div class="modal-ft"><button class="btn btn-outline" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-go" onclick="confirmGo()">Confirm month</button></div>';
  openModal(h);
}
function confirmGo(){
  var type=document.getElementById('cft').value;
  var pid=view.mgrProj, p=proj(pid), pk=view.pk, ws=weeksOf(pk), team=empsOn(pid);
  closeModal();

  /* -20023, added 21-Aug: the main application's project code is what
     accrual joins on, so its absence is a refusal, not a null. Checked
     BEFORE anything is written. */
  if(!p.main){
    toast('Project '+pid+' has no O2C main-application project code, and accrual keys on that code. '+
          'Link it first, then confirm. Nothing has been confirmed.',true);
    return;
  }

  var cid=seqConfirm++, rows=0, hours=0, batch='O2CTIME-'+pid+'-'+pk;
  team.forEach(function(e){
    ws.forEach(function(x,wi){
      var w=week(e.id,pk,wi);
      /* THE PAYLOAD MIRRORS THE GATE. It filtered the entry's day status
         while the gate read the week's approval status, and the two had
         drifted: the month confirmed with zero rows and reported Success.
         Fixed 21-Aug — both now read the week. */
      var take=(w.appr==='Approved') || (type==='Advance closure' && w.appr==='Pending');
      if(!take) return;
      linesFor(e.id,pk,wi,pid).forEach(function(ln){
        ln.hrs.forEach(function(v,di){
          if(num(v)===0) return;
          var dy=x.days[di];
          IFACE.push({confirmId:cid, period:pk, y:period(pk).y, m:period(pk).m+1,
            mainNo:p.main, projNo:pid, projName:p.name, client:p.client, model:p.model,
            emp:e.id, empName:e.name, type:e.type, role:e.role,
            date:dy.iso, day:DOW[dy.dow].toUpperCase(),
            task:(ln.isLeave?'LEAVE':ln.task), taskName:(ln.isLeave?'Leave':taskName(pid,ln.task)),
            entryType:(w.sub==='Defaulted'?'Default':'Actual'),
            flag:(activeFlags(w)[0]||null),
            bill:(!ln.isLeave&&ln.type==='Billable')?num(v):0,
            nonbill:(!ln.isLeave&&ln.type!=='Billable')?num(v):0,
            leave:ln.isLeave?num(v):0, batch:batch, collected:false});
          rows++; hours+=num(v);
        });
      });
    });
  });

  /* ZERO ROWS IS NOT SUCCESS. A month that confirmed and sent nothing is
     indistinguishable, to accrual, from a project nobody worked on. */
  var status = rows>0 ? 'Success' : 'Failed';
  CONFIRMS.push({id:cid,proj:pid,pk:pk,type:type,on:TODAY_STR,by:wkr(SELF.mgr).name,
                 rows:rows,hours:hours,status:status,batch:batch});
  if(rows===0){
    toast('Confirmed, but NOTHING was sent to accrual. They would read this project-month as having no '+
          'time at all. Do not treat this as done.',true);
  } else {
    toast('Month confirmed as '+type+'. '+rows+' rows are ready for the accrual application to collect.');
  }
  go('main-view-timesheet');
}

      '</select></td>'+

  });

    'somebody picked the work up does not move hours off one timesheet onto another &mdash; both people book '+

function assignCover(i,id){
  var r=LLC[i];
  if(!id){ retractCover(i); return; }

  go('main-leave-loss-coverage');

function retractCover(i){
  LLC[i].cover=null; LLC[i].status='Open';

  go('main-leave-loss-coverage');
}

        var b=0,n=0,l=0,es={};
        IFACE.forEach(function(r){ if(r.confirmId!==c.id) return;
          b+=r.bill; n+=r.nonbill; l+=r.leave; es[r.emp]=1; });
        return '<tr><td>'+proj(c.proj).name+'<br><span class="mono muted sm">'+c.mainNo+'</span></td>'+
          '<td class="rt">'+Object.keys(es).length+'</td>'+
          '<td class="rt">'+f2(b)+'</td><td class="rt">'+f2(n)+'</td><td class="rt">'+f2(l)+'</td>'+
          '<td class="sm mono">'+c.on+'</td>'+
          '<td><span class="chip chip-draft">Pending</span></td>'+
          '<td><span class="chip '+(c.status==='Success'?'chip-approved':'chip-rejected')+'">'+c.status+'</span></td></tr>';
      }).join('')+
      '</tbody></table></div>';
  }
  h+='</div></div>';

  h+='<div class="note"><strong>Three columns, not one.</strong> Accrual, OTL and the partner push fail '+
    'independently; collapsing them loses which one needs attention. OTL stays <em>Pending</em> because it '+
    'is not switched on.</div>';

  var mine=IFACE.filter(function(r){ return r.period===view.pk; });
  if(mine.length){
    h+='<div class="card"><div class="card-hd"><h3>Extract waiting to be collected</h3>'+
      '<span class="sm muted">'+mine.length+' rows &middot; first 14 shown</span></div>'+
      '<div class="card-body tight"><div class="tbl-wrap"><table class="dt"><thead><tr>'+
      '<th>Employee</th><th>Project</th><th>WBS task</th><th>Date</th><th class="rt">Billed</th>'+
      '<th class="rt">Unbilled</th><th class="rt">Leave</th><th>Type</th><th>Flag</th><th>Collected</th>'+
      '</tr></thead><tbody>'+
      mine.slice(0,14).map(function(r){
        return '<tr><td class="sm">'+r.empName+'</td><td class="mono sm">'+r.mainNo+'</td>'+
          '<td class="sm">'+r.taskName+'</td><td class="mono sm">'+r.date+'</td>'+
          '<td class="rt">'+f2(r.bill)+'</td><td class="rt">'+f2(r.nonbill)+'</td><td class="rt">'+f2(r.leave)+'</td>'+
          '<td><span class="chip '+(r.entryType==='Default'?'chip-defaulted':'chip-draft')+'">'+r.entryType+'</span></td>'+
          '<td class="sm">'+(r.flag?'<span class="flag-chip">'+r.flag+'</span>':'<span class="muted">&mdash;</span>')+'</td>'+
          '<td>'+(r.collected?'<span class="chip chip-approved">Y</span>':'<span class="chip chip-draft">N</span>')+'</td></tr>';
      }).join('')+'</tbody></table></div></div></div>';

    /* the three grains */
    var mk={},dk={};
    mine.forEach(function(r){
      var a=r.mainNo+'|'+r.emp;
      if(!mk[a]) mk[a]={r:r,days:{},b:0,n:0,l:0};
      mk[a].b+=r.bill; mk[a].n+=r.nonbill; mk[a].l+=r.leave; mk[a].days[r.date]=1;
      var d=a+'|'+r.date; if(!dk[d]) dk[d]=1;
    });
    h+='<div class="card"><div class="card-hd"><h3>What accrual reads &mdash; three grains, one snapshot</h3>'+
      '<span class="sm muted">hours must be identical across all three</span></div>'+
      '<div class="card-body tight"><div class="tbl-wrap"><table class="dt"><thead><tr>'+
      '<th>Grain</th><th>View</th><th class="rt">Rows</th><th class="rt">Hours</th></tr></thead><tbody>';
    var TH=0; mine.forEach(function(r){ TH+=r.bill+r.nonbill+r.leave; });
    h+='<tr><td>Monthly</td><td class="mono sm">v_oc_ts_anx_month</td><td class="rt">'+Object.keys(mk).length+'</td><td class="rt">'+f2(TH)+'</td></tr>'+
       '<tr><td>Daily</td><td class="mono sm">v_oc_ts_anx_day</td><td class="rt">'+Object.keys(dk).length+'</td><td class="rt">'+f2(TH)+'</td></tr>'+
       '<tr><td>Daily task-wise</td><td class="mono sm">v_oc_ts_anx_day_task</td><td class="rt">'+mine.length+'</td><td class="rt">'+f2(TH)+'</td></tr>'+
      '</tbody></table></div></div></div>';
    h+='<div class="note ok"><strong>Both project codes travel, and they are copies.</strong> '+
      '<span class="mono">'+mine[0].projNo+'</span> is Fusion&rsquo;s; <span class="mono">'+mine[0].mainNo+
      '</span> is the O2C main application&rsquo;s, and that is the one accrual joins on. Taken at the moment '+
      'of confirmation rather than joined live, so renaming a project later cannot restate a closed month.</div>';
  }

  /* LLC annexure */
  var ann=LLC.filter(function(r){ return r.cover; });
  h+='<div class="card"><div class="card-hd"><h3>Leave-loss annexure</h3>'+
    '<span class="sm muted">assigned coverage, for the invoice pack</span></div><div class="card-body tight">';
  if(!ann.length){ h+='<div class="card-body"><p class="muted sm" style="margin:0">No coverage assigned.</p></div>'; }
  else {
    h+='<div class="tbl-wrap"><table class="dt"><thead><tr><th>Project</th><th>Client</th><th>Absent</th>'+
      '<th>Date</th><th class="rt">Absence</th><th>Covered by</th><th>Day</th><th>Approved</th>'+
      '</tr></thead><tbody>'+
      ann.map(function(r){ var d=new Date(r.date+'T00:00:00'); var p=proj(r.proj);
        return '<tr><td class="sm">'+p.name+'</td><td class="sm">'+p.client+'</td>'+
          '<td class="sm">'+wkr(r.emp).name+'</td><td class="mono sm">'+pretty(d)+'</td>'+
          '<td class="rt">'+f2(r.loss)+'</td><td class="sm">'+wkr(r.cover).name+'</td>'+
          '<td class="muted sm">'+DOW[d.getDay()]+'</td>'+
          '<td><span class="chip chip-approved">Assigned</span></td></tr>'; }).join('')+
      '</tbody></table></div>';
  }
  h+='</div></div>';
  h+='</div>';
  document.getElementById('mainArea').innerHTML=h;
};

function seed(){
  buildLLC();
  /* JULY on 555: everybody defaulted at the weekly cut-off and then
     approved by the manager -- the real state on the pod on 21-Aug. */
  weeksOf('JUL-2026').forEach(function(x,i){
    empsOn('555').forEach(function(e){
      var w=week(e.id,'JUL-2026',i);
      entriesFor(e.id,'JUL-2026',i);
      applyEvent(w,'WeeklyCutoff',{actor:'SCHEDULER'});
      applyEvent(w,'Approve',{actor:'Navamani Solairajan'});
    });
  });
  /* AUGUST: weeks before the current one are submitted and mostly
     approved; the current week is still open. */
  var cur=currentWeekIdx('AUG-2026');
  weeksOf('AUG-2026').forEach(function(x,i){
    empsOn('555').forEach(function(e){
      var w=week(e.id,'AUG-2026',i);
      entriesFor(e.id,'AUG-2026',i);
      if(i<cur-1){ applyEvent(w,'Submit',{actor:e.name});
                   applyEvent(w,'Approve',{actor:'Navamani Solairajan'}); }
      else if(i===cur-1){
        if(e.id==='RI2894') applyEvent(w,'Submit',{actor:e.name,late:true});
        else if(e.id==='RI2914') applyEvent(w,'WeeklyCutoff',{actor:'SCHEDULER'});
        else applyEvent(w,'Submit',{actor:e.name});
      }
    });
  });
  /* Sam is on 444 too, so his own screen has something to switch to. */
}
