.btn{ display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; white-space:nowrap; line-height:1.4; min-height:32px; font-family:inherit; }
.btn-primary{ background:var(--rw-coal); color:#fff; } .btn-primary:hover{ background:#1a1c22; }

.hr-arr button:hover{ background:var(--rw-hover); color:var(--rw-coal); border-color:#c5c3bd; }

.editbox[readonly]{ background:var(--rw-oyster); color:var(--rw-slate); border-color:var(--rw-border-2); }

.info-banner{ background:#eaf1f5; border-left:3px solid #1f5d83; border-radius:3px; padding:10px 14px; margin-bottom:14px; font-size:12.5px; color:#1f4a6a; }
.warn-banner{ background:#fbf3d8; border-left:3px solid #a96b00; border-radius:3px; padding:10px 14px; margin-bottom:14px; font-size:12.5px; color:#7a5a00; }

.brd-tag{ display:inline-block; font-size:10px; font-weight:700; color:#1f6a4a; background:#e2f1ea; border-radius:3px; padding:1px 6px; letter-spacing:.02em; }
.q-tag{ display:inline-block; font-size:10px; font-weight:700; color:#8a2f23; background:#f4dad6; border-radius:3px; padding:1px 6px; letter-spacing:.02em; }
.week-hd td{ background:#f5f4f0 !important; padding:8px 12px !important; }
.week-hd-inner{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

.sys-row td{ background:#faf9f6; color:var(--rw-slate); font-style:italic; }
.modal-backdrop{ display:none; position:fixed; inset:0; background:rgba(20,20,24,.45); z-index:100; align-items:flex-start; justify-content:center; padding:6vh 20px; overflow-y:auto; }

.modal{ background:#fff; border-radius:8px; width:100%; max-width:640px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
.modal-header{ display:flex; align-items:center; justify-content:space-between; padding:15px 20px; border-bottom:1px solid var(--rw-border); }

.tab-row{ display:flex; gap:4px; border-bottom:1px solid var(--rw-border); margin-bottom:16px; flex-wrap:wrap; }

.tab-pane{ display:none; } .tab-pane.active{ display:block; }

.emp-switch{ display:flex; align-items:center; gap:8px; background:#fff7e6; border:1px solid #e6cf9a; border-radius:6px; padding:8px 12px; margin-bottom:14px; font-size:12.5px; }

<script>

      '<span><span class="wf-lbl">'+esc(ev.act)+'</span><br><span class="wf-sub">by '+esc(ev.by)+' → '+esc(ev.to)+'</span></span></div>';
  });
  h += '</div>';
  return h;
}

  var h = band('Timesheet · '+e.kind, 'My Timesheet — '+esc(e.name),

  // #2 employee identity switcher — log in as any employee for visualisation

    '</select><span style="color:var(--rw-slate)">— switch to visualise any employee\'s timesheet &amp; workflow.</span></div>';

  var statusBadge = isOpen ? '<span class="chip chip-open">Open — before payroll cut-off</span>'
    : isFuture ? (augApproved?'<span class="chip chip-approved">Advance-approved</span> <span class="chip chip-open">Advance closure</span>':'<span class="chip chip-submitted">Future — frozen (pre-populated), advance-approvable</span>')
    : '<span class="chip chip-closed">Closed — payroll cut-off passed</span>';
  h += '<div class="card"><div class="card-body" style="display:flex;gap:14px;align-items:end;flex-wrap:wrap">'+
    '<div class="hdr-item"><span class="form-label">Month</span><select class="form-select" style="width:200px" onchange="view.month=this.value;renderMyTimesheet()">'+
      MONTHS_ALL.map(function(m){ return '<option '+(m.key===view.month?'selected':'')+'>'+m.key+'</option>'; }).join('')+'</select></div>'+

        AUG_WEEKS.map(function(w,i){ return '<option value="'+i+'" '+(i===view.augWeek?'selected':'')+'>Week '+(i+1)+' · '+w.range+'</option>'; }).join('')+'</select></div>'+
      '</div></div>';
    h += '<div class="card"><div class="card-toolbar"><span class="card-title">'+view.month+' &middot; Week '+(view.augWeek+1)+' &middot; '+aw.range+' — frozen</span></div>';

      aw.days.map(function(d){ return '<th class="num" style="'+(d.weekend?'color:#b0aea8':'')+'">'+DOW_SHORT[d.dow]+'<br><span style="font-weight:400">'+d.date+'</span></th>'; }).join('')+

    var dailyTot=[0,0,0,0,0,0,0];

      var cells=aw.days.map(function(d,di){ var v=(!d.weekend&&d.inMonth)?perDay:0; rowTot+=v; dailyTot[di]+=v; return '<td class="num"><span style="color:'+(v?'var(--rw-slate)':'#b0aea8')+'">'+v.toFixed(2)+'</span></td>'; }).join('');

  // Closed month → read-only summary; no time entry
  if (!isOpen){
    var st = (MONTH_STATUS[e.id] && MONTH_STATUS[e.id][view.month]) || {status:'Approved'};

      '</div></div>';
    // #10 retrospective project/WBS change after cut-off for this closed month

          '<td class="num" style="color:var(--rw-danger)">'+(adj.applied?'-'+d.hrs.toFixed(2):d.hrs.toFixed(2))+'</td>'+
          '<td>'+esc(proj(adj.newProj).name)+' · '+adj.newTask+' '+(adj.applied?flagChip('Adjustment'):'<span style="font-size:11px;color:var(--rw-slate)">to add</span>')+'</td>'+
          '<td class="num" style="color:var(--rw-success)">'+(adj.applied?'+'+d.hrs.toFixed(2):d.hrs.toFixed(2))+'</td></tr>';
      }).join('');
      h += '<div class="card"><div class="card-toolbar"><span class="card-title">Retrospective Project / WBS change &mdash; after cut-off <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--rw-slate)">(day-wise)</span></span><div class="card-toolbar-right">'+(adj.applied?'<span class="chip chip-approved">Applied → Accrual</span>':'<span class="chip chip-warn">Action needed</span>')+'</div></div><div class="card-body">'+
        '<p style="font-size:12.5px;color:var(--rw-ink-2);margin:0 0 12px">The project/task changed <strong>after the cut-off</strong>. Each affected day is <strong>cancelled on the old</strong> project/task '+flagChip('Cancel')+' and <strong>re-added on the new</strong> one '+flagChip('Adjustment')+'; accrual reverses (−) and adds (+) per day in the open period.</p>'+
        '<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Cancel — old (Project · Task)</th><th class="num">Hours</th><th>Adjustment — new (Project · Task)</th><th class="num">Hours</th></tr></thead><tbody>'+
          adjRows+
          '<tr style="font-weight:700;background:#faf9f6"><td>Total</td><td>'+esc(proj(adj.oldProj).name)+' · '+adj.oldTask+'</td><td class="num" style="color:var(--rw-danger)">'+(adj.applied?'-':'')+adjHrs(adj).toFixed(2)+'</td><td>'+esc(proj(adj.newProj).name)+' · '+adj.newTask+'</td><td class="num" style="color:var(--rw-success)">'+(adj.applied?'+':'')+adjHrs(adj).toFixed(2)+'</td></tr>'+
        '</tbody></table></div>'+
        (adj.applied
          ? '<div class="info-banner" style="margin:12px 0 0">Applied day-wise — sent to Accrual Integration as '+(adj.days||[]).length+' day(s): −'+adjHrs(adj)+'h ('+adj.oldProj+') and +'+adjHrs(adj)+'h ('+adj.newProj+') in the open period. '+(adj.approved?'Manager-approved.':'Awaiting manager approval.')+'</div>'
          : '<div style="margin:12px 0 0;display:flex;gap:8px"><button class="btn btn-primary btn-sm" onclick="applyAdjustment('+ADJUSTMENTS.indexOf(adj)+')">Enter new &amp; cancel old (day-wise)</button></div>')+

    '<div class="hdr-item"><span class="form-label">Weekly Cut-off</span><span class="form-value" style="font-weight:700;color:var(--rw-danger)">'+cutoffForWeek(view.week)+'</span></div>'+

      return '<td class="num"><span style="font-size:11.5px;color:var(--rw-slate)">'+esc(ts.dayShift[di]||'—')+'</span></td>';
    }).join('')+'<td></td><td></td></tr>';

  var dailyTot = [0,0,0,0,0,0,0];
  ts.lines.forEach(function(ln, li){
    var rowTot = 0;
    var cells = ln.hrs.map(function(v, di){
      rowTot += num(v); dailyTot[di]+=num(v);
      var dis = (!editable || abs[di]); // #2 Saturday & Sunday are now editable too (default 0)
      return '<td class="num">'+(dis
        ? '<span style="color:#b0aea8">'+(abs[di]?'—':num(v).toFixed(2))+'</span>'

    }).join('');
    // Project LOV (employee's allocated projects)
    var projCell = editable
      ? '<select class="form-select" style="height:28px;font-size:12px" onchange="setLineProj('+li+',this.value)">'+projs.map(function(pid){var pr=proj(pid);return '<option value="'+pid+'" '+(pid===ln.proj?'selected':'')+'>'+esc(pr.name)+'</option>';}).join('')+'</select>'
      : esc(proj(ln.proj).name);
    // Task LOV: project WBS (skipped for the org project) + common non-billable tasks (Leave excluded — HR only)
    var wbsGrp = proj(ln.proj).tasks.length
      ? '<optgroup label="Project WBS">'+proj(ln.proj).tasks.map(function(t){return '<option value="'+t.code+'" '+(t.code===ln.task?'selected':'')+'>'+t.code+' · '+esc(t.name)+'</option>';}).join('')+'</optgroup>' : '';
    var taskCell = editable
      ? '<select class="form-select" style="height:28px;font-size:12px" onchange="setLineTask('+li+',this.value)">'+
          wbsGrp+
          '<optgroup label="Common (non-billable)">'+selectableCommonTasks().map(function(t){return '<option value="'+t.code+'" '+(t.code===ln.task?'selected':'')+'>'+esc(t.name)+'</option>';}).join('')+'</optgroup>'+
        '</select>'
      : taskName(ln.proj, ln.task);
    h += '<tr><td>'+projCell+'</td><td>'+taskCell+'</td>'+
      cells+'<td class="num"><strong>'+rowTot.toFixed(2)+'</strong></td>'+
      '<td>'+(editable?'<button class="btn btn-ghost btn-sm" onclick="removeTSLine('+li+')">✕</button>':'')+'</td></tr>';
  });
  // system rows: Leave (from absence) and Billing Loss
  var absDays = absenceForWeek(e.id, view.week);
  if (Object.keys(absDays).length){
    h += '<tr class="sys-row"><td colspan="2">Leave / Absence <span class="brd-tag">from Absence</span></td>'+

      '<td class="num">—</td><td></td></tr>';
  }
  var weekdayCount = WEEKS[view.week].days.filter(function(d){return !d.weekend && d.inMonth;}).length;
  var stdWeek = e.stdHrs*weekdayCount;
  var billableEntered = 0; ts.lines.forEach(function(l){ if(l.type==='Billable') l.hrs.forEach(function(v){billableEntered+=num(v);}); });
  var absHrs = Object.keys(absDays).filter(function(k){return absDays[k]==='Leave';}).length*8;
  var billingLoss = Math.max(0, stdWeek - billableEntered - absHrs);
  if (billingLoss>0){
    h += '<tr class="sys-row"><td colspan="2">Billing Loss <span class="brd-tag">read-only</span></td><td class="num" colspan="7" style="text-align:center;color:var(--rw-slate)">auto-distributed across working days</td>'+
      '<td class="num">'+billingLoss.toFixed(2)+'</td><td></td></tr>';
  }
  h += '</tbody><tfoot>'+
    '<tr><td colspan="2">Standard / day</td>'+
      WEEKS[view.week].days.map(function(d){ return '<td class="num">'+((!d.weekend&&d.inMonth)?e.stdHrs.toFixed(2):'<span style="color:#b0aea8">—</span>')+'</td>'; }).join('')+
      '<td class="num">'+stdWeek.toFixed(2)+'</td><td></td></tr>'+
    '</tfoot></table></div>';

  h += '<div style="display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--rw-border);align-items:center">';
  if (editable){
    h += '<span style="margin-right:auto"></span>'+
      '<button class="btn btn-outline btn-sm" onclick="saveTS()">Save Draft</button>'+
      '<button class="btn btn-primary btn-sm" onclick="submitTS()">Submit for Approval</button>';
  } else if (wState==='Pending'){ h += '<span style="margin-right:auto;font-size:12px;color:var(--rw-slate)">Submitted — locked pending manager approval.</span>';
  } else if (wState==='Approved'){ h += '<span style="margin-right:auto;font-size:12px;color:var(--rw-slate)">Approved &amp; locked.</span>';
  } else if (view.week>CURRENT_WEEK){ h += '<span style="margin-right:auto;font-size:12px;color:var(--rw-slate)">Future week — entry disabled.</span>'; }
  h += '</div></div>';

  // #5 approval workflow per project for this week
  var wfProjs = projsInWeek(e.id, view.week).filter(function(pid){ return wk(e.id,pid,view.week).history.length; });
  if (wfProjs.length){
    h += '<div class="card"><div class="card-toolbar"><span class="card-title">Approval workflow — Week '+(view.week+1)+'</span></div><div class="card-body">';
    wfProjs.forEach(function(pid){
      var s = wk(e.id,pid,view.week);
      var rd = rejectedDatesList(e.id,pid,view.week);
      var withMsg = s.status==='Pending' ? '<div class="wf-with">This week for <strong>'+esc(proj(pid).name)+'</strong> is <strong>pending with '+esc(approverFor(e.id,pid))+'</strong>.</div>'
        : s.status==='Rejected' ? '<div class="wf-with rej">Rejected by '+esc(approverFor(e.id,pid))+' — reason: <strong>'+esc(s.reason)+'</strong>'+(s.remarks?'. Remarks: <em>'+esc(s.remarks)+'</em>':'')+(rd.length?'. Dates sent back: <strong>'+rd.join(', ')+'</strong>':'')+'. It is back with you; edit &amp; resubmit before the delivery cut-off.</div>'
        : s.status==='Approved' ? '<div class="wf-with" style="background:#e2f1ea;border-left-color:var(--rw-success);color:#1f6a4a">Approved by '+esc(approverFor(e.id,pid))+' — closed.</div>' : '';
      h += '<p class="section-title" style="margin:6px 0">'+esc(proj(pid).name)+' ('+pid+') '+statusChip(s.status)+flagChips(s.flags)+'</p>'+withMsg+wfStrip(s.history);
      if (s.status==='Rejected') h += '<div style="margin:8px 0 16px"><button class="btn btn-primary btn-sm" onclick="submitTS()">Edit &amp; Resubmit this week</button></div>';
    });
    h += '</div></div>';
  }

  h += '</div>';
  document.getElementById('mainArea').innerHTML = h;
}
function tsKey(){ return selfEmp()+'|'+view.week; }
function setTSHrs(li,di,v){ TS[tsKey()].lines[li].hrs[di]=Math.min(24,Math.max(0,Math.round(num(v)*4)/4)); renderMyTimesheet(); }
function stepHr(li,di,delta){ var cur=num(TS[tsKey()].lines[li].hrs[di]); setTSHrs(li,di, cur+delta); }
function setTSType(li,v){ TS[tsKey()].lines[li].type=v; if(v==='Billable')TS[tsKey()].lines[li].reason=''; renderMyTimesheet(); }
function setTSReason(li,v){ TS[tsKey()].lines[li].reason=v; }
function setLineProj(li,v){ var ln=TS[tsKey()].lines[li]; ln.proj=v; var w0=proj(v).tasks[0];
  if(w0){ ln.task=w0.code; ln.type='Billable'; ln.reason=''; }            // regular project -> first WBS task, billable
  else { var ct=selectableCommonTasks()[0]; ln.task=ct.code; ln.type='Non-billable'; ln.reason=ct.reason; } // org project -> common non-billable task
  renderMyTimesheet(); }
function setLineTask(li,v){ var ln=TS[tsKey()].lines[li]; ln.task=v; var st=specialTask(v);
  // #1 a special task IS the unbilled reason — set it at the line (project) level; put hours only on the affected day for a day-level reason
  if(st){ ln.type='Non-billable'; ln.reason=st.reason; } else { ln.type='Billable'; ln.reason=''; }
  renderMyTimesheet(); }
function setLineShift(li,v){ TS[tsKey()].lines[li].shift=v; }
// #6 one shift per employee per day — set it on the day, so two shifts on the same day are impossible by construction
function setDayShift(di,v){ var t=TS[tsKey()]; if(!t.dayShift)t.dayShift=[]; t.dayShift[di]=v; }
// #2 allocation shown as a link → popup
function showAllocation(){
  var e=emp(selfEmp());

}
function addTSLine(){ var pid=myProjects()[0]; TS[tsKey()].lines.push({proj:pid,task:proj(pid).tasks[0].code,shift:emp(selfEmp()).alloc[0].shift,type:'Billable',reason:'',hrs:[0,0,0,0,0,0,0]}); renderMyTimesheet(); }
function removeTSLine(li){ TS[tsKey()].lines.splice(li,1); renderMyTimesheet(); }
function saveTS(){ toast('Draft saved — you can keep editing until the weekly cut-off.'); }
function submitTS(){
  var t=TS[tsKey()];
  var daily=[0,0,0,0,0,0,0], missingReason=false;
  t.lines.forEach(function(l){ l.hrs.forEach(function(v,di){daily[di]+=num(v);}); if(l.type==='Non-billable'&&!l.reason)missingReason=true; });
  if (daily.some(function(d){return d>24;})){ toast('Cannot submit: a day exceeds 24 hours.'); return; }
  if (missingReason){ toast('Cannot submit: unbilled reason is mandatory for non-billable hours.'); return; }
  t.status = (view.week < CURRENT_WEEK && t.wasRejected) ? 'Late submission' : 'Submitted';
  if (view.week < CURRENT_WEEK && t.wasRejected) t.lateFlag = true;
  submitWeekWorkflow(selfEmp(), view.week);
  toast('Timesheet submitted — each project-line routed to its project manager.');
  renderMyTimesheet();
}

function mgrProjects(){ return PROJECTS.filter(function(p){ return p.managerId===SELF.Manager; }); }
function empsOnProject(pid){ return EMPLOYEES.filter(function(e){ return e.alloc.some(function(a){return a.proj===pid;}) && !e.isManager; }); }
function empMonthTotals(e, pid){
  var bill=0, nonbill=0, leave=0;
  WEEKS.forEach(function(w){ var t=ensureTS(e.id,w.idx);   // full month (all weeks overlapping July)
    t.lines.forEach(function(l){ if(l.proj!==pid) return; l.hrs.forEach(function(v,di){ if(!w.days[di].inMonth)return; if(l.type==='Billable')bill+=num(v); else nonbill+=num(v); }); });
  });
  ABSENCE.forEach(function(a){ if(a.emp===e.id && a.type==='Leave') leave+=8; });
  return {bill:bill, nonbill:nonbill, leave:leave, total:bill+nonbill+leave};
}
function capFor(e, pid){ var p=proj(pid); return p.model.indexOf('Capacity')>=0 ? {type:'Monthly Hours', hrs:160} : {type:'', hrs:''}; }
// all weeks overlapping the month that have lines for this project (manager reviews the whole month)
function empWeeksForProj(e, pid){ var out=[]; for(var w=0;w<WEEKS.length;w++){ if(projsInWeek(e.id,w).indexOf(pid)>=0) out.push(w); } return out; }
function weekHours(e, pid, w){ var t=ensureTS(e.id,w),b=0,n=0; t.lines.forEach(function(l){ if(l.proj!==pid)return; l.hrs.forEach(function(v,di){ if(!WEEKS[w].days[di].inMonth)return; if(l.type==='Billable')b+=num(v); else n+=num(v); }); }); return {bill:b,nonbill:n}; }
function monthStatus(e, pid){ // derive from weekly workflow
  var wks=empWeeksForProj(e,pid), sub=wks.map(function(w){return wk(e.id,pid,w).status;});
  if (sub.some(function(s){return s==='Rejected';})) return 'Rejected';
  var submitted=sub.filter(function(s){return s!=='Not submitted';});
  if (submitted.length && submitted.every(function(s){return s==='Approved';})) return 'Approved';
  if (submitted.length) return 'Pending';
  return 'Not submitted';
}

function llcAssignedElsewhere(exceptIdx){ var s={}; LLC_ROWS.forEach(function(r,i){ if(i!==exceptIdx && r.assigned) s[r.assigned]=1; }); return s; }
function llcCandidates(rowIdx){
  var row=LLC_ROWS[rowIdx], taken=llcAssignedElsewhere(rowIdx);

  });
}

      '<td>'+(noCand?'<span class="chip chip-rejected">No eligible unbilled employee available</span>':'<select class="form-select" style="height:30px;min-width:240px" onchange="assignLLC('+i+',this.value)">'+opts+'</select>')+'</td>'+
      '<td>'+(r.approved?'<span class="chip chip-approved">Approved · billed (annexure)</span>':(r.assigned?'<span class="chip chip-submitted">Assigned — pending approve</span>':'<span class="chip chip-draft">Pending</span>'))+'</td></tr>';
  });
  h += '</tbody></table></div><div style="padding:10px 16px;border-top:1px solid var(--rw-border);font-size:12px;color:var(--rw-slate)">Assigning a replacement removes them from every other line&rsquo;s drop-down (a person can cover only one absentee per day).</div></div>';

  h += '</div>';

// day-wise billed / unbilled / leave for an employee×project across the open month (July) [#5]
function accrualDayWise(empId, projId){
  var out=[];
  WEEKS.forEach(function(w){ var t=ensureTS(empId,w.idx); var absW=absenceForWeek(empId,w.idx);
    var lines=t.lines.filter(function(l){return l.proj===projId;});
    w.days.forEach(function(d,di){ if(!d.inMonth||d.weekend) return;
      var bill=0,unb=0,reason='',tk='';
      lines.forEach(function(l){ if(l.hrs[di]>0&&!tk)tk=l.task; if(l.type==='Billable')bill+=num(l.hrs[di]); else {unb+=num(l.hrs[di]); if(l.hrs[di]>0&&l.reason)reason=l.reason;} });
      var leave = absW[di]==='Leave'?8:0;
      if (bill||unb||leave) out.push({date:d.date, task:tk||(lines[0]?lines[0].task:'—'), bill:leave?0:bill, unb:unb, leave:leave, reason:absW[di]||reason||'—'});
    });
  });
  return out;
}
function confirmedPairs(){ var out=[]; Object.keys(APPR).forEach(function(k){ if(APPR[k].monthConfirmed){ var p=k.split('|'); out.push({emp:p[0], proj:p[1]}); } }); return out; }

    h += '<tr><td><span class="chip chip-rejected">Cancel</span></td><td>'+esc(x.name)+'</td><td>'+d.date+'</td><td>'+x.period+' → open period</td><td>'+esc(proj(x.oldProj).name)+'</td><td>'+x.oldTask+'</td><td class="num" style="color:var(--rw-danger)">-'+d.hrs.toFixed(2)+'</td><td><span class="chip chip-approved">Manager-approved</span></td><td>'+flagChip('Cancel')+'</td></tr>'+
