<!-- PAGE-010 Sync Status (PER-004 admin)

     Two questions, in order:
       1. Did the jobs run, and did they fit their window?  (NFR-003)
       2. What did they fail on, and can it be retried?     (ACT-032)

     The three run buttons exist because the jobs are normally scheduled: after
     fixing a cause at source an admin wants the repair now, not at the next
     scheduled run. Population is safe to re-run — it never overwrites an entry
     that already exists, so employee input is preserved. -->

<oj-sp-general-overview-page
  id="syncStatusPage"
  class="oj-sm-width-full rw-page-full"
  display-options.responsive-padding="off"
  page-title="[[$application.translations.appBundle.sync_status_sync_status]]"
  page-subtitle="[[$application.translations.appBundle.sync_status_population_daily_action_date_and_defaulting_]]">

  <div class="oj-flex oj-sm-flex-direction-column oj-sm-width-full oj-sm-gap-4x"
       slot="main">

    <!-- ══════════════════ Manual runs ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-start oj-sm-flex-wrap oj-sm-gap-3x">
        <oj-form-layout max-columns="2" direction="row" label-edge="top" class="oj-flex-item">
          <oj-select-single label-hint="[[$application.translations.appBundle.sync_status_period_for_the_job]]"
                            data="[[ $application.variables.periodOptions ]]"
                            value="{{ $variables.runJobPeriodId }}"
                            item-text="label"
                            placeholder="[[$application.translations.appBundle.common_select_period]]">
          </oj-select-single>
        </oj-form-layout>

        <div class="oj-flex oj-sm-gap-2x oj-sm-flex-wrap">
          <oj-button chroming="borderless" on-oj-action="[[ $listeners.reload ]]">
            <span slot="startIcon" class="oj-ux-ico-refresh"></span>
            <span><oj-bind-text value="[[$application.translations.appBundle.common_refresh]]"></oj-bind-text></span>
          </oj-button>
          <oj-button chroming="outlined" disabled="[[ $variables.busy ]]"
                     on-oj-action="[[ $listeners.runDaily ]]">
            <span><oj-bind-text value="[[$application.translations.appBundle.sync_status_run_daily_process]]"></oj-bind-text></span>
          </oj-button>
          <oj-button chroming="outlined"
                     disabled="[[ $variables.busy || !$variables.runJobPeriodId ]]"
                     on-oj-action="[[ $listeners.runDefaulting ]]">
            <span><oj-bind-text value="[[$application.translations.appBundle.sync_status_run_weekly_defaulting]]"></oj-bind-text></span>
          </oj-button>
          <!-- The manager side of the pair (RULE-007). Separate button, not a
               mode of the one above, because they run at different times and
               have opposite consequences for the employee's pay: weekly
               defaulting holds it, delivery defaulting must never. -->
          <oj-button chroming="outlined"
                     disabled="[[ $variables.busy || !$variables.runJobPeriodId ]]"
                     on-oj-action="[[ $listeners.runDeliveryDefaulting ]]">
            <span><oj-bind-text value="[[$application.translations.appBundle.sync_status_run_delivery_defaulting]]"></oj-bind-text></span>
          </oj-button>
          <oj-button chroming="callToAction"
                     disabled="[[ $variables.busy || !$variables.runJobPeriodId ]]"
                     on-oj-action="[[ $listeners.runPopulation ]]">
            <span><oj-bind-text value="[[$application.translations.appBundle.sync_status_run_population]]"></oj-bind-text></span>
          </oj-button>
        </div>
      </div>

      <oj-bind-if test="[[ $variables.openFailures > 0 ]]">
        <div class="oj-sm-padding-3x oj-sm-margin-3x-top rw-notice rw-notice-warning" role="status">
          <oj-bind-text value="[[ $variables.openFailures ]]"></oj-bind-text>
          <oj-bind-text value="[[$application.translations.appBundle.sync_status_record_s_still_failing_a_retry_only_succeeds]]"></oj-bind-text>
        </div>
      </oj-bind-if>
    </div>

    <!-- ══════════════════ Job cards ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <h2 class="oj-typography-heading-xs oj-sm-margin-0 oj-sm-margin-3x-bottom">
        <oj-bind-text value="[[$application.translations.appBundle.sync_status_latest_run_per_job]]"></oj-bind-text>
      </h2>

      <oj-bind-if test="[[ $variables.jobs.length === 0 && !$variables.busy ]]">
        <div class="oj-typography-body-sm rw-metric-label" role="status">
          <oj-bind-text value="[[$application.translations.appBundle.sync_status_no_job_has_run_yet]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <oj-bind-if test="[[ $variables.jobs.length > 0 ]]">
        <div class="rw-grid-scroll">
          <oj-table aria-label="Job runs"
                    data="[[ $variables.jobsADP ]]"
                    layout="fixed"
                    horizontal-grid-visible="enabled"
                    selection-mode='{"row": "none", "column": "none"}'
                    scroll-policy="loadMoreOnScroll"
                    scroll-policy-options='{"fetchSize": 25}'
                    columns='[
                      {"headerText":"Job","field":"jobName","template":"jobCell","weight":3,"minWidth":210},
                      {"headerText":"Scope","field":"scopeKey","width":130},
                      {"headerText":"Status","field":"jobStatus","template":"statusCell","width":130},
                      {"headerText":"Last run","field":"lastRun","width":170},
                      {"headerText":"Duration","field":"durationText","width":110},
                      {"headerText":"Read","field":"recordsRead","width":85},
                      {"headerText":"Upserted","field":"recordsUpserted","width":100},
                      {"headerText":"Failed","field":"recordsFailed","template":"failedCell","width":95},
                      {"headerText":"Message","field":"message","weight":3,"minWidth":220}
                    ]'>

            <template slot="jobCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ cell.row.jobName ]]"></oj-bind-text>
                <div class="oj-typography-body-xs rw-metric-label">
                  <oj-bind-text value="[[ cell.row.periodName || cell.row.actionDate || cell.row.jobType ]]"></oj-bind-text>
                </div>
              </span>
            </template>

            <template slot="statusCell" data-oj-as="cell">
              <span :class="[[ $page.functions.jobStatusClass(cell.row.jobStatus) ]]">
                <oj-bind-text value="[[ cell.row.jobStatus ]]"></oj-bind-text>
              </span>
            </template>

            <template slot="failedCell" data-oj-as="cell">
              <span :class="[[ $page.functions.failedClass(cell.row.recordsFailed) ]]">
                <oj-bind-text value="[[ cell.row.recordsFailed ]]"></oj-bind-text>
              </span>
            </template>
          </oj-table>
        </div>
      </oj-bind-if>
    </div>

    <!-- ══════════════════ Failed-record queue ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-center oj-sm-flex-wrap oj-sm-gap-2x oj-sm-margin-3x-bottom">
        <h2 class="oj-typography-heading-xs oj-sm-margin-0"><oj-bind-text value="[[$application.translations.appBundle.sync_status_failed_records]]"></oj-bind-text></h2>
        <oj-switch label-hint="[[$application.translations.appBundle.sync_status_show_resolved_too]]"
                   value="{{ $variables.showResolved }}">
        </oj-switch>
      </div>

      <oj-bind-if test="[[ $variables.failed.length === 0 && !$variables.busy ]]">
        <div class="oj-typography-body-sm rw-metric-label" role="status">
          <oj-bind-text value="[[$application.translations.appBundle.sync_status_no_failed_records]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <oj-bind-if test="[[ $variables.failed.length > 0 ]]">
        <div class="rw-grid-scroll">
          <oj-table aria-label="Failed records"
                    data="[[ $variables.failedADP ]]"
                    layout="fixed"
                    horizontal-grid-visible="enabled"
                    selection-mode='{"row": "none", "column": "none"}'
                    scroll-policy="loadMoreOnScroll"
                    scroll-policy-options='{"fetchSize": 25}'
                    columns='[
                      {"headerText":"Job","field":"jobName","weight":2,"minWidth":160},
                      {"headerText":"Entity","field":"entityType","template":"entityCell","weight":2,"minWidth":170},
                      {"headerText":"Employee","field":"employeeName","weight":2,"minWidth":170},
                      {"headerText":"Reason","field":"failureReason","weight":3,"minWidth":240},
                      {"headerText":"Retries","field":"retryCount","width":90},
                      {"headerText":"First seen","field":"firstSeenOn","width":160},
                      {"headerText":"State","field":"resolvedFlag","template":"stateCell","width":120},
                      {"headerText":"","field":"failedId","template":"actionCell","width":100,"sortable":"disabled"}
                    ]'>

            <template slot="entityCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ cell.row.entityType ]]"></oj-bind-text>
                <div class="oj-typography-body-xs rw-metric-label">
                  <oj-bind-text value="[[ cell.row.entityKey ]]"></oj-bind-text>
                </div>
              </span>
            </template>

            <template slot="stateCell" data-oj-as="cell">
              <span :class="[[ $application.functions.yesNo(cell.row.resolvedFlag, 'rw-status rw-status-approved', 'rw-status rw-status-rejected') ]]">
                <oj-bind-text value="[[ $application.functions.yesNo(cell.row.resolvedFlag, 'Resolved', 'Open') ]]"></oj-bind-text>
              </span>
            </template>

            <template slot="actionCell" data-oj-as="cell">
              <oj-bind-if test="[[ cell.row.resolvedFlag !== 'Y' ]]">
                <oj-button chroming="outlined" disabled="[[ $variables.busy ]]"
                           :aria-label="[[ $page.functions.retryLabel(cell.row.entityKey) ]]"
                           on-oj-action="[[ $listeners.retryRecord ]]">
                  <span><oj-bind-text value="[[$application.translations.appBundle.sync_status_retry]]"></oj-bind-text></span>
                </oj-button>
              </oj-bind-if>
            </template>
          </oj-table>
        </div>
      </oj-bind-if>
    </div>

    <oj-bind-if test="[[ $variables.busy ]]">
      <div class="oj-flex oj-sm-align-items-center oj-sm-gap-2x" role="status" aria-live="polite">
        <oj-progress-circle size="sm" value="-1"></oj-progress-circle>
        <span class="oj-typography-body-sm"><oj-bind-text value="[[$application.translations.appBundle.common_working]]"></oj-bind-text></span>
      </div>
    </oj-bind-if>

  </div>

  <!-- ══════════════════ Confirmation ══════════════════ -->
  <!-- oj-dialog opened via Actions.callComponentMethod, not window.confirm:
       SES blocks browser globals inside chains (knowledge/14 §7). -->
  <oj-dialog id="runDefaultingDlg" dialog-title="[[$application.translations.appBundle.sync_status_run_the_defaulting_job]]" cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-md">
        <oj-bind-text value="[[ $variables.confirmMessage ]]"></oj-bind-text>
      </p>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.cancelRunDefaulting ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="danger" disabled="[[ $variables.busy ]]"
                 on-oj-action="[[ $listeners.confirmRunDefaulting ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.sync_status_run_defaulting]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

</oj-sp-general-overview-page>
