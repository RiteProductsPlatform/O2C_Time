  `<!-- PAGE-001 My Timesheet (PER-001 Employee, PER-002 Contractor)

     What is deliberately NOT on this page:
       * Billable Type (FLD-012) — hidden from the employee, manager-only (#7).
       * Bill rate / revenue      — restricted fields per the Personas sheet.
       * A Leave picker           — leave comes from HCM Absence (RULE-008); the
                                    Leave row renders read-only.
       * Editable Billing Loss    — automatic and non-editable (RULE-009).

     Shift is displayed per day but never editable (RULE-011). Sat/Sun ARE
     editable and default to 0 (RULE-012). -->

<oj-sp-general-overview-page
  id="myTimesheetPage"
  class="oj-sm-width-full rw-page-full"
  display-options.responsive-padding="off"
  page-title="[[$application.translations.appBundle.my_timesheet_my_timesheet]]"
  page-subtitle="[[$application.translations.appBundle.my_timesheet_record_your_time_per_task_per_day_then_submi]]">

  <div class="oj-flex oj-sm-flex-direction-column oj-sm-width-full oj-sm-gap-4x"
       slot="main">

    <!-- ══════════════════ Selectors + cut-off ══════════════════ -->
    <div class="oj-flex oj-sm-flex-direction-column oj-sm-gap-2x oj-sm-padding-4x rw-metric">

      <!-- TWO ROWS, NOT TWO COLUMNS.
           These six fields first shared one max-columns="4" grid: every column
           sized to a dropdown and the four short facts wrapped 4 + 2 with a
           dropdown-width hole in the middle. Splitting them into two groups
           side by side fixed the alignment and created a worse problem — six
           things now fitted on one line, so the flex row compressed the two
           selects until "AUG-2026" and "Week 4 (17-Aug to 23-Aug)" were both
           cut off. The controls got squeezed by the labels.
           Stacked instead: the things you operate on the first row with the
           allocation link, the things you read on the second. Nothing competes
           for width with anything of a different kind. -->
      <div class="oj-flex oj-sm-flex-direction-column oj-sm-gap-3x">

        <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-end oj-sm-flex-wrap oj-sm-gap-4x">

        <oj-form-layout max-columns="2" direction="row" label-edge="top" class="oc-ts-pickers">

          <oj-select-single label-hint="[[$application.translations.appBundle.common_month]]"
                            data="[[ $application.variables.periodOptions ]]"
                            value="{{ $variables.periodId }}"
                            item-text="label"
                            placeholder="[[$application.translations.appBundle.my_timesheet_select_month]]">
          </oj-select-single>

          <oj-select-single label-hint="[[$application.translations.appBundle.my_timesheet_select_week]]"
                            data="[[ $variables.weekOptions ]]"
                            value="{{ $variables.weekId }}"
                            item-text="label"
                            placeholder="[[$application.translations.appBundle.my_timesheet_select_week_2]]">
          </oj-select-single>

        </oj-form-layout>

        <!-- FLD-005 / ACT-008 -->
        <oj-button chroming="borderless" on-oj-action="[[ $listeners.showAllocation ]]">
          <span slot="startIcon" class="oj-ux-ico-information-s"></span>
          <span><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_my_allocation]]"></oj-bind-text></span>
        </oj-button>

        </div><!-- /row 1: what you operate -->

        <!-- Row 2: what you read — cut-off, both status axes, the pattern. -->
        <oj-form-layout max-columns="4" direction="row" label-edge="top">

          <!-- FLD-003 weekly cut-off, shown to the employee -->
          <oj-label-value>
            <span slot="label" class="oj-label-nowrap"><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_weekly_cut_off]]"></oj-bind-text></span>
            <span slot="value" class="oj-typography-body-md">
              <oj-bind-text value="[[ $variables.weeklyCutoff || '—' ]]"></oj-bind-text>
            </span>
          </oj-label-value>

          <!-- FLD-004, SPLIT INTO THE TWO V4 AXES 18-Aug-2026.
               One chip showed WEEK_STATUS, which collapses SUBMISSION_STATUS
               and APPROVAL_STATUS into a single word. They are independent and
               they belong to different people: the first says what the employee
               has done, the second what the manager has decided. Collapsed, the
               screen could not distinguish "you have not sent this yet" from
               "you sent it and nobody has looked" -- and only the first is
               something the person reading it can act on.
               The status text is always rendered, so the capsule colour is a
               reinforcement and never the only signal. -->
          <oj-label-value>
            <span slot="label" class="oj-label-nowrap"><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_your_status]]"></oj-bind-text></span>
            <span slot="value">
              <span :class="[[ $application.functions.statusClass($variables.submissionStatus) ]]">
                <oj-bind-text value="[[ $page.functions.submissionLabel($variables.submissionStatus) ]]"></oj-bind-text>
              </span>
            </span>
          </oj-label-value>

          <oj-label-value>
            <span slot="label" class="oj-label-nowrap"><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_manager_status]]"></oj-bind-text></span>
            <span slot="value">
              <span :class="[[ $application.functions.statusClass($variables.approvalStatus) ]]"
                    :title="[[ $page.functions.approvalHint($variables.submissionStatus, $variables.approvalStatus) ]]">
                <oj-bind-text value="[[ $page.functions.approvalLabel($variables.approvalStatus) ]]"></oj-bind-text>
              </span>
            </span>
          </oj-label-value>

          <!-- RULE-011, at WEEK grain. This replaced a seven-cell day strip
               that showed the same value in every cell -- and before that, a
               surrogate shift id. A pattern is which days of the week somebody
               works, so it is one fact about the week; repeated per day it
               implied it could differ per day, which it cannot.
               A SHIFT is the standard hours and is already shown, per day, on
               the Standard/day row. -->
          <oj-label-value>
            <span slot="label" class="oj-label-nowrap"><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_pattern]]"></oj-bind-text></span>
            <span slot="value" class="oj-typography-body-md">
              <oj-bind-text value="[[ $variables.weekPattern || '—' ]]"></oj-bind-text>
            </span>
          </oj-label-value>

        </oj-form-layout>

      </div><!-- /the two stacked rows -->

      <!-- The 6 workflow flags. Independent of status and several can be set at
           once, so they render as a row of chips, each carrying the explanation
           in its title. -->
      <oj-bind-if test="[[ $application.functions.weekFlags($variables.weekRow).length > 0 ]]">
        <div class="oj-flex oj-sm-gap-2x oj-sm-flex-wrap">
          <oj-bind-for-each data="[[ $application.functions.weekFlags($variables.weekRow) ]]">
            <template>
              <span :class="[[ $current.data.cls ]]" :title="[[ $current.data.title ]]">
                <oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text>
              </span>
            </template>
          </oj-bind-for-each>
        </div>
      </oj-bind-if>
    </div>

    <!-- ══════════════════ Rejection notice (#5) ══════════════════ -->
    <!-- The prototype's warn-banner recoloured red: full width, between the
         week selector and the grid, carrying the manager's reason, remarks and
         the exact dates sent back so the employee knows what to correct.

         .rw-reject-banner, NOT .rw-shell-error - that one is the "the whole
         shell failed" box and carries max-width:640px; margin:48px auto, which
         rendered this as a narrow panel floating in the middle of the page. -->
    <oj-bind-if test="[[ $variables.weekStatus === 'Rejected' ]]">
      <div class="rw-reject-banner" role="alert">
        <div class="rw-reject-title">
          <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_this_week_was_rejected]]"></oj-bind-text>
        </div>
        <div>
          <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_correct_the_hours_below_and_submit_again_you]]"></oj-bind-text>
          <oj-bind-text value="[[ $page.functions.cutoffSuffix($variables.deliveryCutoff) ]]"></oj-bind-text>
        </div>
        <div class="oj-sm-margin-1x-top">
          <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_reject_reason_label]]"></oj-bind-text>
          <!-- The stored code is 'Manager' / 'Client' / 'Absence'. Printed raw
               and straight after an em dash it read as the name of a person. -->
          <strong><oj-bind-text value="[[ $page.functions.rejectReasonLabel($variables.rejectReason) ]]"></oj-bind-text></strong>
          <oj-bind-if test="[[ $variables.rejectedBy ]]">
            <span><oj-bind-text value="[[ $page.functions.rejectedByLabel($variables.rejectedBy) ]]"></oj-bind-text></span>
          </oj-bind-if>
        </div>
        <oj-bind-if test="[[ $variables.rejectRemarks ]]">
          <div>
            <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_reject_remarks_label]]"></oj-bind-text>
            <em><oj-bind-text value="[[ $variables.rejectRemarks ]]"></oj-bind-text></em>
          </div>
        </oj-bind-if>
        <oj-bind-if test="[[ $variables.rejectedDates.length > 0 ]]">
          <div class="oj-sm-margin-1x-top oj-flex oj-sm-gap-1x oj-sm-flex-wrap oj-sm-align-items-center">
            <span><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_rejected_dates]]"></oj-bind-text></span>
            <oj-bind-for-each data="[[ $variables.rejectedDates ]]">
              <template>
                <span class="rw-flag rw-flag-reversal">
                  <oj-bind-text value="[[ $application.functions.fmtDate($current.data.rejected_date) ]]"></oj-bind-text>
                </span>
              </template>
            </oj-bind-for-each>
          </div>
        </oj-bind-if>
      </div>
    </oj-bind-if>

    <!-- ══════════════════ Read-only notices ══════════════════ -->
    <!-- Every period stays VISIBLE; only editing is gated. A closed month is
         history the employee is entitled to look at, and the design
         (doc/O2C_Timesheet_Module.html) lists every month in the picker with a
         status chip rather than hiding the ones that cannot be typed into.
         Without a notice, a read-only grid just looks broken. -->
    <!-- A future WEEK inside an open month. Distinct from the notice below,
         which is about the whole period: August can be open while the week
         beginning the 10th has not started. Without this the grid rendered
         enterable cells and an active Submit for a week the server refuses with
         -20004, so the only way to find out was to press the button. -->
    <oj-bind-if test="[[ $variables.lockedReason === 'future' ]]">
      <div class="oj-sm-padding-3x rw-notice" role="status">
        <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_week_not_started]]"></oj-bind-text>
      </div>
    </oj-bind-if>

    <!-- Locked by the weekly cut-off. The employee cannot edit it; a manager
         can. Saying which is the difference between a dead end and a next step. -->
    <oj-bind-if test="[[ $variables.lockedReason === 'locked' && !$variables.holdReopen ]]">
      <div class="oj-sm-padding-3x rw-notice" role="status">
        <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_week_locked]]"></oj-bind-text>
      </div>
    </oj-bind-if>

    <oj-bind-if test="[[ $variables.periodState === 'Future' ]]">
      <div class="oj-sm-padding-3x rw-notice" role="status">
        <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_this_month_has_not_started_yet_values_are_sh]]"></oj-bind-text>
      </div>
    </oj-bind-if>

    <!-- PROC-007. Three read-only notices above stand down when this is on,
         and they had to: "ask your manager to correct it", "this month is
         closed" and "auto-submitted and locked" were all true and all the wrong
         instruction. The window exists precisely so this person can fix it
         themselves, and a screen that says otherwise wastes the window. -->
    <oj-bind-if test="[[ $variables.holdReopen ]]">
      <div class="oj-sm-padding-3x rw-notice rw-notice-warning" role="status">
        <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_hold_reopen]]"></oj-bind-text>
        <!-- Always shown while the window is open, rather than appearing the
             moment a cell changes: a field that materialises under the cursor
             mid-edit is worse than one that was there from the start. The
             server only enforces it when something actually moved. -->
        <oj-input-text class="oj-sm-margin-2x-top"
                       label-hint="[[$application.translations.appBundle.my_timesheet_correction_reason]]"
                       label-edge="top"
                       value="{{ $variables.submitReason }}"
                       placeholder="[[$application.translations.appBundle.my_timesheet_correction_reason_ph]]">
        </oj-input-text>
      </div>
    </oj-bind-if>

    <!-- Closed, but the backdating window (RULE-019) may still be open. Saying
         so turns a dead end into the next step: the retro adjustment is exactly
         the route for correcting a closed month. -->
    <oj-bind-if test="[[ $variables.periodState === 'Closed' && !$variables.holdReopen ]]">
      <div class="oj-sm-padding-3x rw-notice" role="status">
        <oj-bind-text value="[[ $page.functions.closedPeriodMessage(
                                  $application.variables.adjustmentAllowed) ]]"></oj-bind-text>
      </div>
    </oj-bind-if>

    <!-- A defaulted week locks only when the EMPLOYEE missed the weekly cut-off.
         If the manager missed the delivery cut-off the week is still theirs to
         approve and the employee is not at fault, so the wording differs. -->
    <oj-bind-if test="[[ $variables.locked && !$variables.holdReopen ]]">
      <div class="oj-sm-padding-3x rw-notice rw-notice-warning" role="status">
        <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_this_week_was_auto_submitted_with_default_ho]]"></oj-bind-text>
      </div>
    </oj-bind-if>

    <oj-bind-if test="[[ !$variables.locked && $variables.defaultedBy === 'MANAGER' ]]">
      <div class="oj-sm-padding-3x rw-notice rw-notice-warning" role="status">
        <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_the_delivery_cut_off_passed_before_your_mana]]"></oj-bind-text>
      </div>
    </oj-bind-if>

    <!-- ══════════════════ The weekly grid ══════════════════ -->
    <!-- ONE table, matching doc/O2C_Timesheet_Module.html. The prototype puts
         Shift in a sys-row at the top of the tbody and Standard / day in the
         tfoot, inside the same table as the hours — not in a separate strip
         above it, which is what this used to be and which could never stay
         column-aligned with the grid.

         Flex rows rather than <table>, because <oj-bind-for-each> is a custom
         element and is invalid inside <tr> — the parser lifts it out of the
         table. ARIA roles keep it a table to a screen reader.

         Day columns come from dayHeaders, so a week clipped to the month end
         shows exactly its own days: week 5 here is Mon 27 - Fri 31 and has no
         Sat/Sun at all. The old oj-table hard-coded seven columns and drew two
         phantom weekend cells belonging to the next month.

         Deliberately NOT shown to the employee: billable type, bill rate and
         billing loss (FLD-012 and the Personas sheet — the prototype comment
         is explicit that "billable TYPE is hidden from the employee"). -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-center oj-sm-margin-3x-bottom">
        <h2 class="oj-typography-heading-xs oj-sm-margin-0">
          <oj-bind-text value="[[$application.translations.appBundle.common_week]]"></oj-bind-text> <oj-bind-text value="[[ $variables.weekRange ]]"></oj-bind-text>
        </h2>
        <oj-bind-if test="[[ $variables.editable ]]">
          <oj-button chroming="outlined" on-oj-action="[[ $listeners.openAddLine ]]">
            <span slot="startIcon" class="oj-ux-ico-plus"></span>
            <span><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_add_line]]"></oj-bind-text></span>
          </oj-button>
        </oj-bind-if>
      </div>

      <div class="rw-grid-scroll">
        <div class="rw-ts" role="table" aria-label="Weekly hours by project and task">

          <!-- Header -->
          <div class="rw-ts-row rw-ts-head" role="row">
            <span class="rw-ts-proj" role="columnheader"><oj-bind-text value="[[$application.translations.appBundle.common_project]]"></oj-bind-text></span>
            <span class="rw-ts-task" role="columnheader"><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_task_wbs]]"></oj-bind-text></span>
            <oj-bind-for-each data="[[ $variables.dayHeaders ]]">
              <template data-oj-as="day">
                <span role="columnheader"
                      :class="[[ $page.functions.dayHeaderClass(day.data) ]]"
                      :title="[[ $application.functions.fmtDate(day.data.entryDate) ]]">
                  <oj-bind-text value="[[ day.data.dayName ]]"></oj-bind-text>
                  <span class="rw-ts-sub">
                    <oj-bind-text value="[[ $application.functions.fmtDayShort(day.data.entryDate) ]]"></oj-bind-text>
                  </span>
                </span>
              </template>
            </oj-bind-for-each>
            <span class="rw-ts-tot" role="columnheader"><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_total]]"></oj-bind-text></span>
            <span class="rw-ts-act" role="columnheader"></span>
          </div>

          <!-- The Shift day-strip that stood here is GONE, deliberately.
               RULE-011 is still honoured -- it moved to the week header as
               Pattern, which is its real grain.
               It showed shiftCode in all seven cells: a surrogate id at first
               ("300000265863352"), and even resolved to a name it was the same
               value seven times, restating STD_HOURS_PER_DAY which the
               Standard/day row below already gives per day. -->

          <!-- Entry lines -->
          <oj-bind-if test="[[ $variables.gridRows.length === 0 ]]">
            <div class="rw-ts-row" role="row">
              <span class="rw-ts-empty" role="cell"><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_no_hours_yet_for_this_week]]"></oj-bind-text></span>
            </div>
          </oj-bind-if>

          <oj-bind-for-each data="[[ $variables.gridRows ]]">
            <template data-oj-as="line">
              <div class="rw-ts-row" role="row">

                <span class="rw-ts-proj" role="cell" :title="[[ line.data.projectName ]]">
                  <oj-bind-text value="[[ line.data.projectName ]]"></oj-bind-text>
                </span>

                <span class="rw-ts-task" role="cell">
                  <!-- H8. The task is a BUTTON when the line may be moved, and
                       plain text otherwise. A real <button>, not a styled span:
                       a keypress handler on a div fires for every character
                       key, which is the bug the nav items already carry a note
                       about. Buttons get Enter and Space handling for free.

                       Leave is excluded because it is system-owned (RULE-008).
                       The database refuses it too -- this only decides whether
                       the affordance is offered. -->
                  <oj-bind-if test="[[ $variables.editable && line.data.isLeave !== 'Y' ]]">
                    <oj-button chroming="borderless"
                               class="rw-ts-task-btn"
                               :aria-label="[[ $page.functions.changeTaskLabel(line.data.taskName) ]]"
                               on-oj-action="[[ $listeners.openChangeTask ]]">
                      <span><oj-bind-text value="[[ line.data.taskName ]]"></oj-bind-text></span>
                    </oj-button>
                  </oj-bind-if>
                  <oj-bind-if test="[[ !$variables.editable || line.data.isLeave === 'Y' ]]">
                    <oj-bind-text value="[[ line.data.taskName ]]"></oj-bind-text>
                  </oj-bind-if>
                  <!-- The unbilled reason IS the task for the common non-billable
                       tasks (RULE-002), so it is only worth showing separately
                       when it says something different. -->
                  <oj-bind-if test="[[ line.data.unbilledReason
                                    && line.data.unbilledReason !== line.data.taskName ]]">
                    <span class="rw-flag rw-flag-advance">
                      <oj-bind-text value="[[ line.data.unbilledReason ]]"></oj-bind-text>
                    </span>
                  </oj-bind-if>
                  <!-- The "From HR" chip was removed on 12-Aug-2026 by request.
                       Where the hours came from is recorded in the database,
                       on OC_TS_ENTRY.SOURCE = 'Absence' (time/25), rather than
                       announced in the grid. The row is still read-only and
                       still labelled Leave, so nothing about how it behaves
                       changed -- only the badge is gone. -->
                </span>

                <!-- ACT-005 / RULE-005: quarter-hour blocks. A text box with its
                     own up/down arrows, exactly as the prototype does it.
                     oj-input-number renders an input plus two spinner buttons
                     that do not fit a day column — the number was pushed out of
                     sight and the cell looked empty while holding 8. -->
                <oj-bind-for-each data="[[ line.data.cells ]]">
                  <template data-oj-as="cell">
                    <span class="rw-grid-day" role="cell">
                      <span class="rw-hr">
                        <!-- Tab moves box to box across the week. The arrows are
                             deliberately OUT of the tab order (tabindex="-1"):
                             with them in it, filling seven days took 21 tab
                             presses instead of 7. Keyboard users lose nothing —
                             Up/Down arrow keys in the box step by the same
                             quarter hour, which is the usual convention for a
                             numeric field and needs no reaching for a button.

                             Plain <button>, as in the prototype's .hr-arr: an
                             oj-button's inner element may keep its own tab stop
                             regardless of tabindex here, and this pattern is
                             already proven in the shell's hamburger. -->
                        <!-- Read-only is per CELL, not per week (09-Aug-2026).
                             The leave line is never typed into (RULE-008), and a
                             day that is entirely leave takes no hours at all —
                             otherwise the grid shows 8h of work beside 8h of
                             leave and totals 16 against a standard of 8. -->
                        <oj-input-text class="rw-hr-box"
                          :aria-label="[[ $page.functions.hoursLabel(cell.data.entryDate) ]]"
                          :title="[[ $page.functions.cellTitle($variables.editable,
                                       $variables.gridRows, $variables.dayHeaders,
                                       line.data, cell.data.dayIndex) ]]"
                          value="[[ $page.functions.hoursAt(line.data, cell.data.dayIndex) ]]"
                          readonly="[[ $page.functions.cellReadonly($variables.editable,
                                         $variables.gridRows, $variables.dayHeaders,
                                         line.data, cell.data.dayIndex) ]]"
                          on-value-changed="[[ $listeners.cellChanged ]]"
                          on-keydown="[[ $listeners.cellKey ]]">
                        </oj-input-text>
                        <oj-bind-if test="[[ !$page.functions.cellReadonly($variables.editable,
                                               $variables.gridRows, $variables.dayHeaders,
                                               line.data, cell.data.dayIndex) ]]">
                          <span class="rw-hr-arr">
                            <button type="button" tabindex="-1" class="rw-hr-step"
                                    title="+15 min" aria-hidden="true"
                                    on-click="[[ $listeners.stepUp ]]">&#9650;</button>
                            <button type="button" tabindex="-1" class="rw-hr-step"
                                    title="-15 min" aria-hidden="true"
                                    on-click="[[ $listeners.stepDown ]]">&#9660;</button>
                          </span>
                        </oj-bind-if>
                      </span>
                    </span>
                  </template>
                </oj-bind-for-each>

                <span class="rw-ts-tot rw-ts-strong" role="cell">
                  <oj-bind-text value="[[ $application.functions.fmtHours($page.functions.lineTotal(line.data)) ]]"></oj-bind-text>
                </span>

                <span class="rw-ts-act" role="cell">
                  <!-- ACT-004. An HR-sourced leave line is not the employee's to
                       remove — it came from Absence (RULE-008). -->
                  <oj-bind-if test="[[ $variables.editable && line.data.isLeave !== 'Y' ]]">
                    <oj-button chroming="borderless" display="icons"
                               :aria-label="[[ $page.functions.removeLineLabel(line.data.taskName) ]]"
                               on-oj-action="[[ $listeners.removeLine ]]">
                      <span slot="startIcon" class="oj-ux-ico-trash"></span>
                      <span><oj-bind-text value="[[$application.translations.appBundle.common_remove]]"></oj-bind-text></span>
                    </oj-button>
                  </oj-bind-if>
                </span>

              </div>
            </template>
          </oj-bind-for-each>

          <!-- Entered per day. RULE-003 is a cross-line rule, so a breach is
               reported on the column total: no single cell is at fault. -->
          <div class="rw-ts-row rw-ts-sys rw-grid-total" role="row">
            <span class="rw-ts-proj rw-ts-syslabel" role="rowheader"><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_entered]]"></oj-bind-text></span>
            <span class="rw-ts-task"></span>
            <oj-bind-for-each data="[[ $variables.dayHeaders ]]">
              <template data-oj-as="day">
                <span role="cell" :class="[[ $page.functions.dayTotalClass(day.data) ]]">
                  <oj-bind-text value="[[ $application.functions.fmtHours(day.data.dayTotal) ]]"></oj-bind-text>
                </span>
              </template>
            </oj-bind-for-each>
            <span class="rw-ts-tot rw-ts-strong" role="cell">
              <oj-bind-text value="[[ $application.functions.fmtHours($variables.totalHours) ]]"></oj-bind-text>
            </span>
            <span class="rw-ts-act" role="cell"></span>
          </div>

          <!-- Standard / day (FLD-011) -->
          <div class="rw-ts-row rw-ts-sys" role="row">
            <span class="rw-ts-proj rw-ts-syslabel" role="rowheader"><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_standard_day]]"></oj-bind-text></span>
            <span class="rw-ts-task"></span>
            <oj-bind-for-each data="[[ $variables.dayHeaders ]]">
              <template data-oj-as="day">
                <span class="rw-grid-day" role="cell">
                  <oj-bind-text value="[[ $application.functions.fmtHours(day.data.standardHours) ]]"></oj-bind-text>
                </span>
              </template>
            </oj-bind-for-each>
            <span class="rw-ts-tot" role="cell">
              <oj-bind-text value="[[ $application.functions.fmtHours($variables.standardHours) ]]"></oj-bind-text>
            </span>
            <span class="rw-ts-act" role="cell"></span>
          </div>

        </div>
      </div>
    </div>

    <!-- ══════════════════ Actions ══════════════════ -->
    <!-- Submitted: the grid is frozen and Save/Submit are gone, but the week is
         not yet anyone else's decision, so the employee can still pull it back
         and correct it. Once a manager has approved, only they can send it
         back — the server enforces that, this just stops offering it. -->
    <oj-bind-if test="[[ $variables.weekStatus === 'Submitted' && $variables.decidedDays === 0 ]]">
      <div class="oj-flex oj-sm-align-items-center oj-sm-gap-3x oj-sm-justify-content-flex-end">
        <span class="oj-flex-item oj-typography-body-sm rw-metric-label" role="status">
          <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_submitted_and_waiting_for_your_manager_withd]]"></oj-bind-text>
        </span>
        <oj-button chroming="outlined" disabled="[[ $variables.busy ]]"
                   on-oj-action="[[ $listeners.revokeWeek ]]">
          <span slot="startIcon" class="oj-ux-ico-undo"></span>
          <span><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_withdraw_submission]]"></oj-bind-text></span>
        </oj-button>
      </div>
    </oj-bind-if>

    <oj-bind-if test="[[ $variables.editable ]]">
      <div class="oj-flex oj-sm-align-items-center oj-sm-gap-3x oj-sm-justify-content-flex-end">
        <oj-bind-if test="[[ $variables.hasUnsaved ]]">
          <span class="oj-flex-item oj-typography-body-sm rw-metric-label" role="status"><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_unsaved_changes]]"></oj-bind-text></span>
        </oj-bind-if>
        <oj-button chroming="outlined" disabled="[[ $variables.busy ]]"
                   on-oj-action="[[ $listeners.saveDraft ]]">
          <span slot="startIcon" :class="[[ $application.functions.busyIcon($variables.busy, 'oj-ux-ico-save') ]]"></span>
          <span><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_save_draft]]"></oj-bind-text></span>
        </oj-button>
        <oj-button chroming="callToAction" disabled="[[ $variables.busy ]]"
                   on-oj-action="[[ $listeners.submitWeek ]]">
          <span>
            <oj-bind-text value="[[ $application.functions.ifEq($variables.weekStatus, 'Rejected', 'Correct & resubmit', 'Submit for approval') ]]"></oj-bind-text>
          </span>
        </oj-button>
      </div>
    </oj-bind-if>

    <!-- ══════════════════ Approval workflow (prototype foot of page) ══════════════════ -->
    <!-- The prototype closes My Timesheet with the week's decision trail, and
         the employee had nothing: the banner said a manager sent the week back
         but never which manager, and no record at all that they had already
         corrected and resubmitted once. Same view as the manager's change
         history - two accounts of the same week that can disagree is worse
         than one. -->
    <oj-bind-if test="[[ $variables.weekId ]]">
      <!-- COLLAPSED BY DEFAULT 19-Aug, same reason as the manager's change
           history. A week that has been through the cut-off job carries a line
           per day per pass, so this reached forty-odd rows on an ordinary week
           and buried the grid the employee actually came to fill in. -->
      <div class="oj-sm-padding-4x rw-metric">
        <div class="oj-flex oj-sm-align-items-center oj-sm-justify-content-space-between oj-sm-flex-wrap oj-sm-gap-2x">
          <div>
            <h2 class="oj-typography-heading-xs oj-sm-margin-0">
              <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_approval_workflow]]"></oj-bind-text>
            </h2>
            <p class="oj-typography-body-sm rw-metric-label oj-sm-margin-1x-top oj-sm-margin-0-bottom">
              <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_approval_workflow_sub]]"></oj-bind-text>
            </p>
          </div>
          <oj-button chroming="outlined" on-oj-action="[[ $listeners.toggleActivity ]]">
            <span slot="startIcon" :class="[[ $variables.showActivity ? 'oj-ux-ico-chevron-up' : 'oj-ux-ico-chevron-down' ]]"></span>
            <span><oj-bind-text value="[[ $page.functions.activityToggleLabel($variables.showActivity, $variables.activityRows) ]]"></oj-bind-text></span>
          </oj-button>
        </div>

        <oj-bind-if test="[[ $variables.showActivity && $variables.activityRows.length === 0 ]]">
          <div class="oj-typography-body-sm rw-metric-label oj-sm-margin-2x-top" role="status">
            <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_no_activity_yet]]"></oj-bind-text>
          </div>
        </oj-bind-if>

        <oj-bind-if test="[[ $variables.showActivity && $variables.activityRows.length > 0 ]]">
          <div class="rw-wf oj-sm-margin-2x-top">
            <oj-bind-for-each data="[[ $variables.activityRows ]]">
              <template>
                <div class="rw-wf-row">
                  <span :class="[[ $page.functions.wfDotClass($current.data) ]]" aria-hidden="true"></span>
                  <span class="rw-wf-what">
                    <strong><oj-bind-text value="[[ $page.functions.wfTitle($current.data) ]]"></oj-bind-text></strong>
                    <oj-bind-if test="[[ $current.data.change_reason ]]">
                      <span> &#8212; <oj-bind-text value="[[ $current.data.change_reason ]]"></oj-bind-text></span>
                    </oj-bind-if>
                  </span>
                  <span class="rw-wf-when">
                    <oj-bind-text value="[[ $page.functions.wfWhen($current.data) ]]"></oj-bind-text>
                  </span>
                </div>
              </template>
            </oj-bind-for-each>
          </div>
        </oj-bind-if>
      </div>
    </oj-bind-if>

    <!-- ══════════════════ Retro adjustment card ══════════════════ -->
    <!-- FLD-016..FLD-018 / ACT-009. Offered only on a CLOSED month that is still
         inside the backdating window (RULE-019). The old line is reversed (-)
         and the new line added (+), per day, and the whole change goes to the
         manager for approval before it reaches accrual. -->
    <oj-bind-if test="[[ $variables.adjustmentAllowed ]]">
      <div class="oj-sm-padding-4x rw-metric">
        <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-start oj-sm-gap-4x">
          <div class="oj-flex-item">
            <h2 class="oj-typography-heading-xs oj-sm-margin-0"><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_backdated_project_wbs_change]]"></oj-bind-text></h2>
            <p class="oj-typography-body-sm rw-metric-label oj-sm-margin-1x-top">
              <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_this_month_is_closed_a_correction_is_posted_]]"></oj-bind-text>
            </p>
          </div>
          <oj-button chroming="outlined" on-oj-action="[[ $listeners.openAdjustment ]]">
            <span><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_enter_new_reverse_old]]"></oj-bind-text></span>
          </oj-button>
        </div>

        <oj-bind-if test="[[ $variables.myAdjustments.length > 0 ]]">
          <div class="rw-grid-scroll oj-sm-margin-3x-top">
            <oj-table aria-label="My backdated adjustments"
                      data="[[ $variables.myAdjustmentsADP ]]"
                      layout="fixed"
                      horizontal-grid-visible="enabled"
                      selection-mode='{"row": "none", "column": "none"}'
                      columns='[
                        {"headerText":"Date","field":"workDate","template":"dateCell","width":120},
                        {"headerText":"Reversal — old project / task","field":"oldProjectName","template":"oldCell","weight":3},
                        {"headerText":"Adjustment — new project / task","field":"newProjectName","template":"newCell","weight":3},
                        {"headerText":"Net hrs","field":"netHours","template":"netCell","width":115},
                        {"headerText":"Status","field":"status","template":"statusCell","width":150}
                      ]'>
              <template slot="dateCell" data-oj-as="cell">
                <span><oj-bind-text value="[[ $application.functions.fmtDate(cell.row.workDate) ]]"></oj-bind-text></span>
              </template>
              <template slot="oldCell" data-oj-as="cell">
                <span>
                  <oj-bind-text value="[[ cell.row.oldProjectName ]]"></oj-bind-text> /
                  <oj-bind-text value="[[ cell.row.oldTaskCode ]]"></oj-bind-text>
                  <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_text]]"></oj-bind-text><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.oldHours) ]]"></oj-bind-text>)
                </span>
              </template>
              <template slot="newCell" data-oj-as="cell">
                <span>
                  <oj-bind-if test="[[ cell.row.newProjectName ]]">
                    <oj-bind-text value="[[ cell.row.newProjectName ]]"></oj-bind-text> /
                    <oj-bind-text value="[[ cell.row.newTaskCode ]]"></oj-bind-text>
                    (+<oj-bind-text value="[[ $application.functions.fmtHours(cell.row.newHours) ]]"></oj-bind-text>)
                  </oj-bind-if>
                  <oj-bind-if test="[[ !cell.row.newProjectName ]]">
                    <span class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.common_reversal_only]]"></oj-bind-text></span>
                  </oj-bind-if>
                </span>
              </template>
              <template slot="netCell" data-oj-as="cell">
                <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.netHours) ]]"></oj-bind-text></span>
              </template>
              <template slot="statusCell" data-oj-as="cell">
                <span :class="[[ $application.functions.outcomeClass(cell.row.status) ]]">
                  <oj-bind-text value="[[ cell.row.status ]]"></oj-bind-text>
                </span>
              </template>
            </oj-table>
          </div>
        </oj-bind-if>
      </div>
    </oj-bind-if>

    <!-- Busy indicator -->
    <oj-bind-if test="[[ $variables.busy ]]">
      <div class="oj-flex oj-sm-align-items-center oj-sm-gap-2x" role="status" aria-live="polite">
        <oj-progress-circle size="sm" value="-1"></oj-progress-circle>
        <span class="oj-typography-body-sm"><oj-bind-text value="[[$application.translations.appBundle.common_working]]"></oj-bind-text></span>
      </div>
    </oj-bind-if>

  </div>

  <!-- ══════════════════ Allocation dialog (ACT-008) ══════════════════ -->
  <!-- rw-dlg-wide because an oj-dialog sizes to its content and this one holds a
       six-column table under layout="fixed". Left to itself it opened at about
       half the needed width, clipped Billable status and Role, and pushed the
       whole grid onto a horizontal scrollbar inside a box small enough that the
       scrollbar was the first thing you saw. -->
  <oj-dialog id="allocDlg" class="rw-dlg-wide"
             dialog-title="[[$application.translations.appBundle.my_timesheet_my_allocation]]"
             cancel-behavior="icon">
    <div slot="body">
      <oj-bind-if test="[[ $variables.allocationWarning ]]">
        <div class="oj-sm-padding-3x oj-sm-margin-3x-bottom rw-notice rw-notice-warning" role="status">
          <oj-bind-text value="[[ $variables.allocationWarning ]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <oj-table aria-label="My project allocation"
                data="[[ $variables.allocationADP ]]"
                layout="fixed"
                horizontal-grid-visible="enabled"
                selection-mode='{"row": "none", "column": "none"}'
                columns='[
                  {"headerText":"Project","field":"projectName","weight":3},
                  {"headerText":"Client","field":"customerName","weight":2},
                  {"headerText":"Allocation %","field":"allocPct","width":160},
                  {"headerText":"Billable status","field":"billingStatus","width":190},
                  {"headerText":"Role","field":"clientRole","weight":2},
                  {"headerText":"Approving manager","field":"approvingManagerName","weight":2}
                ]'>
      </oj-table>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.closeAllocation ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_close]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

  <!-- ══════════════════ Add line dialog ══════════════════ -->
  <!-- ACT-003 add line, and ACT-007 set its project and task. The pair is set
       here rather than edited in the grid: RULE-010 constrains the task to the
       project's WBS or a common non-billable task, so the two have to be chosen
       together to be validated together. The grid then shows them read-only. -->
  <oj-dialog id="addLineDlg" dialog-title="[[$application.translations.appBundle.my_timesheet_add_a_line]]"
             cancel-behavior="icon">
    <div slot="body">
      <oj-form-layout label-edge="top" max-columns="1">
        <oj-select-single label-hint="[[$application.translations.appBundle.common_project]]" required="true"
                          data="[[ $variables.projectOptions ]]"
                          value="{{ $variables.newLineProjectId }}"
                          item-text="label"
                          on-value-changed="[[ $listeners.newLineProjectChanged ]]">
        </oj-select-single>

        <!-- RULE-010: the LOV is this project's WBS plus the common
             non-billable tasks. Leave is not offered (RULE-008). -->
        <oj-select-single label-hint="[[$application.translations.appBundle.my_timesheet_task_wbs]]" required="true"
                          data="[[ $variables.taskOptions ]]"
                          value="{{ $variables.newLineTaskId }}"
                          item-text="label"
                          disabled="[[ !$variables.newLineProjectId ]]">
        </oj-select-single>
      </oj-form-layout>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.closeAddLine ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction" on-oj-action="[[ $listeners.addLine ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_add]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

  <!-- ══════════════════ Adjustment dialog (ACT-009) ══════════════════ -->
  <oj-dialog id="adjDlg" dialog-title="[[$application.translations.appBundle.my_timesheet_backdated_project_wbs_change]]"
             cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-sm rw-metric-label">
        <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_adjustments_are_day_wise_enter_the_day_the_h]]"></oj-bind-text>
      </p>

      <oj-form-layout label-edge="top" max-columns="2">
        <oj-input-date label-hint="[[$application.translations.appBundle.my_timesheet_adjustment_date]]" required="true"
                       value="{{ $variables.adjWorkDate }}">
        </oj-input-date>

        <oj-input-number label-hint="[[$application.translations.appBundle.my_timesheet_hours_to_reverse]]" required="true"
                         value="{{ $variables.adjOldHours }}"
                         min="0" max="24" step="0.25">
        </oj-input-number>

        <oj-select-single label-hint="[[$application.translations.appBundle.my_timesheet_old_project]]" required="true"
                          data="[[ $variables.projectOptions ]]"
                          value="{{ $variables.adjOldProjectId }}"
                          item-text="label">
        </oj-select-single>

        <oj-select-single label-hint="[[$application.translations.appBundle.my_timesheet_old_task]]" required="true"
                          data="[[ $variables.taskOptions ]]"
                          value="{{ $variables.adjOldTaskId }}"
                          item-text="label">
        </oj-select-single>

        <oj-select-single label-hint="[[$application.translations.appBundle.my_timesheet_new_project]]"
                          data="[[ $variables.projectOptions ]]"
                          value="{{ $variables.adjNewProjectId }}"
                          item-text="label"
                          on-value-changed="[[ $listeners.adjProjectChanged ]]">
        </oj-select-single>

        <oj-select-single label-hint="[[$application.translations.appBundle.my_timesheet_new_task]]"
                          data="[[ $variables.adjTaskOptions ]]"
                          value="{{ $variables.adjNewTaskId }}"
                          item-text="label"
                          disabled="[[ !$variables.adjNewProjectId ]]">
        </oj-select-single>

        <oj-input-number label-hint="[[$application.translations.appBundle.my_timesheet_hours_to_add]]"
                         value="{{ $variables.adjNewHours }}"
                         min="0" max="24" step="0.25">
        </oj-input-number>
      </oj-form-layout>

      <oj-text-area label-hint="[[$application.translations.appBundle.my_timesheet_reason]]" rows="2"
                    value="{{ $variables.adjReason }}">
      </oj-text-area>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.closeAdjustment ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction" disabled="[[ $variables.busy ]]"
                 on-oj-action="[[ $listeners.applyAdjustment ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_apply_send_for_approval]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

  <!-- ══════════════════ Change task (H8) ══════════════════
       A dialog rather than an inline dropdown: oj-select-single needs a
       DataProvider and the options differ per row, which cannot be built
       inside an oj-bind-for-each. Same pattern and the same click count as
       Add a line.

       The endpoint REFUSES if the chosen task already has a line — it never
       merges two lines' hours silently. That refusal is shown verbatim. -->
  <oj-dialog id="changeTaskDlg"
             dialog-title="[[$application.translations.appBundle.my_timesheet_change_the_task]]"
             cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-sm rw-metric-label">
        <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_change_task_hint]]"></oj-bind-text>
      </p>

      <oj-form-layout label-edge="top">
        <oj-input-text label-hint="[[$application.translations.appBundle.my_timesheet_project]]"
                       readonly="true" value="[[ $variables.chgProjectName ]]">
        </oj-input-text>
        <oj-input-text label-hint="[[$application.translations.appBundle.my_timesheet_current_task]]"
                       readonly="true" value="[[ $variables.chgOldTaskName ]]">
        </oj-input-text>
        <oj-select-single label-hint="[[$application.translations.appBundle.my_timesheet_move_to]]"
                          required="true"
                          data="[[ $variables.chgTaskOptions ]]"
                          item-text="label"
                          value="{{ $variables.chgNewTaskId }}">
        </oj-select-single>
      </oj-form-layout>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.cancelChangeTask ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction"
                 disabled="[[ $variables.busy || !$variables.chgNewTaskId ]]"
                 on-oj-action="[[ $listeners.confirmChangeTask ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.my_timesheet_move_the_hours]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

</oj-sp-general-overview-page>
