<!-- O2C Timesheet Module — set or change a password -->

<div class="login-wrap">

  <div class="login-topbar">
    <div class="login-brand-texts">
      <span class="login-brand-title"><oj-bind-text value="[[$application.translations.appBundle.common_rite_digital]]"></oj-bind-text></span>
      <span class="login-brand-sub"><oj-bind-text value="[[$application.translations.appBundle.common_o2c_platform]]"></oj-bind-text></span>
    </div>
  </div>

  <div class="login-split">

    <div class="login-hero">
      <div class="login-hero-inner">
        <h1 class="login-hero-title"><oj-bind-text value="[[$application.translations.appBundle.common_set_your_password]]"></oj-bind-text></h1>
        <p class="login-hero-sub">
          <oj-bind-text value="[[$application.translations.appBundle.set_password_choose_a_password_only_you_know_setting_one_]]"></oj-bind-text>
        </p>
      </div>
    </div>

    <div class="login-form-panel">
      <div class="login-card">

        <div class="login-form-header">
          <div class="login-form-icon">
            <span class="oj-ux-ico-lock-closed" style="font-size:24px; color:#1565C0;"></span>
          </div>
          <div>
            <div class="login-logo"><oj-bind-text value="[[$application.translations.appBundle.common_password]]"></oj-bind-text></div>
            <div class="login-sub"><oj-bind-text value="[[$application.translations.appBundle.set_password_set_it_for_the_first_time_or_change_it]]"></oj-bind-text></div>
          </div>
        </div>

        <oj-bind-if test="[[ $variables.errorMessage ]]">
          <div class="login-error" role="alert">
            <oj-bind-text value="[[ $variables.errorMessage ]]"></oj-bind-text>
          </div>
        </oj-bind-if>

        <oj-bind-if test="[[ $variables.successMessage ]]">
          <div class="login-ok" role="status">
            <oj-bind-text value="[[ $variables.successMessage ]]"></oj-bind-text>
          </div>
        </oj-bind-if>

        <div class="login-hint">
          <oj-bind-text value="[[$application.translations.appBundle.set_password_at_least_8_characters_leave]]"></oj-bind-text> <strong><oj-bind-text value="[[$application.translations.appBundle.set_password_current_password]]"></oj-bind-text></strong> <oj-bind-text value="[[$application.translations.appBundle.set_password_empty_if_you_were_invited_and_have_never_set]]"></oj-bind-text>
        </div>

        <!-- Not a <form on-submit>: that binding never fired and the button did
             nothing. on-click on a plain button is the proven one. See the same
             note on the login page. -->
        <div>

          <div class="login-field">
            <oj-input-text id="spEmail"
              value="{{ $variables.email }}"
              label-hint="[[$application.translations.appBundle.common_email_address]]"
              label-edge="inside"
              required="true"
              autocomplete="username">
            </oj-input-text>
          </div>

          <div class="login-field">
            <oj-input-password id="spCurrent"
              value="{{ $variables.currentPassword }}"
              label-hint="[[$application.translations.appBundle.set_password_current_password_leave_empty_if_invited]]"
              label-edge="inside"
              autocomplete="current-password">
            </oj-input-password>
          </div>

          <div class="login-field">
            <oj-input-password id="spNew"
              value="{{ $variables.newPassword }}"
              label-hint="[[$application.translations.appBundle.set_password_new_password]]"
              label-edge="inside"
              required="true"
              autocomplete="new-password">
            </oj-input-password>
          </div>

          <div class="login-field">
            <!-- Enter on the confirmation field saves, since it is the last
                 thing typed. The chain ignores every other key. -->
            <oj-input-password id="spConfirm"
              value="{{ $variables.confirmPassword }}"
              label-hint="[[$application.translations.appBundle.set_password_confirm_new_password]]"
              label-edge="inside"
              required="true"
              autocomplete="new-password"
              on-keyup="[[$listeners.doSetPassword]]">
            </oj-input-password>
          </div>

          <!-- oj-bind-text wrapped in a span: unwrapped inside a button it
               renders nothing and the button comes out blank. -->
          <button type="button" class="btn-login"
                  :disabled="[[ $variables.isSaving ]]"
                  on-click="[[$listeners.doSetPassword]]">
            <span>
              <oj-bind-text value="[[ $page.functions.saveLabel($variables.isSaving) ]]"></oj-bind-text>
            </span>
          </button>
        </div>

        <div class="login-alt">
          <button type="button" class="login-alt-link"
                  on-click="[[$listeners.goToLogin]]"><oj-bind-text value="[[$application.translations.appBundle.set_password_back_to_sign_in]]"></oj-bind-text></button>
        </div>

      </div>
    </div>

  </div>
</div>
