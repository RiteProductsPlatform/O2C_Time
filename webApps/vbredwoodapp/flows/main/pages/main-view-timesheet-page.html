<!-- PAGE-004 View Timesheet — monthly summary (PER-003)

     Two things this page must get right:

     1. The month is NOT editable here. Hours are shown at WBS level rolled up to
        the month; corrections happen in the weekly/daily detail (PAGE-005).

     2. Confirm Month is ONE action for ALL employees (ACT-020 / RA-015). There
        is deliberately no per-employee "send to accrual" — and the button stays
        disabled until every employee is Approved (RULE-020 / SC-19). The reason
        it is disabled is stated on screen rather than only in a toast after a
        failed click. -->

<oj-sp-general-overview-page
  id="viewTimesheetPage"
  class="oj-sm-width-full rw-page-full"
  display-options.responsive-padding="off"
  page-title="[[$application.translations.appBundle.view_timesheet_monthly_summary]]"
  page-subtitle="[[$application.translations.appBundle.view_timesheet_hours_are_shown_at_task_wbs_level_open_an_em]]">

  <div class="oj-flex oj-sm-flex-direction-column oj-sm-width-full oj-sm-gap-4x"
       slot="main">

    <!-- ══════════════════ Context + month state ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-start oj-sm-flex-wrap oj-sm-gap-3x">
        <div class="oj-flex-item">
          <oj-button chroming="borderless" on-oj-action="[[ $listeners.goBack ]]">
            <span slot="startIcon" class="oj-ux-ico-arrow-left"></span>
            <span><oj-bind-text value="[[$application.translations.appBundle.common_team_approvals]]"></oj-bind-text></span>
          </oj-button>
          <h2 class="oj-typography-heading-sm oj-sm-margin-0 oj-sm-margin-1x-top">
            <oj-bind-text value="[[ $application.variables.selectedProjectName ]]"></oj-bind-text>
          </h2>
          <p class="oj-typography-body-sm rw-metric-label">
            <oj-bind-text value="[[ $application.variables.selectedPeriodName ]]"></oj-bind-text>
          </p>
        </div>
        <oj-button chroming="borderless" on-oj-action="[[ $listeners.reload ]]">
          <span slot="startIcon" class="oj-ux-ico-refresh"></span>
          <span><oj-bind-text value="[[$application.translations.appBundle.common_refresh]]"></oj-bind-text></span>
        </oj-button>
      </div>

      <div class="oj-flex oj-sm-flex-wrap oj-sm-gap-6x oj-sm-margin-4x-top">
        <div class="oj-flex-item">
          <div class="rw-metric-value"><oj-bind-text value="[[ $variables.totalEmployees ]]"></oj-bind-text></div>
          <div class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_team]]"></oj-bind-text></div>
        </div>
        <div class="oj-flex-item">
          <div class="rw-metric-value"><oj-bind-text value="[[ $variables.approvedEmployees ]]"></oj-bind-text></div>
          <div class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.common_approved]]"></oj-bind-text></div>
        </div>
        <div class="oj-flex-item">
          <div class="rw-metric-value"><oj-bind-text value="[[ $variables.pendingEmployees ]]"></oj-bind-text></div>
          <div class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_pending]]"></oj-bind-text></div>
        </div>
        <div class="oj-flex-item">
          <div class="rw-metric-value"><oj-bind-text value="[[ $variables.rejectedEmployees ]]"></oj-bind-text></div>
          <div class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_rejected]]"></oj-bind-text></div>
        </div>
      </div>
    </div>

    <!-- ══════════════════ Confirmation state ══════════════════ -->
    <!-- Confirmed AND handed over. -->
    <oj-bind-if test="[[ $variables.alreadyConfirmed && $page.functions.accrualHandedOff($variables.accrualStatus, $variables.accrualRows) ]]">
      <div class="oj-sm-padding-3x rw-notice" role="status">
        <div class="oj-typography-body-md oj-typography-semi-bold"><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_this_month_has_been_confirmed]]"></oj-bind-text></div>
        <div class="oj-typography-body-sm oj-sm-margin-1x-top">
          <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_confirmed_on]]"></oj-bind-text> <oj-bind-text value="[[ $variables.confirmedOn ]]"></oj-bind-text>.
          <oj-bind-text value="[[ $variables.accrualRows ]]"></oj-bind-text>
          <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_interface_rows_were_written_for_the_accrual_]]"></oj-bind-text> <oj-bind-text value="[[ $variables.accrualStatus ]]"></oj-bind-text>).
        </div>
      </div>
    </oj-bind-if>

    <!-- Confirmed and NOTHING WAS SENT. Deliberately not the same notice: a
         month that confirmed but handed over an empty batch looks to accrual
         exactly like a month nobody worked, so it must not read as done. -->
    <oj-bind-if test="[[ $variables.alreadyConfirmed && !$page.functions.accrualHandedOff($variables.accrualStatus, $variables.accrualRows) ]]">
      <div class="oj-sm-padding-3x rw-notice rw-notice-warning" role="alert">
        <div class="oj-typography-body-md oj-typography-semi-bold"><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_confirmed_but_nothing_sent]]"></oj-bind-text></div>
        <div class="oj-typography-body-sm oj-sm-margin-1x-top">
          <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_confirmed_on]]"></oj-bind-text> <oj-bind-text value="[[ $variables.confirmedOn ]]"></oj-bind-text>.
          <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_nothing_sent_detail]]"></oj-bind-text>
          (<oj-bind-text value="[[ $variables.accrualRows ]]"></oj-bind-text>
          <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_rows_status]]"></oj-bind-text> <oj-bind-text value="[[ $variables.accrualStatus ]]"></oj-bind-text>).
        </div>
      </div>
    </oj-bind-if>

    <!-- SC-19: say WHY confirm is blocked, before the manager clicks. -->
    <oj-bind-if test="[[ !$variables.alreadyConfirmed && !$variables.confirmAllowed
                      && $variables.totalEmployees > 0 ]]">
      <div class="oj-sm-padding-3x rw-notice rw-notice-warning" role="status">
        <div class="oj-typography-body-md oj-typography-semi-bold"><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_not_ready_to_confirm_to_accrual]]"></oj-bind-text></div>
        <div class="oj-typography-body-sm oj-sm-margin-1x-top">
          <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_every_employee_on_the_project_must_be_approv]]"></oj-bind-text>
          <oj-bind-text value="[[ $variables.pendingEmployees ]]"></oj-bind-text>
          <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_still_pending]]"></oj-bind-text><oj-bind-if test="[[ $variables.rejectedEmployees > 0 ]]">,
          <oj-bind-text value="[[ $variables.rejectedEmployees ]]"></oj-bind-text>
          <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_rejected_and_back_with_the_employee]]"></oj-bind-text></oj-bind-if>.
        </div>
      </div>
    </oj-bind-if>

    <!-- ══════════════════ Employees ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-center oj-sm-flex-wrap oj-sm-gap-2x oj-sm-margin-3x-bottom">
        <h2 class="oj-typography-heading-xs oj-sm-margin-0"><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_employees]]"></oj-bind-text></h2>
        <div class="oj-flex oj-sm-align-items-center oj-sm-gap-2x oj-sm-flex-wrap">
          <span class="oj-typography-body-sm rw-metric-label">
            <oj-bind-text value="[[ $variables.selectedKeys.length ]]"></oj-bind-text> <oj-bind-text value="[[$application.translations.appBundle.common_selected]]"></oj-bind-text>
          </span>
          <!-- BRD: "approve all or some employees". The select-all is the tick in
               the table's first column header; skipping Approved rows means an
               approve-all never re-sends settled work. -->
          <oj-button chroming="outlined"
                     disabled="[[ $variables.busy || $variables.selectedKeys.length === 0 ]]"
                     on-oj-action="[[ $listeners.openReject ]]">
            <span><oj-bind-text value="[[$application.translations.appBundle.common_reject_selected]]"></oj-bind-text></span>
          </oj-button>
          <oj-button chroming="callToAction"
                     disabled="[[ $variables.busy || $variables.selectedKeys.length === 0 ]]"
                     on-oj-action="[[ $listeners.approveSelected ]]">
            <span><oj-bind-text value="[[$application.translations.appBundle.common_approve_selected]]"></oj-bind-text></span>
          </oj-button>
        </div>
      </div>

      <oj-bind-if test="[[ $variables.employees.length === 0 && !$variables.busy ]]">
        <div class="oj-typography-body-sm rw-metric-label" role="status">
          <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_no_employees_on_project_nobody_has_time_on_t]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <oj-bind-if test="[[ $variables.employees.length > 0 ]]">
        <!-- FLD-037 multi-select. An explicit checkbox column rather than
             oj-table's selection-mode: selected-row-keys expects a JET KeySet,
             whereas the bulk approve/reject endpoints take a plain array of
             employee ids. Keeping it an array end to end avoids converting on
             every action. -->
        <div class="rw-grid-scroll">
          <oj-table aria-label="Employees on this project"
                    data="[[ $variables.employeesADP ]]"
                    layout="fixed"
                    horizontal-grid-visible="enabled"
                    selection-mode='{"row": "none", "column": "none"}'
                    columns='[
                      {"headerText":"","field":"employeeId","template":"pickCell","headerTemplate":"pickHeader","width":44,"sortable":"disabled"},
                      {"headerText":"Emp ID","field":"employeeId","width":110},
                      {"headerText":"Name","field":"employeeName","template":"nameCell","weight":3,"minWidth":190},
                      {"headerText":"Role","field":"clientRole","weight":2,"minWidth":170},
                      {"headerText":"Billable status","field":"billingStatus","width":190},
                      {"headerText":"Billable","field":"billableHours","template":"billCell","width":125},
                      {"headerText":"Non-billable","field":"nonBillableHours","template":"nonBillCell","width":165},
                      {"headerText":"Leave","field":"leaveHours","template":"leaveCell","width":110},
                      {"headerText":"Total","field":"totalHours","template":"totalCell","width":110},
                      {"headerText":"Cap","field":"capDisplay","width":120},
                      {"headerText":"Weeks","field":"approvedWeeks","template":"weekCell","width":115},
                      {"headerText":"Month status","field":"monthStatus","template":"statusCell","width":175},
                      {"headerText":"","field":"employeeId","template":"actionCell","width":100,"sortable":"disabled"}
                    ]'>

            <!-- Select-all lives HERE now, not in the page header (22-Aug).
                 Ticking selects every row that is not already Approved;
                 unticking clears the selection. -->
            <template slot="pickHeader">
              <oj-checkboxset class="vtim-row-pick"
                              aria-label="Select all pending employees"
                              value="[[ $page.functions.allPickValue($variables.selectedKeys, $variables.employees) ]]"
                              on-value-changed="[[ $listeners.toggleAllPick ]]">
                <oj-option value="on"></oj-option>
              </oj-checkboxset>
            </template>

            <template slot="pickCell" data-oj-as="cell">
              <!-- oj-checkboxset, not a raw HTML checkbox: Redwood standards forbid raw
                   HTML form controls. One unlabelled option acts as the row tick. -->
              <oj-checkboxset class="vtim-row-pick"
                              :aria-label="[[ $page.functions.pickLabel(cell.row.employeeName) ]]"
                              value="[[ $page.functions.pickValue($variables.selectedKeys, cell.row.employeeId) ]]"
                              on-value-changed="[[ $listeners.togglePick ]]">
                <oj-option value="on"></oj-option>
              </oj-checkboxset>
            </template>

            <template slot="nameCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ cell.row.employeeName ]]"></oj-bind-text>
                <oj-bind-if test="[[ cell.row.workerType === 'Contractor' ]]">
                  <span class="rw-flag rw-flag-advance"><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_contractor]]"></oj-bind-text></span>
                </oj-bind-if>
                <!-- NO Overridden CHIP HERE (22-Aug). It says a manager corrected
                     a particular day, which is a useful thing to know on the day
                     grid and noise on a month row: it does not change whether
                     this person needs approving, which is the only question
                     this list answers. It stays on the DAY, where the correction
                     was made, and on the WEEK as "Overridden and approved",
                     which ACT-016 and SC-10 require.

                     Late and Defaulted below are different -- both are about
                     whether the month is in order, which is exactly what a
                     month row is for. -->
                <oj-bind-if test="[[ cell.row.lateSubmissionFlag === 'Y' ]]">
                  <span class="rw-flag rw-flag-late" title="Submitted after the weekly cut-off. The status is still Submitted; this records the SLA miss."><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_late]]"></oj-bind-text></span>
                </oj-bind-if>
                <oj-bind-if test="[[ cell.row.defaultedFlag === 'Y' ]]">
                  <span class="rw-flag rw-flag-defaulted" title="A cut-off was missed on at least one week this month."><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_defaulted]]"></oj-bind-text></span>
                </oj-bind-if>
                <oj-bind-if test="[[ cell.row.advanceClosureFlag === 'Y' ]]">
                  <span class="rw-flag rw-flag-advance" title="Approved at month level before the work happened (PROC-010)."><oj-bind-text value="[[$application.translations.appBundle.common_advance_closure]]"></oj-bind-text></span>
                </oj-bind-if>
              </span>
            </template>

            <template slot="billCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.billableHours) ]]"></oj-bind-text></span>
            </template>
            <template slot="nonBillCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.nonBillableHours) ]]"></oj-bind-text></span>
            </template>
            <template slot="leaveCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.leaveHours) ]]"></oj-bind-text></span>
            </template>
            <template slot="totalCell" data-oj-as="cell">
              <span class="oj-typography-semi-bold"><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.totalHours) ]]"></oj-bind-text></span>
            </template>

            <template slot="weekCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ cell.row.approvedWeeks ]]"></oj-bind-text> /
                <oj-bind-text value="[[ cell.row.weekCount ]]"></oj-bind-text>
                <!-- The weeks waiting on this manager. Approved/total alone left
                     an employee who had just submitted looking identical to one
                     who had entered nothing, so a submission "did not reflect"
                     anywhere on the list the manager actually works from. -->
                <oj-bind-if test="[[ cell.row.submittedWeeks > 0 ]]">
                  <span class="rw-status rw-status-submitted rw-week-pending">
                    <oj-bind-text value="[[ cell.row.submittedWeeks ]]"></oj-bind-text>
                    <span> to review</span>
                  </span>
                </oj-bind-if>
              </span>
            </template>

            <template slot="statusCell" data-oj-as="cell">
              <span :class="[[ $application.functions.outcomeClass(cell.row.monthStatus) ]]">
                <oj-bind-text value="[[ cell.row.monthStatus ]]"></oj-bind-text>
              </span>
            </template>

            <template slot="actionCell" data-oj-as="cell">
              <oj-button chroming="outlined"
                         :aria-label="[[ $page.functions.openEmployeeLabel(cell.row.employeeName) ]]"
                         on-oj-action="[[ $listeners.openEmployee ]]">
                <span><oj-bind-text value="[[$application.translations.appBundle.common_open]]"></oj-bind-text></span>
              </oj-button>
            </template>
          </oj-table>
        </div>
      </oj-bind-if>
    </div>

    <!-- ══════════════════ Confirm month → accrual ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <h2 class="oj-typography-heading-xs oj-sm-margin-0"><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_monthly_accrual]]"></oj-bind-text></h2>
      <p class="oj-typography-body-sm rw-metric-label oj-sm-margin-1x-top">
        <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_confirms_the_whole_project_month_for]]"></oj-bind-text> <strong><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_all_employees_at_once]]"></oj-bind-text></strong>
        <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_and_fills_the_accrual_interface_with_the_con]]"></oj-bind-text>
      </p>
      <div class="oj-flex oj-sm-justify-content-flex-end oj-sm-margin-3x-top">
        <oj-button chroming="callToAction"
                   disabled="[[ $variables.busy || !$variables.confirmAllowed ]]"
                   on-oj-action="[[ $listeners.confirmMonth ]]">
          <span>
            <oj-bind-text value="[[ $application.functions.ifSet($variables.alreadyConfirmed, 'Month already confirmed', 'Confirm month for all employees') ]]"></oj-bind-text>
          </span>
        </oj-button>
      </div>
    </div>

    <oj-bind-if test="[[ $variables.busy ]]">
      <div class="oj-flex oj-sm-align-items-center oj-sm-gap-2x" role="status" aria-live="polite">
        <oj-progress-circle size="sm" value="-1"></oj-progress-circle>
        <span class="oj-typography-body-sm"><oj-bind-text value="[[$application.translations.appBundle.common_working]]"></oj-bind-text></span>
      </div>
    </oj-bind-if>

  </div>

  <!-- ══════════════════ Reject dialog (RULE-013) ══════════════════ -->
  <oj-dialog id="rejectDlg" dialog-title="[[$application.translations.appBundle.view_timesheet_reject_selected_employees]]"
             cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-sm rw-metric-label">
        <oj-bind-text value="[[$application.translations.appBundle.view_timesheet_the_reason_and_remarks_are_shown_to_the_empl]]"></oj-bind-text>
      </p>
      <oj-form-layout label-edge="top" max-columns="1">
        <oj-select-single label-hint="[[$application.translations.appBundle.common_rejection_reason]]" required="true"
                          data="[[ $application.variables.rejectReasonOptions ]]"
                          value="{{ $variables.rejectReason }}"
                          item-text="label"
                          placeholder="[[$application.translations.appBundle.common_select_a_reason]]">
        </oj-select-single>
        <oj-text-area label-hint="[[$application.translations.appBundle.common_remarks]]" rows="3"
                      value="{{ $variables.rejectRemarks }}"
                      placeholder="[[$application.translations.appBundle.common_what_needs_to_change]]">
        </oj-text-area>
      </oj-form-layout>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.closeReject ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction"
                 disabled="[[ $variables.busy || !$variables.rejectReason ]]"
                 on-oj-action="[[ $listeners.rejectSelected ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_reject]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

  <!-- ══════════════════ Confirmation ══════════════════ -->
  <!-- oj-dialog opened via Actions.callComponentMethod, not window.confirm:
       SES blocks browser globals inside chains (knowledge/14 §7). -->
  <oj-dialog id="confirmMonthDlg" dialog-title="[[$application.translations.appBundle.view_timesheet_confirm_month_to_accrual]]" cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-md">
        <oj-bind-text value="[[ $variables.confirmMessage ]]"></oj-bind-text>
      </p>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.cancelConfirmMonth ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction" disabled="[[ $variables.busy ]]"
                 on-oj-action="[[ $listeners.confirmConfirmMonth ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.view_timesheet_confirm_month]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

</oj-sp-general-overview-page>
