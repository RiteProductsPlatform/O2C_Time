<!-- PAGE-006 Leave Loss Coverage (PER-003)

     Entry condition (PROC-006): the project must be a Fixed Capacity Project
     with Leave Loss = Yes. On such a contract the client pays for capacity, so an
     absence only stops being a revenue loss if a colleague who is otherwise
     unbilled covers the day.

     The flow is Open -> Assigned -> Approved. Only APPROVED coverage is billed
     and reaches the invoice annexure (REP-002), which is why the headline
     "billed hours" figure counts approved rows alone. -->

<oj-sp-general-overview-page
  id="leaveLossCoveragePage"
  class="oj-sm-width-full rw-page-full"
  display-options.responsive-padding="off"
  page-title="[[$application.translations.appBundle.leave_loss_coverage_leave_loss_coverage]]"
  page-subtitle="[[$application.translations.appBundle.leave_loss_coverage_cover_an_absentee_with_an_unbilled_colleague]]">

  <div class="oj-flex oj-sm-flex-direction-column oj-sm-width-full oj-sm-gap-4x"
       slot="main">

    <!-- ══════════════════ Selection ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-start oj-sm-flex-wrap oj-sm-gap-3x">
        <oj-form-layout max-columns="2" direction="row" label-edge="top" class="oj-flex-item">
          <oj-select-single label-hint="[[$application.translations.appBundle.leave_loss_coverage_project_fcp_with_leave_loss]]"
                            data="[[ $variables.projectOptions ]]"
                            value="{{ $variables.projectId }}"
                            item-text="label"
                            placeholder="[[$application.translations.appBundle.common_select_project]]">
          </oj-select-single>
          <oj-select-single label-hint="[[$application.translations.appBundle.common_month]]"
                            data="[[ $application.variables.periodOptions ]]"
                            value="{{ $variables.periodId }}"
                            item-text="label">
          </oj-select-single>
        </oj-form-layout>

        <div class="oj-flex oj-sm-gap-2x">
          <oj-button chroming="borderless" on-oj-action="[[ $listeners.reload ]]">
            <span slot="startIcon" class="oj-ux-ico-refresh"></span>
            <span><oj-bind-text value="[[$application.translations.appBundle.common_refresh]]"></oj-bind-text></span>
          </oj-button>
          <oj-button chroming="outlined"
                     disabled="[[ $variables.busy || !$variables.projectId || !$variables.periodId ]]"
                     on-oj-action="[[ $listeners.generate ]]">
            <span><oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_refresh_absences_from_hr]]"></oj-bind-text></span>
          </oj-button>
        </div>
      </div>

      <oj-bind-if test="[[ $variables.projectOptionsArray.length === 0 ]]">
        <div class="oj-sm-padding-3x oj-sm-margin-3x-top rw-notice" role="status">
          <oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_none_of_your_projects_is_a_fixed_capacity_pr]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <div class="oj-flex oj-sm-flex-wrap oj-sm-gap-6x oj-sm-margin-4x-top">
        <div class="oj-flex-item">
          <div class="rw-metric-value"><oj-bind-text value="[[ $variables.openCount ]]"></oj-bind-text></div>
          <div class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_uncovered]]"></oj-bind-text></div>
        </div>
        <div class="oj-flex-item">
          <div class="rw-metric-value"><oj-bind-text value="[[ $variables.assignedCount ]]"></oj-bind-text></div>
          <div class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_assigned_awaiting_approval]]"></oj-bind-text></div>
        </div>
        <div class="oj-flex-item">
          <div class="rw-metric-value"><oj-bind-text value="[[ $variables.approvedCount ]]"></oj-bind-text></div>
          <div class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.common_approved]]"></oj-bind-text></div>
        </div>
        <div class="oj-flex-item">
          <div class="rw-metric-value"><oj-bind-text value="[[ $application.functions.fmtHours($variables.billedHours) ]]"></oj-bind-text></div>
          <div class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_hours_recovered_as_billed]]"></oj-bind-text></div>
          <!-- Approved coverage where no hours actually moved. Shown rather
               than absorbed into a lower total, because the two look identical
               on the tile and need different actions. -->
          <oj-bind-if test="[[ $variables.unbilledApproved > 0 ]]">
            <div class="oj-typography-body-xs rw-metric-label">
              <oj-bind-text value="[[ $page.functions.unbilledNote($variables.unbilledApproved) ]]"></oj-bind-text>
            </div>
          </oj-bind-if>
        </div>
      </div>
    </div>

    <!-- ══════════════════ Absentee lines ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-center oj-sm-flex-wrap oj-sm-gap-2x oj-sm-margin-3x-bottom">
        <h2 class="oj-typography-heading-xs oj-sm-margin-0"><oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_absences]]"></oj-bind-text></h2>
        <oj-button chroming="callToAction"
                   disabled="[[ $variables.busy || $variables.assignedCount === 0 ]]"
                   on-oj-action="[[ $listeners.approveAll ]]">
          <span><oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_approve_all_assigned]]"></oj-bind-text><oj-bind-text value="[[ $variables.assignedCount ]]"></oj-bind-text>)</span>
        </oj-button>
      </div>

      <oj-bind-if test="[[ $variables.lines.length === 0 && !$variables.busy ]]">
        <div class="oj-typography-body-sm rw-metric-label" role="status">
          <oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_no_absence_records_this_period_use]]"></oj-bind-text>
          <strong><oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_refresh_absences_from_hr]]"></oj-bind-text></strong> <oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_if_leave_has_since_been_approved]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <oj-bind-if test="[[ $variables.lines.length > 0 ]]">
        <div class="rw-grid-scroll">
          <oj-table aria-label="Absences needing cover"
                    data="[[ $variables.linesADP ]]"
                    layout="fixed"
                    horizontal-grid-visible="enabled"
                    selection-mode='{"row": "none", "column": "none"}'
                    columns='[
                      {"headerText":"Absent employee","field":"absentEmployeeName","weight":2,"minWidth":170},
                      {"headerText":"Date","field":"absenceDate","template":"dateCell","width":130},
                      {"headerText":"Absence","field":"absenceType","width":130},
                      {"headerText":"Hours lost","field":"lossHours","template":"hoursCell","width":120},
                      {"headerText":"Covered by","field":"coverEmployeeName","template":"coverCell","weight":2,"minWidth":170},
                      {"headerText":"Status","field":"llcStatus","template":"statusCell","width":200},
                      {"headerText":"","field":"llcId","template":"actionCell","width":170,"sortable":"disabled"}
                    ]'>

            <template slot="dateCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ $application.functions.fmtDate(cell.row.absenceDate) ]]"></oj-bind-text>
                <div class="oj-typography-body-xs rw-metric-label">
                  <oj-bind-text value="[[ cell.row.absenceDay ]]"></oj-bind-text>
                </div>
              </span>
            </template>

            <!-- THE PROJECT'S SHARE LEADS. This showed absenceHours, so Sam's
                 8-hour day of leave read as an 8-hour loss to 555 when he is
                 allocated 25% there and the loss is 2. The whole absence stays
                 on the second line because the manager still needs to know it
                 was a full day off, and because "2.00" with no context invites
                 the question this answers. -->
            <template slot="hoursCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ $application.functions.fmtHours(cell.row.lossHours) ]]"></oj-bind-text>
                <div class="oj-typography-body-xs rw-metric-label">
                  <oj-bind-text value="[[ $page.functions.absenceNote(cell.row) ]]"></oj-bind-text>
                </div>
              </span>
            </template>

            <template slot="coverCell" data-oj-as="cell">
              <span>
                <oj-bind-if test="[[ cell.row.coverEmployeeName ]]">
                  <oj-bind-text value="[[ cell.row.coverEmployeeName ]]"></oj-bind-text>
                </oj-bind-if>
                <oj-bind-if test="[[ !cell.row.coverEmployeeName ]]">
                  <span class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_no_cover_assigned]]"></oj-bind-text></span>
                </oj-bind-if>
              </span>
            </template>

            <template slot="statusCell" data-oj-as="cell">
              <span>
                <span :class="[[ $application.functions.outcomeClass(cell.row.llcStatus) ]]">
                  <oj-bind-text value="[[ cell.row.llcStatus ]]"></oj-bind-text>
                </span>
                <!-- The chip used to say only "Billed", which was true of the
                     flag and not always of the hours: a row approved before the
                     billing was wired carries the flag with nothing moved. It
                     now states the quantity, or says plainly that none moved. -->
                <oj-bind-if test="[[ cell.row.billedFlag === 'Y' ]]">
                  <span :class="[[ $page.functions.billedClass(cell.row) ]]"
                        :title="[[ $page.functions.billedTitle(cell.row) ]]">
                    <oj-bind-text value="[[ $page.functions.billedLabel(cell.row) ]]"></oj-bind-text>
                  </span>
                </oj-bind-if>
              </span>
            </template>

            <template slot="actionCell" data-oj-as="cell">
              <div class="oj-flex oj-sm-gap-1x">
                <!-- Approved coverage is settled: reassigning it would change
                     hours already on an invoice annexure. -->
                <oj-bind-if test="[[ cell.row.llcStatus !== 'Approved' ]]">
                  <oj-button chroming="borderless" disabled="[[ $variables.busy ]]"
                             :aria-label="[[ $page.functions.assignLabel(cell.row.absentEmployeeName) ]]"
                             on-oj-action="[[ $listeners.openAssign ]]">
                    <span><oj-bind-text value="[[ $application.functions.ifSet(cell.row.coverEmployeeId, 'Reassign', 'Assign') ]]"></oj-bind-text></span>
                  </oj-button>
                </oj-bind-if>

                <oj-bind-if test="[[ cell.row.llcStatus === 'Assigned' ]]">
                  <oj-button chroming="outlined" disabled="[[ $variables.busy ]]"
                             :aria-label="[[ $page.functions.approveLabel(cell.row.absentEmployeeName) ]]"
                             on-oj-action="[[ $listeners.approveOne ]]">
                    <span><oj-bind-text value="[[$application.translations.appBundle.common_approve]]"></oj-bind-text></span>
                  </oj-button>
                </oj-bind-if>
              </div>
            </template>
          </oj-table>
        </div>
      </oj-bind-if>
    </div>

    <oj-bind-if test="[[ $variables.busy ]]">
      <div class="oj-flex oj-sm-align-items-center oj-sm-gap-2x" role="status" aria-live="polite">
        <oj-progress-circle size="sm" value="-1"></oj-progress-circle>
        <span class="oj-typography-body-sm"><oj-bind-text value="[[$application.translations.appBundle.common_working]]"></oj-bind-text></span>
      </div>
    </oj-bind-if>

  </div>

  <!-- ══════════════════ Assign dialog (ACT-022) ══════════════════ -->
  <oj-dialog id="assignDlg" dialog-title="[[$application.translations.appBundle.leave_loss_coverage_assign_a_covering_colleague]]"
             cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-sm rw-metric-label">
        <oj-bind-text value="[[ $variables.assignLabel ]]"></oj-bind-text>
      </p>
      <p class="oj-typography-body-sm rw-metric-label">
        <oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_only_colleagues_who_are_unbilled_on_this_pro]]"></oj-bind-text>
      </p>

      <oj-bind-if test="[[ $variables.coverOptionsArray.length === 0 ]]">
        <div class="oj-sm-padding-3x rw-notice rw-notice-warning" role="status">
          <oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_nobody_is_eligible_to_cover_this_day_the_abs]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <oj-form-layout label-edge="top" max-columns="1">
        <oj-select-single label-hint="[[$application.translations.appBundle.leave_loss_coverage_covering_colleague]]" required="true"
                          data="[[ $variables.coverOptions ]]"
                          value="{{ $variables.assignCoverId }}"
                          item-text="label"
                          disabled="[[ $variables.coverOptionsArray.length === 0 ]]"
                          placeholder="[[$application.translations.appBundle.leave_loss_coverage_select_a_colleague]]">
        </oj-select-single>
      </oj-form-layout>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.closeAssign ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction"
                 disabled="[[ $variables.busy || !$variables.assignCoverId ]]"
                 on-oj-action="[[ $listeners.doAssign ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.leave_loss_coverage_assign]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

  <!-- ══════════════════ Confirmation ══════════════════ -->
  <!-- oj-dialog opened via Actions.callComponentMethod, not window.confirm:
       SES blocks browser globals inside chains (knowledge/14 §7). -->
  <oj-dialog id="approveAllDlg" dialog-title="[[$application.translations.appBundle.leave_loss_coverage_approve_all_assigned_coverage]]" cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-md">
        <oj-bind-text value="[[ $variables.confirmMessage ]]"></oj-bind-text>
      </p>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.cancelApproveAll ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction" disabled="[[ $variables.busy ]]"
                 on-oj-action="[[ $listeners.confirmApproveAll ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_approve_all]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

</oj-sp-general-overview-page>
