<!-- PAGE-005 Approval Detail (PER-003)

     Two granularities, one page:

       * weekly — tick weeks and approve/reject them wholesale (ACT-014/015).
         Approving a week marks every one of its days approved.

       * daily  — open one week and act on specific DATES (ACT-017). Selection is
         by date, not by line: approving three of a day's five lines is not a
         state the workflow models.

     Override & approve (ACT-016) corrects a cell as the manager. It does not
     approve anything by itself — the week is closed separately with
     "Finish & approve", which is what makes the status 'Overridden and
     approved' rather than a plain 'Approved'.

     The change history sits at the end because it is evidence for the decision
     being made above it. -->

<oj-sp-general-overview-page
  id="approvalDetailPage"
  class="oj-sm-width-full rw-page-full"
  display-options.responsive-padding="off"
  page-title="[[$application.translations.appBundle.approval_detail_approval_detail]]"
  page-subtitle="[[$application.translations.appBundle.approval_detail_approve_or_reject_by_week_or_open_a_week_and]]">

  <div class="oj-flex oj-sm-flex-direction-column oj-sm-width-full oj-sm-gap-4x"
       slot="main">

    <!-- ══════════════════ Context ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-start oj-sm-flex-wrap oj-sm-gap-3x">
        <div class="oj-flex-item">
          <oj-button chroming="borderless" on-oj-action="[[ $listeners.goBack ]]">
            <span slot="startIcon" class="oj-ux-ico-arrow-left"></span>
            <span><oj-bind-text value="[[$application.translations.appBundle.approval_detail_monthly_summary]]"></oj-bind-text></span>
          </oj-button>
          <h2 class="oj-typography-heading-sm oj-sm-margin-0 oj-sm-margin-1x-top">
            <oj-bind-text value="[[ $application.variables.selectedEmployeeName ]]"></oj-bind-text>
          </h2>
          <p class="oj-typography-body-sm rw-metric-label">
            <oj-bind-text value="[[ $application.variables.selectedProjectName ]]"></oj-bind-text>
            ·
            <oj-bind-text value="[[ $application.variables.selectedPeriodName ]]"></oj-bind-text>
          </p>
        </div>
        <oj-button chroming="borderless" on-oj-action="[[ $listeners.reload ]]">
          <span slot="startIcon" class="oj-ux-ico-refresh"></span>
          <span><oj-bind-text value="[[$application.translations.appBundle.common_refresh]]"></oj-bind-text></span>
        </oj-button>
      </div>
    </div>

    <!-- ══════════════════ WEEKLY VIEW ══════════════════ -->
    <oj-bind-if test="[[ $variables.view === 'weekly' ]]">
      <div class="oj-sm-padding-4x rw-metric">
        <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-center oj-sm-flex-wrap oj-sm-gap-2x oj-sm-margin-3x-bottom">
          <h2 class="oj-typography-heading-xs oj-sm-margin-0">
            <oj-bind-text value="[[$application.translations.appBundle.common_weeks]]"></oj-bind-text>
            <!-- FLD-003. The weekly cut-off governs a WEEK, so it belongs here
                 rather than in the month-level cut-off panel on PAGE-003. -->
            <oj-bind-if test="[[ $variables.weeklyCutoff ]]">
              <span class="rw-metric-label oj-sm-margin-2x-start">
                <oj-bind-text value="[[$application.translations.appBundle.approval_detail_weekly_cut_off]]"></oj-bind-text> <oj-bind-text value="[[ $variables.weeklyCutoff ]]"></oj-bind-text>
              </span>
            </oj-bind-if>
          </h2>
          <div class="oj-flex oj-sm-align-items-center oj-sm-gap-2x oj-sm-flex-wrap">
            <span class="oj-typography-body-sm rw-metric-label">
              <oj-bind-text value="[[ $variables.selectedWeekKeys.length ]]"></oj-bind-text> <oj-bind-text value="[[$application.translations.appBundle.common_selected]]"></oj-bind-text>
            </span>
            <oj-button chroming="borderless"
                       on-oj-action="[[ $listeners.selectPendingWeeks ]]">
              <span><oj-bind-text value="[[$application.translations.appBundle.common_select_all_pending]]"></oj-bind-text></span>
            </oj-button>
            <oj-button chroming="borderless"
                       disabled="[[ $variables.selectedWeekKeys.length === 0 ]]"
                       on-oj-action="[[ $listeners.clearWeekSelection ]]">
              <span><oj-bind-text value="[[$application.translations.appBundle.common_clear]]"></oj-bind-text></span>
            </oj-button>
            <!-- Undo, and the two decision buttons off once the decision is
                 taken - see canDecideWeeks. -->
            <oj-button chroming="borderless"
                       disabled="[[ $variables.busy ||
                                    !$page.functions.canRevokeWeeks($variables.weeks, $variables.selectedWeekKeys) ]]"
                       on-oj-action="[[ $listeners.revokeWeeks ]]">
              <span><oj-bind-text value="[[$application.translations.appBundle.approval_detail_undo_decision]]"></oj-bind-text></span>
            </oj-button>
            <oj-button chroming="outlined"
                       disabled="[[ $variables.busy ||
                                    !$page.functions.canDecideWeeks($variables.weeks, $variables.selectedWeekKeys) ]]"
                       on-oj-action="[[ $listeners.openRejectWeek ]]">
              <span><oj-bind-text value="[[$application.translations.appBundle.common_reject_selected]]"></oj-bind-text></span>
            </oj-button>
            <oj-button chroming="callToAction"
                       disabled="[[ $variables.busy ||
                                    !$page.functions.canDecideWeeks($variables.weeks, $variables.selectedWeekKeys) ]]"
                       on-oj-action="[[ $listeners.approveWeeks ]]">
              <span><oj-bind-text value="[[$application.translations.appBundle.common_approve_selected]]"></oj-bind-text></span>
            </oj-button>

            <!-- ACT-019 approve every pending week for this employee on this
                 project, without selecting them one by one. A convenience
                 roll-up over the same rule set: the server still applies
                 RULE-015, so a manager cannot sweep up their own week here.
                 Confirmed first, because it acts on rows that are not on
                 screen once the list scrolls. -->
            <oj-button chroming="outlined"
                       disabled="[[ $variables.busy || $variables.pendingWeekCount === 0 ]]"
                       on-oj-action="[[ $listeners.askApproveAllWeeks ]]">
              <span slot="startIcon" class="oj-ux-ico-check-all"></span>
              <span>
                <oj-bind-text value="[[ $page.functions.approveAllLabel($variables.pendingWeekCount) ]]"></oj-bind-text>
              </span>
            </oj-button>
          </div>
        </div>

        <oj-bind-if test="[[ $variables.weeks.length === 0 && !$variables.busy ]]">
          <div class="oj-typography-body-sm rw-metric-label" role="status">
            <oj-bind-text value="[[$application.translations.appBundle.approval_detail_no_submitted_weeks_this_employee_has_no_week]]"></oj-bind-text>
          </div>
        </oj-bind-if>

        <oj-bind-if test="[[ $variables.weeks.length > 0 ]]">
          <div class="rw-grid-scroll">
            <oj-table aria-label="Weeks for this employee"
                      data="[[ $variables.weeksADP ]]"
                      layout="fixed"
                      horizontal-grid-visible="enabled"
                      selection-mode='{"row": "none", "column": "none"}'
                      columns='[
                        {"headerText":"","field":"tsWeekId","template":"pickCell","width":44,"sortable":"disabled"},
                        {"headerText":"Week","field":"weekIndex","template":"weekCell","weight":2,"minWidth":190},
                        {"headerText":"Projects","field":"projects","weight":2,"minWidth":110},
                        {"headerText":"Billable","field":"billableHours","template":"billCell","width":125},
                        {"headerText":"Non-billable","field":"nonBillableHours","template":"nonBillCell","width":165},
                        {"headerText":"Leave","field":"leaveHours","template":"leaveCell","width":110},
                        {"headerText":"Billing loss","field":"billingLossHours","template":"lossCell","width":160},
                        {"headerText":"Total","field":"totalHours","template":"totalCell","width":110},
                        {"headerText":"Days","field":"daysApproved","template":"daysCell","width":130},
                        {"headerText":"Employee status","field":"submissionStatus","template":"empStatusCell","weight":2,"minWidth":200},
                        {"headerText":"Manager status","field":"approvalStatus","template":"mgrStatusCell","weight":2,"minWidth":200},
                        {"headerText":"","field":"tsWeekId","template":"actionCell","width":100,"sortable":"disabled"}
                      ]'>

              <!-- The "+n other" chip was removed 19-Aug on request. It flagged
                   that approve_week settles the employee's OTHER projects too,
                   since OC_TS_WEEK carries one APPROVAL_STATUS. That is still
                   true and is now unsaid on this screen; the version trail
                   records which projects a week covered. -->

              <template slot="pickCell" data-oj-as="cell">
                <!-- A settled week has nothing to decide, so it cannot be ticked.
                     oj-checkboxset rather than a raw HTML checkbox: Redwood standards
                     forbid raw HTML form controls. -->
                <oj-checkboxset class="apdt-row-pick"
                                :aria-label="[[ $page.functions.weekPickLabel(cell.row.weekIndex) ]]"
                                :disabled="[[ $page.functions.isSettled(cell.row.weekStatus) ]]"
                                value="[[ $page.functions.weekPickValue($variables.selectedWeekKeys, cell.row.tsWeekId) ]]"
                                on-value-changed="[[ $listeners.toggleWeekPick ]]">
                  <oj-option value="on"></oj-option>
                </oj-checkboxset>
              </template>

              <template slot="weekCell" data-oj-as="cell">
                <span>
                  <oj-bind-text value="[[$application.translations.appBundle.common_week]]"></oj-bind-text> <oj-bind-text value="[[ cell.row.weekIndex ]]"></oj-bind-text>
                  <div class="oj-typography-body-xs rw-metric-label">
                    <oj-bind-text value="[[ cell.row.weekRange ]]"></oj-bind-text>
                  </div>
                </span>
              </template>

              <template slot="billCell" data-oj-as="cell">
                <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.billableHours) ]]"></oj-bind-text></span>
              </template>
              <template slot="nonBillCell" data-oj-as="cell">
                <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.nonBillableHours) ]]"></oj-bind-text></span>
              </template>
              <template slot="leaveCell" data-oj-as="cell">
                <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.leaveHours) ]]"></oj-bind-text></span>
              </template>
              <template slot="lossCell" data-oj-as="cell">
                <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.billingLossHours) ]]"></oj-bind-text></span>
              </template>
              <template slot="totalCell" data-oj-as="cell">
                <span class="oj-typography-semi-bold"><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.totalHours) ]]"></oj-bind-text></span>
              </template>

              <template slot="daysCell" data-oj-as="cell">
                <span>
                  <oj-bind-text value="[[ cell.row.daysApproved ]]"></oj-bind-text> /
                  <oj-bind-text value="[[ cell.row.daysTotal ]]"></oj-bind-text> <oj-bind-text value="[[$application.translations.appBundle.approval_detail_appr]]"></oj-bind-text>
                  <oj-bind-if test="[[ cell.row.daysRejected > 0 ]]">
                    <span class="rw-flag rw-flag-reversal">
                      <oj-bind-text value="[[ cell.row.daysRejected ]]"></oj-bind-text> <oj-bind-text value="[[$application.translations.appBundle.approval_detail_rej]]"></oj-bind-text>
                    </span>
                  </oj-bind-if>
                </span>
              </template>

              <!-- THE TWO V4 AXES, SPLIT 19-Aug.
                   Review: "Isn't there manager status and employee status, or
                   is it just one status?" — "I think for both, you can show
                   both." This column showed WEEK_STATUS, which collapses them,
                   so the manager could not tell a week nobody had sent from one
                   sitting with them undecided. The employee's own page was
                   already split; this is the other half of the same ask.
                   The flags stay on the employee side, because that is what
                   they describe: how the hours got there. -->
              <template slot="empStatusCell" data-oj-as="cell">
                <span>
                  <span :class="[[ $application.functions.statusClass(cell.row.submissionStatus) ]]">
                    <oj-bind-text value="[[ $page.functions.submissionLabel(cell.row.submissionStatus) ]]"></oj-bind-text>
                  </span>
                  <!-- The 6 flags, derived from the raw row so this page and the
                       employee's own page always say the same thing. -->
                  <oj-bind-for-each data="[[ $application.functions.weekFlags(cell.row) ]]">
                    <template>
                      <span :class="[[ $current.data.cls ]]" :title="[[ $current.data.title ]]">
                        <oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text>
                      </span>
                    </template>
                  </oj-bind-for-each>
                </span>
              </template>

              <template slot="mgrStatusCell" data-oj-as="cell">
                <span :class="[[ $application.functions.statusClass(cell.row.approvalStatus) ]]"
                      :title="[[ $page.functions.approvalHint(cell.row.submissionStatus, cell.row.approvalStatus) ]]">
                  <oj-bind-text value="[[ $page.functions.approvalLabel(cell.row.approvalStatus) ]]"></oj-bind-text>
                </span>
              </template>

              <template slot="actionCell" data-oj-as="cell">
                <oj-button chroming="outlined"
                           :aria-label="[[ $page.functions.openWeekLabel(cell.row.weekIndex) ]]"
                           on-oj-action="[[ $listeners.openWeek ]]">
                  <span><oj-bind-text value="[[$application.translations.appBundle.common_open]]"></oj-bind-text></span>
                </oj-button>
              </template>
            </oj-table>
          </div>
        </oj-bind-if>
      </div>
    </oj-bind-if>

    <!-- ══════════════════ DAILY VIEW ══════════════════ -->
    <oj-bind-if test="[[ $variables.view === 'daily' ]]">
      <div class="oj-sm-padding-4x rw-metric">
        <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-center oj-sm-flex-wrap oj-sm-gap-2x oj-sm-margin-3x-bottom">
          <div>
            <oj-button chroming="borderless" on-oj-action="[[ $listeners.showWeekly ]]">
              <span slot="startIcon" class="oj-ux-ico-arrow-left"></span>
              <span><oj-bind-text value="[[$application.translations.appBundle.approval_detail_all_weeks]]"></oj-bind-text></span>
            </oj-button>
            <h2 class="oj-typography-heading-xs oj-sm-margin-0 oj-sm-margin-1x-top">
              <oj-bind-text value="[[ $variables.weekLabel ]]"></oj-bind-text>
              <span :class="[[ $application.functions.statusClass($variables.weekStatus) ]]">
                <oj-bind-text value="[[ $variables.weekStatus ]]"></oj-bind-text>
              </span>
            </h2>
          </div>

          <div class="oj-flex oj-sm-align-items-center oj-sm-gap-2x oj-sm-flex-wrap">
            <span class="oj-typography-body-sm rw-metric-label">
              <oj-bind-text value="[[ $variables.selectedDates.length ]]"></oj-bind-text> <oj-bind-text value="[[$application.translations.appBundle.approval_detail_dates_selected]]"></oj-bind-text>
            </span>

            <!-- ACT-018, download half only. The upload half is on hold by
                 decision (01-Aug-2026), so this is a read-out for working in
                 Excel — nothing comes back through it.

                 A plain anchor, not a button calling window.open: SES blocks
                 browser globals in page modules, and letting the browser
                 stream the file is what gives the Save dialog for free. -->
            <a class="ad-export-link"
               :href="[[ $page.functions.dayExportUrl($application.variables.ordsBaseUrl, $variables.weekId) ]]"
               :aria-label="[[ $page.functions.dayExportLabel($variables.weekLabel) ]]"
               target="_blank" rel="noopener">
              <span class="oj-ux-ico-download" aria-hidden="true"></span>
              <span><oj-bind-text value="[[$application.translations.appBundle.approval_detail_download_csv]]"></oj-bind-text></span>
            </a>
            <!-- Undo a decision taken by mistake. Approve and Reject only ever
                 write their own status, so without this the two buttons that
                 produce a mis-click cannot correct it. Enabled only when
                 something in the selection actually has a decision on it. -->
            <oj-button chroming="borderless"
                       disabled="[[ $variables.busy ||
                                    !$page.functions.canRevoke($variables.days, $variables.selectedDates) ]]"
                       on-oj-action="[[ $listeners.revokeDates ]]">
              <span><oj-bind-text value="[[$application.translations.appBundle.approval_detail_undo_decision]]"></oj-bind-text></span>
            </oj-button>
            <!-- Disabled once every selected date already carries this decision.
                 Selection count alone left both live after a rejection, so the
                 screen said nothing had been decided when it had. -->
            <oj-button chroming="outlined"
                       disabled="[[ $variables.busy ||
                                    !$page.functions.canDecide($variables.days, $variables.selectedDates) ]]"
                       on-oj-action="[[ $listeners.openRejectDates ]]">
              <span><oj-bind-text value="[[$application.translations.appBundle.approval_detail_reject_dates]]"></oj-bind-text></span>
            </oj-button>
            <oj-button chroming="callToAction"
                       disabled="[[ $variables.busy ||
                                    !$page.functions.canDecide($variables.days, $variables.selectedDates) ]]"
                       on-oj-action="[[ $listeners.approveDates ]]">
              <span><oj-bind-text value="[[$application.translations.appBundle.approval_detail_approve_dates]]"></oj-bind-text></span>
            </oj-button>
          </div>
        </div>

        <!-- After an override the week must be closed explicitly, so the status
             records that a manager changed the hours. -->
        <oj-bind-if test="[[ $variables.overrideCount > 0 ]]">
          <div class="oj-sm-padding-3x oj-sm-margin-3x-bottom rw-notice rw-notice-warning" role="status">
            <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-center oj-sm-gap-3x oj-sm-flex-wrap">
              <span>
                <oj-bind-text value="[[ $variables.overrideCount ]]"></oj-bind-text>
                <oj-bind-text value="[[$application.translations.appBundle.approval_detail_cell_s_corrected_in_this_sitting_close_the_w]]"></oj-bind-text>
                <strong><oj-bind-text value="[[$application.translations.appBundle.approval_detail_finish_approve]]"></oj-bind-text></strong> <oj-bind-text value="[[$application.translations.appBundle.approval_detail_so_it_is_recorded_as_overridden_and_approved]]"></oj-bind-text>
              </span>
              <oj-button chroming="callToAction" disabled="[[ $variables.busy ]]"
                         on-oj-action="[[ $listeners.finishOverride ]]">
                <span><oj-bind-text value="[[$application.translations.appBundle.approval_detail_finish_approve]]"></oj-bind-text></span>
              </oj-button>
            </div>
          </div>
        </oj-bind-if>

        <oj-bind-if test="[[ $variables.days.length === 0 && !$variables.busy ]]">
          <div class="oj-typography-body-sm rw-metric-label" role="status">
            <oj-bind-text value="[[$application.translations.appBundle.approval_detail_no_time_lines_on_this_week]]"></oj-bind-text>
          </div>
        </oj-bind-if>

        <oj-bind-if test="[[ $variables.days.length > 0 ]]">
          <div class="rw-grid-scroll">
            <oj-table aria-label="Daily lines for the open week"
                      data="[[ $variables.daysADP ]]"
                      layout="fixed"
                      horizontal-grid-visible="enabled"
                      selection-mode='{"row": "none", "column": "none"}'
                      columns='[
                        {"headerText":"","field":"tsEntryId","template":"pickCell","headerTemplate":"pickDateHeader","width":44,"sortable":"disabled"},
                        {"headerText":"Date","field":"entryDate","template":"dateCell","width":118},
                        {"headerText":"Project","field":"projectName","template":"projectCell","weight":3,"minWidth":170},
                        {"headerText":"Task","field":"taskName","template":"taskCell","weight":3,"minWidth":170},
                        {"headerText":"Hours","field":"hours","template":"hoursCell","width":84},
                        {"headerText":"Type","field":"billableType","template":"typeCell","width":112},
                        {"headerText":"Shift","field":"shiftCode","template":"shiftCell","width":84},
                        {"headerText":"Status","field":"dayStatus","template":"dayStatusCell","width":150},
                        {"headerText":"Flags","field":"flagCodes","template":"dayFlagCell","width":150,"sortable":"disabled"},
                        {"headerText":"Source","field":"source","template":"sourceCell","width":110},
                        {"headerText":"","field":"tsEntryId","template":"actionCell","width":96,"sortable":"disabled"}
                      ]'>

              <!-- Select-all lives HERE now, not in the toolbar (22-Aug). Same
                   rule as the rows: it counts DATES, not lines, so a day with
                   two project lines is one tick. -->
              <template slot="pickDateHeader">
                <oj-checkboxset class="apdt-row-pick"
                                aria-label="Select all dates"
                                value="[[ $page.functions.allDatePickValue($variables.selectedDates, $variables.days) ]]"
                                on-value-changed="[[ $listeners.toggleAllDatePick ]]">
                  <oj-option value="on"></oj-option>
                </oj-checkboxset>
              </template>

              <template slot="pickCell" data-oj-as="cell">
                <!-- Ticking any line ticks the whole DATE — approval is by day. -->
                <oj-checkboxset class="apdt-row-pick"
                                :aria-label="[[ $page.functions.datePickLabel(cell.row.entryDate) ]]"
                                value="[[ $page.functions.datePickValue($variables.selectedDates, cell.row.entryDate) ]]"
                                on-value-changed="[[ $listeners.toggleDatePick ]]">
                  <oj-option value="on"></oj-option>
                </oj-checkboxset>
              </template>

              <template slot="dateCell" data-oj-as="cell">
                <span>
                  <oj-bind-text value="[[ $application.functions.fmtDate(cell.row.entryDate) ]]"></oj-bind-text>
                  <div class="oj-typography-body-xs rw-metric-label">
                    <oj-bind-text value="[[ cell.row.dayName ]]"></oj-bind-text>
                  </div>
                </span>
              </template>

              <!-- TITLE ON EVERY TEXT CELL (22-Aug). A column can always be too
                   narrow for the value somebody puts in it -- a long project
                   name, a task code nobody anticipated -- and the fix that
                   survives the next piece of data is being able to read it on
                   hover, not another width guess. The ellipsis rule in
                   redwood-overrides.css is what shows there is more to see. -->
              <template slot="projectCell" data-oj-as="cell">
                <span :title="[[ cell.row.projectName ]]">
                  <oj-bind-text value="[[ cell.row.projectName ]]"></oj-bind-text>
                </span>
              </template>

              <template slot="shiftCell" data-oj-as="cell">
                <span :title="[[ cell.row.shiftCode ]]">
                  <oj-bind-text value="[[ cell.row.shiftCode ]]"></oj-bind-text>
                </span>
              </template>

              <!-- DAY FLAGS (db/122). The week banner says a week needs a look;
                   this says which day, which is the question somebody who has
                   already opened the week is asking. A WBS change touching two
                   days of five is the case that made it necessary.

                   Rendered from flagCodes on the day feed rather than a second
                   call. Note the CSV export does NOT carry them: its column
                   list is a contract, so widening it is a separate decision
                   (db/122). The screen shows more than the download here. -->
              <template slot="dayFlagCell" data-oj-as="cell">
                <span :title="[[ cell.row.flagLabels ]]">
                  <oj-bind-for-each data="[[ $page.functions.dayFlagList(cell.row.flagCodes) ]]">
                    <template>
                      <span :class="[[ $page.functions.dayFlagClass($current.data) ]]"><oj-bind-text value="[[ $page.functions.dayFlagLabel($current.data) ]]"></oj-bind-text></span>
                    </template>
                  </oj-bind-for-each>
                </span>
              </template>

              <template slot="sourceCell" data-oj-as="cell">
                <span :title="[[ cell.row.source ]]">
                  <oj-bind-text value="[[ cell.row.source ]]"></oj-bind-text>
                </span>
              </template>

              <template slot="taskCell" data-oj-as="cell">
                <span :title="[[ cell.row.taskName ]]">
                  <oj-bind-text value="[[ cell.row.taskName ]]"></oj-bind-text>
                  <oj-bind-if test="[[ cell.row.isLeave === 'Y' ]]">
                    <span class="rw-flag rw-flag-advance"
                          :title="[[ $page.functions.leaveTitle(cell.row.absenceType) ]]"><oj-bind-text value="[[$application.translations.appBundle.common_leave]]"></oj-bind-text></span>
                  </oj-bind-if>
                  <oj-bind-if test="[[ cell.row.entryType === 'Reversal' ]]">
                    <span class="rw-flag rw-flag-reversal"><oj-bind-text value="[[$application.translations.appBundle.approval_detail_reversal]]"></oj-bind-text></span>
                  </oj-bind-if>
                  <oj-bind-if test="[[ cell.row.entryType === 'Adjustment' ]]">
                    <span class="rw-flag rw-flag-adjustment"><oj-bind-text value="[[$application.translations.appBundle.approval_detail_adjustment]]"></oj-bind-text></span>
                  </oj-bind-if>
                  <!-- The per-day "Default hours" chip was removed 19-Aug. The
                       week already carries Defaulted as its status and as a
                       flag, so repeating it on all five days said nothing new
                       and crowded out Reversal and Adjustment, which are
                       per-day facts and the only reason this column exists.
                       ENTRY_TYPE = 'Default' is still written and still drives
                       the accrual hand-off (INT-014); it is simply not shown. -->
                </span>
              </template>

              <template slot="hoursCell" data-oj-as="cell">
                <span class="oj-typography-semi-bold">
                  <oj-bind-text value="[[ $application.functions.fmtHours(cell.row.hours) ]]"></oj-bind-text>
                </span>
              </template>

              <!-- FLD-012 Billable Type is manager-only; it is deliberately not
                   on the employee's own page. -->
              <template slot="typeCell" data-oj-as="cell">
                <span>
                  <oj-bind-text value="[[ cell.row.billableType ]]"></oj-bind-text>
                  <oj-bind-if test="[[ cell.row.billableType === 'Non-billable'
                                    && cell.row.unbilledReason
                                    && cell.row.unbilledReason !== '—' ]]">
                    <div class="oj-typography-body-xs rw-metric-label">
                      <oj-bind-text value="[[ cell.row.unbilledReason ]]"></oj-bind-text>
                    </div>
                  </oj-bind-if>
                </span>
              </template>

              <!-- "Day status" renamed to Manager status 19-Aug.
                   Review: "the top we are showing employee status ... then why
                   are you showing day status here? It should be manager status,
                   right?" — and "follow consistent naming convention, otherwise
                   it leads to confusion. Don't call it a day status."
                   The column always held the approval decision; DAY_STATUS is
                   written from APPROVAL_STATUS by the engine, one statement for
                   the whole week, so a day can never disagree with its week.
                   The name said "the state of this day", which invited the
                   reading that a day could be approved on its own — and
                   day-level approval was retired in V4. Same values, in the
                   words the rest of the module uses. -->
              <template slot="dayStatusCell" data-oj-as="cell">
                <span :class="[[ $application.functions.statusClass(cell.row.dayStatus) ]]"
                      :title="[[ $page.functions.rejectTitle(cell.row) ]]">
                  <oj-bind-text value="[[ $page.functions.approvalLabel(cell.row.dayStatus) ]]"></oj-bind-text>
                </span>
              </template>

              <template slot="actionCell" data-oj-as="cell">
                <!-- Leave comes from HCM and is not the manager's to retype
                     (RULE-008); everything else can be corrected. -->
                <oj-bind-if test="[[ cell.row.isLeave !== 'Y' ]]">
                  <oj-button chroming="borderless"
                             disabled="[[ $variables.busy ]]"
                             :aria-label="[[ $page.functions.correctLabel(cell.row.taskName) ]]"
                             on-oj-action="[[ $listeners.openOverride ]]">
                    <span><oj-bind-text value="[[$application.translations.appBundle.common_correct]]"></oj-bind-text></span>
                  </oj-button>
                </oj-bind-if>
              </template>
            </oj-table>
          </div>
        </oj-bind-if>
      </div>

      <!-- ══════════════════ Change history (REP-007 / NFR-010) ══════════════════ -->
      <!-- COLLAPSED BY DEFAULT 19-Aug. This ran to a full screen of rows on any
           week that had been touched more than once, and it sits below the
           thing the manager came here to do — so the approve/reject controls
           were pushed off-screen by an audit trail nobody had asked to see.
           It is evidence, wanted on demand, not context wanted always. -->
      <div class="oj-sm-padding-4x rw-metric">
        <div class="oj-flex oj-sm-align-items-center oj-sm-justify-content-space-between oj-sm-flex-wrap oj-sm-gap-2x">
          <div>
            <h2 class="oj-typography-heading-xs oj-sm-margin-0"><oj-bind-text value="[[$application.translations.appBundle.approval_detail_change_history]]"></oj-bind-text></h2>
            <p class="oj-typography-body-sm rw-metric-label oj-sm-margin-1x-top oj-sm-margin-0-bottom">
              <oj-bind-text value="[[$application.translations.appBundle.approval_detail_every_manager_correction_and_retro_adjustmen]]"></oj-bind-text>
            </p>
          </div>
          <!-- The count is on the button, so the manager can tell an untouched
               week from a heavily corrected one without opening anything. -->
          <oj-button chroming="outlined" on-oj-action="[[ $listeners.toggleHistory ]]">
            <span slot="startIcon" :class="[[ $variables.showHistory ? 'oj-ux-ico-chevron-up' : 'oj-ux-ico-chevron-down' ]]"></span>
            <span><oj-bind-text value="[[ $page.functions.historyToggleLabel($variables.showHistory, $variables.auditRows) ]]"></oj-bind-text></span>
          </oj-button>
        </div>

        <oj-bind-if test="[[ $variables.showHistory && $variables.auditRows.length === 0 ]]">
          <div class="oj-typography-body-sm rw-metric-label oj-sm-margin-2x-top" role="status">
            <oj-bind-text value="[[$application.translations.appBundle.approval_detail_nothing_has_been_changed_on_this_week]]"></oj-bind-text>
          </div>
        </oj-bind-if>

        <oj-bind-if test="[[ $variables.showHistory && $variables.auditRows.length > 0 ]]">
          <div class="rw-grid-scroll oj-sm-margin-3x-top">
            <oj-table aria-label="Change history for this week"
                      data="[[ $variables.auditADP ]]"
                      layout="fixed"
                      horizontal-grid-visible="enabled"
                      selection-mode='{"row": "none", "column": "none"}'
                      columns='[
                        {"headerText":"Date","field":"entryDate","template":"aDateCell","width":130},
                        {"headerText":"Event","field":"changeType","template":"aKindCell","width":180},
                        {"headerText":"From","field":"oldProjectName","template":"fromCell","weight":2},
                        {"headerText":"To","field":"newProjectName","template":"toCell","weight":2},
                        {"headerText":"Delta","field":"deltaHours","template":"deltaCell","width":95},
                        {"headerText":"Reason","field":"changeReason","weight":2},
                        {"headerText":"By","field":"changedBy","weight":2},
                        {"headerText":"When","field":"changedOn","width":160}
                      ]'>
              <template slot="aDateCell" data-oj-as="cell">
                <!-- A week- or month-level decision has no date, and rendering
                     an empty one as a blank cell reads as missing data. -->
                <span><oj-bind-text value="[[ $page.functions.activityDate(cell.row) ]]"></oj-bind-text></span>
              </template>
              <template slot="aKindCell" data-oj-as="cell">
                <span>
                  <span :class="[[ $page.functions.activityClass(cell.row) ]]">
                    <oj-bind-text value="[[ cell.row.changeType ]]"></oj-bind-text>
                  </span>
                </span>
              </template>
              <template slot="fromCell" data-oj-as="cell">
                <!-- A decision changed no value, so there is no from and no to.
                     Without this guard fmtHours(null) printed "(0.00)" and the
                     row looked like an edit that zeroed the day. -->
                <oj-bind-if test="[[ cell.row.kind === 'Decision' ]]"><span>&#8212;</span></oj-bind-if>
                <oj-bind-if test="[[ cell.row.kind !== 'Decision' ]]">
                <span>
                  <oj-bind-text value="[[ cell.row.oldProjectName ]]"></oj-bind-text>
                  <oj-bind-if test="[[ cell.row.oldTaskCode ]]">
                    / <oj-bind-text value="[[ cell.row.oldTaskCode ]]"></oj-bind-text>
                  </oj-bind-if>
                  (<oj-bind-text value="[[ $application.functions.fmtHours(cell.row.oldHours) ]]"></oj-bind-text>)
                </span>
                </oj-bind-if>
              </template>
              <template slot="toCell" data-oj-as="cell">
                <oj-bind-if test="[[ cell.row.kind === 'Decision' ]]"><span>&#8212;</span></oj-bind-if>
                <oj-bind-if test="[[ cell.row.kind !== 'Decision' ]]">
                <span>
                  <oj-bind-text value="[[ cell.row.newProjectName ]]"></oj-bind-text>
                  <oj-bind-if test="[[ cell.row.newTaskCode ]]">
                    / <oj-bind-text value="[[ cell.row.newTaskCode ]]"></oj-bind-text>
                  </oj-bind-if>
                  (<oj-bind-text value="[[ $application.functions.fmtHours(cell.row.newHours) ]]"></oj-bind-text>)
                </span>
                </oj-bind-if>
              </template>
              <template slot="deltaCell" data-oj-as="cell">
                <oj-bind-if test="[[ cell.row.kind === 'Decision' ]]"><span>&#8212;</span></oj-bind-if>
                <oj-bind-if test="[[ cell.row.kind !== 'Decision' ]]">
                  <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.deltaHours) ]]"></oj-bind-text></span>
                </oj-bind-if>
              </template>
            </oj-table>
          </div>
        </oj-bind-if>
      </div>
    </oj-bind-if>

    <oj-bind-if test="[[ $variables.busy ]]">
      <div class="oj-flex oj-sm-align-items-center oj-sm-gap-2x" role="status" aria-live="polite">
        <oj-progress-circle size="sm" value="-1"></oj-progress-circle>
        <span class="oj-typography-body-sm"><oj-bind-text value="[[$application.translations.appBundle.common_working]]"></oj-bind-text></span>
      </div>
    </oj-bind-if>

  </div>

  <!-- ══════════════════ Reject dialog (RULE-013) ══════════════════ -->
  <oj-dialog id="rejectDlg" dialog-title="[[$application.translations.appBundle.common_reject]]" cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-sm rw-metric-label">
        <oj-bind-text value="[[ $page.functions.rejectScopeNote($variables.rejectScope) ]]"></oj-bind-text>
      </p>
      <oj-form-layout label-edge="top" max-columns="1">
        <oj-select-single label-hint="[[$application.translations.appBundle.common_rejection_reason]]" required="true"
                          data="[[ $application.variables.rejectReasonOptions ]]"
                          value="{{ $variables.rejectReason }}"
                          item-text="label"
                          placeholder="[[$application.translations.appBundle.common_select_a_reason]]">
        </oj-select-single>
        <oj-text-area label-hint="[[$application.translations.appBundle.common_remarks]]" rows="3"
                      value="{{ $variables.rejectRemarks }}"
                      placeholder="[[$application.translations.appBundle.common_what_needs_to_change]]">
        </oj-text-area>
      </oj-form-layout>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.closeReject ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction"
                 disabled="[[ $variables.busy || !$variables.rejectReason ]]"
                 on-oj-action="[[ $listeners.doReject ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_reject]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

  <!-- ══════════════════ Override dialog (ACT-016) ══════════════════ -->
  <oj-dialog id="overrideDlg" dialog-title="[[$application.translations.appBundle.approval_detail_correct_hours]]" cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-sm rw-metric-label">
        <oj-bind-text value="[[ $variables.overrideLabel ]]"></oj-bind-text>
      </p>
      <p class="oj-typography-body-sm rw-metric-label">
        <oj-bind-text value="[[$application.translations.appBundle.approval_detail_the_employee_s_original_value_is_kept_in_the]]"></oj-bind-text> <strong><oj-bind-text value="[[$application.translations.appBundle.approval_detail_finish_approve]]"></oj-bind-text></strong>
        <oj-bind-text value="[[$application.translations.appBundle.approval_detail_when_you_are_done]]"></oj-bind-text>
      </p>
      <oj-form-layout label-edge="top" max-columns="1">
        <oj-input-number label-hint="[[$application.translations.appBundle.approval_detail_corrected_hours]]" required="true"
                         value="{{ $variables.overrideHours }}"
                         min="0" max="24" step="0.25">
        </oj-input-number>
        <!-- TWO BINDINGS, EACH DOING ITS OWN JOB. `value` commits on blur and
             is what the chain sends; `raw-value` updates per keystroke and is
             what the button reads. Gating on `value` alone left the button
             disabled while the reason sat filled in on screen (22-Aug). -->
        <oj-text-area label-hint="[[$application.translations.appBundle.approval_detail_reason_for_the_correction]]" rows="2" required="true"
                      value="{{ $variables.overrideReason }}"
                      raw-value="{{ $variables.overrideReasonRaw }}"
                      placeholder="[[$application.translations.appBundle.approval_detail_kept_in_the_audit_trail]]">
        </oj-text-area>
      </oj-form-layout>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.closeOverride ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction"
                 disabled="[[ $variables.busy || !$variables.overrideReasonRaw ]]"
                 on-oj-action="[[ $listeners.doOverride ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.approval_detail_apply_correction]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

  <!-- ACT-019 confirm approving every pending week at once -->
  <oj-dialog id="approveAllDlg" dialog-title="[[$application.translations.appBundle.approval_detail_approve_all_pending_weeks]]"
             cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-md">
        <oj-bind-text value="[[ $variables.confirmMessage ]]"></oj-bind-text>
      </p>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.cancelApproveAllWeeks ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction" disabled="[[ $variables.busy ]]"
                 on-oj-action="[[ $listeners.confirmApproveAllWeeks ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_approve_all]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

</oj-sp-general-overview-page>
