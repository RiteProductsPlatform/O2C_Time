<!-- PAGE-012 Integrations (PER-004 admin)

     A reference catalogue, not a control panel: nothing on this page triggers an
     integration. The rows come from OC_TIME_LOOKUP via the admin endpoint, so
     when a Fusion endpoint or load pattern changes it is a seed update rather
     than a page redeploy. -->

<oj-sp-general-overview-page
  id="integrationsPage"
  class="oj-sm-width-full rw-page-full"
  display-options.responsive-padding="off"
  page-title="[[$application.translations.appBundle.integrations_integrations]]"
  page-subtitle="[[$application.translations.appBundle.integrations_reference_catalogue_of_the_oracle_fusion_and]]">

  <div class="oj-flex oj-sm-flex-direction-column oj-sm-width-full oj-sm-gap-4x"
       slot="main">

    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-start oj-sm-flex-wrap oj-sm-gap-3x">
        <oj-form-layout max-columns="2" direction="row" label-edge="top" class="oj-flex-item">
          <oj-select-single label-hint="[[$application.translations.appBundle.integrations_area]]"
                            data="[[ $variables.areaOptions ]]"
                            value="{{ $variables.areaFilter }}"
                            item-text="label">
          </oj-select-single>
        </oj-form-layout>
        <oj-button chroming="borderless" on-oj-action="[[ $listeners.reload ]]">
          <span slot="startIcon" class="oj-ux-ico-refresh"></span>
          <span><oj-bind-text value="[[$application.translations.appBundle.common_refresh]]"></oj-bind-text></span>
        </oj-button>
      </div>

      <div class="oj-sm-padding-3x oj-sm-margin-3x-top rw-notice" role="status">
        <oj-bind-text value="[[$application.translations.appBundle.integrations_oracle_time_labor_is_the_system_of_record_th]]"></oj-bind-text>
      </div>
    </div>

    <!-- ══════════════════ Fusion connection ══════════════════
         The one thing on this page that actually calls out. It asks HCM for a
         single worker through VB's server-side proxy: the cheapest request that
         still proves routing, authentication and payload shape together.

         Separated from the catalogue above on purpose — that is reference text
         read from OC_TIME_LOOKUP, this touches a live system. -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-start oj-sm-flex-wrap oj-sm-gap-3x">
        <div>
          <h2 class="oj-typography-heading-xs oj-sm-margin-0"><oj-bind-text value="[[$application.translations.appBundle.integrations_fusion_connection]]"></oj-bind-text></h2>
          <p class="oj-typography-body-sm rw-metric-label oj-sm-margin-1x-top oj-sm-margin-0-bottom">
            <oj-bind-text value="[[$application.translations.appBundle.integrations_asks_hcm_for_one_worker_through_the_vb_proxy]]"></oj-bind-text>
          </p>
        </div>
        <oj-button chroming="callToAction" disabled="[[ $variables.probing ]]"
                   on-oj-action="[[ $listeners.testFusion ]]">
          <span slot="startIcon" class="oj-ux-ico-plug"></span>
          <span>
            <oj-bind-text value="[[ $page.functions.probeLabel($variables.probing) ]]"></oj-bind-text>
          </span>
        </oj-button>
      </div>

      <oj-bind-if test="[[ $variables.probeState === 'ok' ]]">
        <div class="oj-sm-padding-3x oj-sm-margin-3x-top rw-notice" role="status">
          <div class="oj-typography-body-md oj-typography-semi-bold"><oj-bind-text value="[[$application.translations.appBundle.integrations_connected]]"></oj-bind-text></div>
          <div class="oj-typography-body-sm oj-sm-margin-1x-top">
            <oj-bind-text value="[[ $variables.probeMessage ]]"></oj-bind-text>
          </div>
        </div>
      </oj-bind-if>

      <oj-bind-if test="[[ $variables.probeState === 'fail' ]]">
        <div class="oj-sm-padding-3x oj-sm-margin-3x-top rw-notice rw-notice-warning" role="alert">
          <div class="oj-typography-body-md oj-typography-semi-bold"><oj-bind-text value="[[$application.translations.appBundle.integrations_not_connected]]"></oj-bind-text></div>
          <div class="oj-typography-body-sm oj-sm-margin-1x-top">
            <oj-bind-text value="[[ $variables.probeMessage ]]"></oj-bind-text>
          </div>
        </div>
      </oj-bind-if>
    </div>

    <!-- ══════════════════ OTL readiness (INT-007) ══════════════
         An OTL time card is keyed on POET — Project / Organization /
         Expenditure type / Task. The module has P and T; O and E were added
         01-Aug-2026 and nothing populates them yet.

         Shown as a list rather than left to fail at push time because each gap
         is fixed by setting a value in Fusion, and whoever does that needs to
         know which projects and how many before they start. -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-start oj-sm-flex-wrap oj-sm-gap-3x">
        <div>
          <h2 class="oj-typography-heading-xs oj-sm-margin-0"><oj-bind-text value="[[$application.translations.appBundle.integrations_otl_push_readiness]]"></oj-bind-text></h2>
          <p class="oj-typography-body-sm rw-metric-label oj-sm-margin-1x-top oj-sm-margin-0-bottom">
            <oj-bind-text value="[[$application.translations.appBundle.integrations_a_project_can_only_be_pushed_to_oracle_time_]]"></oj-bind-text>
          </p>
        </div>
        <oj-button chroming="borderless" disabled="[[ $variables.busy ]]"
                   on-oj-action="[[ $listeners.loadPoet ]]">
          <span slot="startIcon" class="oj-ux-ico-refresh"></span>
          <span><oj-bind-text value="[[$application.translations.appBundle.integrations_check_readiness]]"></oj-bind-text></span>
        </oj-button>
      </div>

      <oj-bind-if test="[[ $variables.poet.length === 0 && !$variables.busy ]]">
        <div class="oj-typography-body-sm rw-metric-label oj-sm-margin-3x-top" role="status">
          <oj-bind-text value="[[$application.translations.appBundle.integrations_not_checked_yet_or_no_active_project_has_any]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <oj-bind-if test="[[ $variables.poet.length > 0 ]]">
        <div class="oj-sm-padding-3x oj-sm-margin-3x-top rw-notice rw-notice-warning"
             role="status">
          <oj-bind-text value="[[ $page.functions.poetSummary($variables.poet) ]]"></oj-bind-text>
        </div>

        <div class="rw-grid-scroll oj-sm-margin-3x-top">
          <oj-table aria-label="OTL push readiness by project"
                    data="[[ $variables.poetADP ]]"
                    layout="fixed"
                    horizontal-grid-visible="enabled"
                    selection-mode='{"row": "none", "column": "none"}'
                    columns='[
                      {"headerText":"Project","field":"projectNumber","width":120},
                      {"headerText":"Name","field":"projectName","weight":3,"minWidth":200},
                      {"headerText":"Chargeable tasks","field":"tasksChargeable","width":140},
                      {"headerText":"No expenditure type","field":"tasksNoExpType","width":170},
                      {"headerText":"Workers allocated","field":"workersAllocated","width":150},
                      {"headerText":"No expenditure org","field":"workersNoExpOrg","width":165},
                      {"headerText":"OTL","field":"otlReadiness","template":"readyCell","width":110}
                    ]'>
            <template slot="readyCell" data-oj-as="cell">
              <span :class="[[ $application.functions.outcomeClass(
                                 $page.functions.readinessOutcome(cell.row.otlReadiness)) ]]">
                <oj-bind-text value="[[ cell.row.otlReadiness ]]"></oj-bind-text>
              </span>
            </template>
          </oj-table>
        </div>
      </oj-bind-if>
    </div>

    <div class="oj-sm-padding-4x rw-metric">
      <h2 class="oj-typography-heading-xs oj-sm-margin-0 oj-sm-margin-3x-bottom">
        <oj-bind-text value="[[$application.translations.appBundle.integrations_catalogue]]"></oj-bind-text><oj-bind-text value="[[ $variables.rows.length ]]"></oj-bind-text>)
      </h2>

      <oj-bind-if test="[[ $variables.rows.length === 0 && !$variables.busy ]]">
        <div class="oj-typography-body-sm rw-metric-label" role="status">
          <oj-bind-text value="[[ $page.functions.emptyMessage($variables.rowsRaw) ]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <oj-bind-if test="[[ $variables.rows.length > 0 ]]">
        <div class="rw-grid-scroll">
          <oj-table aria-label="Integration catalogue"
                    data="[[ $variables.rowsADP ]]"
                    layout="fixed"
                    horizontal-grid-visible="enabled"
                    selection-mode='{"row": "none", "column": "none"}'
                    columns='[
                      {"headerText":"ID","field":"integrationId","width":110},
                      {"headerText":"Area","field":"area","width":140},
                      {"headerText":"Fusion source","field":"fusionSource","weight":2,"minWidth":170},
                      {"headerText":"Object / usage","field":"objectUsage","weight":2,"minWidth":170},
                      {"headerText":"REST resource","field":"restResource","weight":3,"minWidth":220},
                      {"headerText":"Load pattern","field":"loadPattern","width":150},
                      {"headerText":"Notes","field":"notes","weight":3,"minWidth":220}
                    ]'>
          </oj-table>
        </div>
      </oj-bind-if>
    </div>

    <oj-bind-if test="[[ $variables.busy ]]">
      <div class="oj-flex oj-sm-align-items-center oj-sm-gap-2x" role="status" aria-live="polite">
        <oj-progress-circle size="sm" value="-1"></oj-progress-circle>
        <span class="oj-typography-body-sm"><oj-bind-text value="[[$application.translations.appBundle.common_working]]"></oj-bind-text></span>
      </div>
    </oj-bind-if>

  </div>
</oj-sp-general-overview-page>
