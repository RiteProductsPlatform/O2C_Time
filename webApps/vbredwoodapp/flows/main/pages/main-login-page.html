<!-- O2C Timesheet Module — sign in -->

<div class="login-wrap">

  <div class="login-topbar">
    <div class="login-brand-texts">
      <span class="login-brand-title"><oj-bind-text value="[[$application.translations.appBundle.common_rite_digital]]"></oj-bind-text></span>
      <span class="login-brand-sub"><oj-bind-text value="[[$application.translations.appBundle.common_o2c_platform]]"></oj-bind-text></span>
    </div>
  </div>

  <div class="login-split">

    <!-- Left: what this application is for -->
    <div class="login-hero">
      <div class="login-hero-inner">
        <h1 class="login-hero-title"><oj-bind-text value="[[$application.translations.appBundle.login_timesheet_time_approval]]"></oj-bind-text></h1>
        <p class="login-hero-sub">
          <oj-bind-text value="[[$application.translations.appBundle.login_record_time_against_your_projects_submit_it_]]"></oj-bind-text>
        </p>

        <div class="login-hero-features">
          <div class="login-feature-item">
            <span class="login-feature-check">&#10003;</span>
            <oj-bind-text value="[[$application.translations.appBundle.login_pre_populated_from_your_work_pattern_and_cal]]"></oj-bind-text>
          </div>
          <div class="login-feature-item">
            <span class="login-feature-check">&#10003;</span>
            <oj-bind-text value="[[$application.translations.appBundle.login_weekly_submission_with_monthly_confirmation]]"></oj-bind-text>
          </div>
          <div class="login-feature-item">
            <span class="login-feature-check">&#10003;</span>
            <oj-bind-text value="[[$application.translations.appBundle.login_leave_loss_coverage_and_salary_stopping]]"></oj-bind-text>
          </div>
          <div class="login-feature-item">
            <span class="login-feature-check">&#10003;</span>
            <oj-bind-text value="[[$application.translations.appBundle.login_approved_time_flows_straight_into_revenue_ac]]"></oj-bind-text>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: the form -->
    <div class="login-form-panel">
      <div class="login-card">

        <div class="login-form-header">
          <div class="login-form-icon">
            <span class="oj-ux-ico-clock" style="font-size:26px; color:#1565C0;"></span>
          </div>
          <div>
            <div class="login-logo"><oj-bind-text value="[[$application.translations.appBundle.login_welcome_back]]"></oj-bind-text></div>
            <div class="login-sub"><oj-bind-text value="[[$application.translations.appBundle.login_sign_in_to_your_timesheet]]"></oj-bind-text></div>
          </div>
        </div>

        <oj-bind-if test="[[ $variables.errorMessage ]]">
          <div class="login-error" role="alert">
            <oj-bind-text value="[[ $variables.errorMessage ]]"></oj-bind-text>
          </div>
        </oj-bind-if>

        <!--
          NOT a <form on-submit>. That was the first attempt and the button did
          nothing at all: no request ever left the browser. on-click on a plain
          button is the binding this codebase already proves works — the shell
          nav uses it, and so does the main O2C application's own login.

          type="button" as well, so that even if this markup is later moved
          inside a form, Enter cannot trigger a native submit and reload the SPA.
        -->
        <div>

          <div class="login-field">
            <oj-input-text id="loginEmail"
              value="{{ $variables.email }}"
              label-hint="[[$application.translations.appBundle.common_email_address]]"
              label-edge="inside"
              required="true"
              autocomplete="username"
              placeholder="[[$application.translations.appBundle.login_you_rite_digital]]"
              on-keyup="[[$listeners.doLogin]]">
            </oj-input-text>
          </div>

          <div class="login-field">
            <!-- Enter anywhere in the credentials signs in. The chain ignores
                 every key but Enter, so this costs nothing when it is not one. -->
            <oj-input-password id="loginPassword"
              value="{{ $variables.password }}"
              label-hint="[[$application.translations.appBundle.common_password]]"
              label-edge="inside"
              required="true"
              autocomplete="current-password"
              on-keyup="[[$listeners.doLogin]]">
            </oj-input-password>
          </div>

          <!-- oj-bind-text MUST be wrapped in a span inside a button. Unwrapped
               it renders nothing and you get a button with no label — which is
               exactly what happened here. -->
          <button type="button" class="btn-login"
                  :disabled="[[ $variables.isSigningIn ]]"
                  on-click="[[$listeners.doLogin]]">
            <span>
              <oj-bind-text value="[[ $page.functions.signInLabel($variables.isSigningIn) ]]"></oj-bind-text>
            </span>
          </button>
        </div>

        <div class="login-alt">
          <oj-bind-text value="[[$application.translations.appBundle.login_first_time_here_or_been_invited]]"></oj-bind-text>
          <button type="button" class="login-alt-link"
                  on-click="[[$listeners.goToSetPassword]]"><oj-bind-text value="[[$application.translations.appBundle.common_set_your_password]]"></oj-bind-text></button>
        </div>

      </div>
    </div>

  </div>
</div>
