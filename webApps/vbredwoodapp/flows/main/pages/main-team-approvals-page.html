<!-- PAGE-003 Team Approvals — manager landing (PER-003)

     The landing page answers three questions in order:
       1. Which of my projects still need attention this month?
       2. What are the cut-offs I am working against?  (FLD-036)
       3. Is anything waiting on me personally — retro adjustments?  (ACT-021)

     Approve/reject happen one level down (PAGE-004 / PAGE-005); this page is
     navigation and triage. -->

<oj-sp-general-overview-page
  id="teamApprovalsPage"
  class="oj-sm-width-full rw-page-full"
  display-options.responsive-padding="off"
  page-title="[[$application.translations.appBundle.common_team_approvals]]"
  page-subtitle="[[$application.translations.appBundle.team_approvals_open_a_project_to_review_and_approve_your_te]]">

  <div class="oj-flex oj-sm-flex-direction-column oj-sm-width-full oj-sm-gap-4x"
       slot="main">

    <!-- ══════════════════ Filters ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-start oj-sm-flex-wrap oj-sm-gap-3x">
        <oj-form-layout max-columns="3" direction="row" label-edge="top" class="oj-flex-item">
          <oj-select-single label-hint="[[$application.translations.appBundle.team_approvals_month_year]]"
                            data="[[ $application.variables.periodOptions ]]"
                            value="{{ $variables.periodId }}"
                            item-text="label">
          </oj-select-single>

          <!-- FLD-028. A picker, not a free-text box: the set of projects is
               known — they are the ones this manager owns for the month, and
               the prototype offers exactly that list with an "All projects"
               entry. Typing a name that matches nothing looked like an empty
               team rather than a typo. -->
          <oj-select-single label-hint="[[$application.translations.appBundle.common_project]]"
                            data="[[ $variables.projectOptions ]]"
                            value="{{ $variables.projectPick }}"
                            item-text="label"
                            placeholder="[[$application.translations.appBundle.team_approvals_all_projects]]">
            <template slot="noData">
              <span class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.team_approvals_no_projects_this_month]]"></oj-bind-text></span>
            </template>
          </oj-select-single>

          <!-- No manager switcher. ACT-011 lets a manager act as another to
               review that team, but getManagers returns the reporting TREE, so
               a senior manager was offered their own subordinates — which is
               not what the requirement is about and is not this person's work.
               Removed by decision (04-Aug-2026); the read-only label stays.
               To restore it, the query has to be narrowed first. -->
          <oj-label-value>
            <span slot="label" class="oj-label-nowrap">
              <oj-bind-text value="[[$application.translations.appBundle.team_approvals_reviewing_as]]"></oj-bind-text>
            </span>
            <span slot="value" class="oj-typography-body-md">
              <oj-bind-text value="[[ $application.variables.actingManagerId ]]"></oj-bind-text>
            </span>
          </oj-label-value>
        </oj-form-layout>

        <div class="oj-flex oj-sm-gap-2x">
          <oj-button chroming="borderless" on-oj-action="[[ $listeners.toggleCutoffs ]]">
            <span slot="startIcon" class="oj-ux-ico-calendar-clock"></span>
            <span><oj-bind-text value="[[$application.translations.appBundle.team_approvals_all_cut_offs]]"></oj-bind-text></span>
          </oj-button>
          <oj-button chroming="borderless" on-oj-action="[[ $listeners.reload ]]">
            <span slot="startIcon" class="oj-ux-ico-refresh"></span>
            <span><oj-bind-text value="[[$application.translations.appBundle.common_refresh]]"></oj-bind-text></span>
          </oj-button>
        </div>
      </div>
    </div>

    <!-- ══════════════════ Delivery cut-off (FLD-036) ══════════════════ -->
    <!-- Only the delivery cut-off at month level: it is the one this page acts
         against — the date by which the manager must approve. The weekly
         cut-off belongs beside a WEEK, so it is shown on the drill-down where
         weeks are listed, not here. Finance, book closure, MEC, client and
         payroll drive downstream processes the manager cannot influence from
         this screen, so they were noise. -->
    <oj-bind-if test="[[ $variables.showCutoffs && $variables.cutoffs ]]">
      <div class="oj-sm-padding-4x rw-metric">
        <h2 class="oj-typography-heading-xs oj-sm-margin-0 oj-sm-margin-3x-bottom">
          <oj-bind-text value="[[$application.translations.appBundle.team_approvals_cut_off_for]]"></oj-bind-text> <oj-bind-text value="[[ $variables.cutoffs.period_name ]]"></oj-bind-text>
        </h2>
        <oj-label-value>
          <span slot="label" class="oj-label-nowrap"><oj-bind-text value="[[$application.translations.appBundle.team_approvals_delivery_cut_off]]"></oj-bind-text></span>
          <span slot="value" class="oj-typography-body-md">
            <oj-bind-text value="[[ $variables.cutoffs.delivery_cutoff || '—' ]]"></oj-bind-text>
          </span>
        </oj-label-value>
        <div class="oj-typography-body-sm rw-metric-label oj-sm-margin-3x-top">
          <oj-bind-text value="[[$application.translations.appBundle.team_approvals_approve_every_week_of_the_month_before_this_]]"></oj-bind-text>
        </div>
      </div>
    </oj-bind-if>

    <!-- ══════════════════ Advance approval (PROC-010) ══════════════════ -->
    <!-- A future month can be advance-approved at month level; the whole month is
         then tagged 'Advance closure' and later actuals arrive as flagged
         adjustments. -->
    <oj-bind-if test="[[ $variables.isFuturePeriod ]]">
      <div class="oj-sm-padding-4x rw-metric">
        <h2 class="oj-typography-heading-xs oj-sm-margin-0"><oj-bind-text value="[[$application.translations.appBundle.team_approvals_advance_approval]]"></oj-bind-text></h2>
        <p class="oj-typography-body-sm rw-metric-label oj-sm-margin-1x-top">
          <oj-bind-text value="[[$application.translations.appBundle.team_approvals_this_month_has_not_started_yet_you_can_advan]]"></oj-bind-text> <strong><oj-bind-text value="[[$application.translations.appBundle.common_advance_closure]]"></oj-bind-text></strong><oj-bind-text value="[[$application.translations.appBundle.team_approvals_defaulted_hours_are_treated_as_approved_and_]]"></oj-bind-text>
        </p>
        <oj-form-layout max-columns="2" direction="row" label-edge="top">
          <oj-select-single label-hint="[[$application.translations.appBundle.common_project]]"
                            data="[[ $variables.projectsAllADP ]]"
                            value="{{ $variables.advanceProjectId }}"
                            item-text="projectName">
          </oj-select-single>
        </oj-form-layout>
        <div class="oj-flex oj-sm-justify-content-flex-end oj-sm-margin-2x-top">
          <oj-button chroming="callToAction"
                     disabled="[[ $variables.busy || !$variables.advanceProjectId ]]"
                     on-oj-action="[[ $listeners.advanceApprove ]]">
            <span><oj-bind-text value="[[$application.translations.appBundle.team_approvals_advance_approve_month]]"></oj-bind-text></span>
          </oj-button>
        </div>
      </div>
    </oj-bind-if>

    <!-- ══════════════════ Retro adjustments awaiting me (ACT-021) ══════════════════ -->
    <oj-bind-if test="[[ $variables.adjustments.length > 0 ]]">
      <div class="oj-sm-padding-4x rw-metric">
        <h2 class="oj-typography-heading-xs oj-sm-margin-0">
          <oj-bind-text value="[[$application.translations.appBundle.team_approvals_backdated_changes_awaiting_your_approval]]"></oj-bind-text><oj-bind-text value="[[ $variables.adjustments.length ]]"></oj-bind-text>)
        </h2>
        <p class="oj-typography-body-sm rw-metric-label oj-sm-margin-1x-top">
          <oj-bind-text value="[[$application.translations.appBundle.team_approvals_each_row_is_one_day_approving_posts_a_revers]]"></oj-bind-text>
        </p>

        <div class="rw-grid-scroll oj-sm-margin-3x-top">
          <oj-table aria-label="Backdated adjustments awaiting approval"
                    data="[[ $variables.adjustmentsADP ]]"
                    layout="fixed"
                    horizontal-grid-visible="enabled"
                    selection-mode='{"row": "none", "column": "none"}'
                    columns='[
                      {"headerText":"Employee","field":"employeeName","weight":2,"minWidth":150},
                      {"headerText":"Date","field":"workDate","template":"dateCell","width":120},
                      {"headerText":"Reversal — old","field":"oldProjectName","template":"oldCell","weight":3},
                      {"headerText":"Adjustment — new","field":"newProjectName","template":"newCell","weight":3},
                      {"headerText":"Net","field":"netHours","template":"netCell","width":80},
                      {"headerText":"Reason","field":"reason","weight":2},
                      {"headerText":"Waiting on","field":"status","template":"waitCell","width":170},
                      {"headerText":"","field":"adjustmentId","template":"actionCell","width":110,"sortable":"disabled"}
                    ]'>

            <template slot="dateCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtDate(cell.row.workDate) ]]"></oj-bind-text></span>
            </template>

            <template slot="oldCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ cell.row.oldProjectName ]]"></oj-bind-text> /
                <oj-bind-text value="[[ cell.row.oldTaskCode ]]"></oj-bind-text>
                <oj-bind-text value="[[$application.translations.appBundle.my_timesheet_text]]"></oj-bind-text><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.oldHours) ]]"></oj-bind-text>)
              </span>
            </template>

            <template slot="newCell" data-oj-as="cell">
              <span>
                <oj-bind-if test="[[ cell.row.newProjectName ]]">
                  <oj-bind-text value="[[ cell.row.newProjectName ]]"></oj-bind-text> /
                  <oj-bind-text value="[[ cell.row.newTaskCode ]]"></oj-bind-text>
                  (+<oj-bind-text value="[[ $application.functions.fmtHours(cell.row.newHours) ]]"></oj-bind-text>)
                </oj-bind-if>
                <oj-bind-if test="[[ !cell.row.newProjectName ]]">
                  <span class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.common_reversal_only]]"></oj-bind-text></span>
                </oj-bind-if>
              </span>
            </template>

            <template slot="netCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.netHours) ]]"></oj-bind-text></span>
            </template>

            <!-- Makes it obvious whether this manager is the blocker or the other
                 side is (RA-014: both managers see the row). -->
            <template slot="waitCell" data-oj-as="cell">
              <span class="rw-metric-label">
                <oj-bind-text value="[[ $page.functions.waitingOn(cell.row) ]]"></oj-bind-text>
              </span>
            </template>

            <template slot="actionCell" data-oj-as="cell">
              <!-- Disabled once this manager has done their part: offering an
                   action the server would refuse is worse than not offering it. -->
              <oj-button chroming="outlined"
                         disabled="[[ $variables.busy || $page.functions.alreadyActed(cell.row) ]]"
                         :aria-label="[[ $page.functions.approveAdjLabel(cell.row.employeeName) ]]"
                         on-oj-action="[[ $listeners.approveAdjustment ]]">
                <span><oj-bind-text value="[[$application.translations.appBundle.common_approve]]"></oj-bind-text></span>
              </oj-button>
            </template>
          </oj-table>
        </div>
      </div>
    </oj-bind-if>

    <!-- ══════════════════ Projects managed ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <h2 class="oj-typography-heading-xs oj-sm-margin-0 oj-sm-margin-3x-bottom">
        <oj-bind-text value="[[$application.translations.appBundle.team_approvals_projects_for]]"></oj-bind-text>
        <oj-bind-text value="[[ $application.variables.selectedPeriodName ]]"></oj-bind-text>
      </h2>

      <oj-bind-if test="[[ $variables.projects.length === 0 && !$variables.busy ]]">
        <div class="oj-typography-body-sm rw-metric-label" role="status">
          <oj-bind-text value="[[ $page.functions.emptyMessage($variables.projectsRaw) ]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <oj-bind-if test="[[ $variables.projects.length > 0 ]]">
        <div class="rw-grid-scroll">
          <oj-table aria-label="Projects you manage"
                    data="[[ $variables.projectsADP ]]"
                    layout="fixed"
                    horizontal-grid-visible="enabled"
                    selection-mode='{"row": "none", "column": "none"}'
                    columns='[
                      {"headerText":"Project","field":"projectName","template":"projCell","weight":3,"minWidth":200},
                      {"headerText":"Number","field":"projectNumber","width":120},
                      {"headerText":"TS start","field":"tsStart","template":"startCell","width":115},
                      {"headerText":"TS end","field":"tsEnd","template":"endCell","width":115},
                      {"headerText":"Team","field":"employees","template":"teamCell","weight":2,"minWidth":170},
                      {"headerText":"Billable","field":"billableHours","template":"billCell","width":110},
                      {"headerText":"Non-bill","field":"nonBillableHours","template":"nonBillCell","width":110},
                      {"headerText":"Leave","field":"leaveHours","template":"leaveCell","width":85},
                      {"headerText":"Status","field":"monthStatus","template":"statusCell","width":170},
                      {"headerText":"","field":"projectId","template":"actionCell","width":110,"sortable":"disabled"}
                    ]'>

            <template slot="projCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ cell.row.projectName ]]"></oj-bind-text>
                <oj-bind-if test="[[ cell.row.revenueModel === 'FCP' && cell.row.leaveLossFlag === 'Y' ]]">
                  <span class="rw-flag rw-flag-advance" title="Fixed Capacity Project with leave loss coverage — absences need a covering colleague (PAGE-006)."><oj-bind-text value="[[$application.translations.appBundle.team_approvals_fcp_leave_loss]]"></oj-bind-text></span>
                </oj-bind-if>
                <oj-bind-if test="[[ cell.row.pendingAdjustments > 0 ]]">
                  <span class="rw-flag rw-flag-defaulted">
                    <oj-bind-text value="[[ cell.row.pendingAdjustments ]]"></oj-bind-text> <oj-bind-text value="[[$application.translations.appBundle.team_approvals_adj]]"></oj-bind-text>
                  </span>
                </oj-bind-if>
              </span>
            </template>

            <template slot="startCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtDate(cell.row.tsStart) ]]"></oj-bind-text></span>
            </template>
            <template slot="endCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtDate(cell.row.tsEnd) ]]"></oj-bind-text></span>
            </template>

            <!-- Approved / total is the number that tells the manager whether
                 Confirm Month is even reachable (RULE-020).

                 A '1 rejected' badge sat here until 14-Aug-2026 and was
                 removed with the project-level 'Rejected' status it sat beside
                 (see V_OC_TS_MGR_PROJECTS in db/08_views.sql). A rejection
                 belongs to one employee's week, with a reason and a named
                 manager; surfacing it on the PROJECT row put a per-person
                 event one grain too high, where it read as something being
                 wrong with the project. The monthly summary one click in is
                 the right place for it, and still shows it — that page lists
                 employees, so the count is about the things on screen.
                 rejectedEmployees is still carried in the row data; nothing
                 needs re-fetching if it is ever wanted back. -->
            <template slot="teamCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ cell.row.approvedEmployees ]]"></oj-bind-text> /
                <oj-bind-text value="[[ cell.row.employees ]]"></oj-bind-text> <oj-bind-text value="[[$application.translations.appBundle.team_approvals_approved]]"></oj-bind-text>
              </span>
            </template>

            <template slot="billCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.billableHours) ]]"></oj-bind-text></span>
            </template>
            <template slot="nonBillCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.nonBillableHours) ]]"></oj-bind-text></span>
            </template>
            <template slot="leaveCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.leaveHours) ]]"></oj-bind-text></span>
            </template>

            <template slot="statusCell" data-oj-as="cell">
              <span>
                <span :class="[[ $application.functions.outcomeClass(cell.row.monthStatus) ]]">
                  <oj-bind-text value="[[ cell.row.monthStatus ]]"></oj-bind-text>
                </span>
                <oj-bind-if test="[[ cell.row.confirmId ]]">
                  <span class="rw-flag rw-flag-adjustment">
                    <oj-bind-text value="[[$application.translations.appBundle.team_approvals_confirmed]]"></oj-bind-text><oj-bind-if test="[[ cell.row.confirmType === 'Advance closure' ]]"> <oj-bind-text value="[[$application.translations.appBundle.team_approvals_advance]]"></oj-bind-text></oj-bind-if>
                  </span>
                </oj-bind-if>
              </span>
            </template>

            <template slot="actionCell" data-oj-as="cell">
              <oj-button chroming="outlined"
                         :aria-label="[[ $page.functions.openProjectLabel(cell.row.projectName) ]]"
                         on-oj-action="[[ $listeners.openProject ]]">
                <span><oj-bind-text value="[[$application.translations.appBundle.common_open]]"></oj-bind-text></span>
              </oj-button>
            </template>
          </oj-table>
        </div>
      </oj-bind-if>
    </div>

    <oj-bind-if test="[[ $variables.busy ]]">
      <div class="oj-flex oj-sm-align-items-center oj-sm-gap-2x" role="status" aria-live="polite">
        <oj-progress-circle size="sm" value="-1"></oj-progress-circle>
        <span class="oj-typography-body-sm"><oj-bind-text value="[[$application.translations.appBundle.common_working]]"></oj-bind-text></span>
      </div>
    </oj-bind-if>

  </div>

  <!-- ══════════════════ Confirmation ══════════════════ -->
  <!-- oj-dialog opened via Actions.callComponentMethod, not window.confirm:
       SES blocks browser globals inside chains (knowledge/14 §7). -->
  <oj-dialog id="advanceApproveDlg" dialog-title="[[$application.translations.appBundle.team_approvals_advance_approve_month]]" cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-md">
        <oj-bind-text value="[[ $variables.confirmMessage ]]"></oj-bind-text>
      </p>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.cancelAdvanceApprove ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction" disabled="[[ $variables.busy ]]"
                 on-oj-action="[[ $listeners.confirmAdvanceApprove ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.team_approvals_advance_approve]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

</oj-sp-general-overview-page>
