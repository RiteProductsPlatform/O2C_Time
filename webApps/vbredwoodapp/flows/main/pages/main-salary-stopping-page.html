<!-- PAGE-007 Salary Stopping Tool (PER-003 manager, PER-004 admin)

     RULE-016: only a DEFAULTED timesheet stops salary. A week merely awaiting
     approval does not — the employee did their part.

     Since the 30-Jul-2026 revision a manager missing the delivery cut-off also
     produces 'Defaulted', so the hold list is driven by DEFAULTED_BY = EMPLOYEE.
     An employee is never held because their manager was slow.

     RA-012 (what happens when the release window expires — forfeit or escalate)
     is still open, so expired holds are flagged here and never auto-resolved. -->

<oj-sp-general-overview-page
  id="salaryStoppingPage"
  class="oj-sm-width-full rw-page-full"
  display-options.responsive-padding="off"
  page-title="[[$application.translations.appBundle.salary_stopping_salary_stopping]]"
  page-subtitle="[[$application.translations.appBundle.salary_stopping_employees_whose_timesheet_defaulted_and_the_]]">

  <div class="oj-flex oj-sm-flex-direction-column oj-sm-width-full oj-sm-gap-4x"
       slot="main">

    <!-- ══════════════════ Period + actions ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <div class="oj-flex oj-sm-justify-content-space-between oj-sm-align-items-start oj-sm-flex-wrap oj-sm-gap-3x">
        <oj-form-layout max-columns="2" direction="row" label-edge="top" class="oj-flex-item">
          <oj-select-single label-hint="[[$application.translations.appBundle.common_month]]"
                            data="[[ $application.variables.periodOptions ]]"
                            value="{{ $variables.periodId }}"
                            item-text="label">
          </oj-select-single>
        </oj-form-layout>

        <div class="oj-flex oj-sm-gap-2x">
          <oj-button chroming="borderless" on-oj-action="[[ $listeners.reload ]]">
            <span slot="startIcon" class="oj-ux-ico-refresh"></span>
            <span><oj-bind-text value="[[$application.translations.appBundle.common_refresh]]"></oj-bind-text></span>
          </oj-button>
          <oj-button chroming="outlined"
                     disabled="[[ $variables.busy || !$variables.periodId ]]"
                     on-oj-action="[[ $listeners.runJob ]]">
            <span><oj-bind-text value="[[$application.translations.appBundle.salary_stopping_re_evaluate_holds]]"></oj-bind-text></span>
          </oj-button>
        </div>
      </div>

      <div class="oj-flex oj-sm-flex-wrap oj-sm-gap-6x oj-sm-margin-4x-top">
        <div class="oj-flex-item">
          <div class="rw-metric-value"><oj-bind-text value="[[ $variables.heldCount ]]"></oj-bind-text></div>
          <div class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.salary_stopping_salary_held]]"></oj-bind-text></div>
        </div>
        <div class="oj-flex-item">
          <div class="rw-metric-value"><oj-bind-text value="[[ $variables.releasedCount ]]"></oj-bind-text></div>
          <div class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.salary_stopping_released]]"></oj-bind-text></div>
        </div>
        <div class="oj-flex-item">
          <div class="rw-metric-value"><oj-bind-text value="[[ $variables.expiredCount ]]"></oj-bind-text></div>
          <div class="rw-metric-label"><oj-bind-text value="[[$application.translations.appBundle.salary_stopping_past_the_release_window]]"></oj-bind-text></div>
        </div>
      </div>

      <oj-bind-if test="[[ $variables.expiredCount > 0 ]]">
        <div class="oj-sm-padding-3x oj-sm-margin-3x-top rw-notice rw-notice-warning" role="status">
          <oj-bind-text value="[[ $variables.expiredCount ]]"></oj-bind-text>
          <oj-bind-text value="[[$application.translations.appBundle.salary_stopping_hold_s_are_past_the_release_window_what_shou]]"></oj-bind-text>
        </div>
      </oj-bind-if>
    </div>

    <!-- ══════════════════ Holds ══════════════════ -->
    <div class="oj-sm-padding-4x rw-metric">
      <h2 class="oj-typography-heading-xs oj-sm-margin-0 oj-sm-margin-3x-bottom"><oj-bind-text value="[[$application.translations.appBundle.salary_stopping_holds]]"></oj-bind-text></h2>

      <oj-bind-if test="[[ $variables.holds.length === 0 && !$variables.busy ]]">
        <div class="oj-typography-body-sm rw-metric-label" role="status">
          <oj-bind-text value="[[$application.translations.appBundle.salary_stopping_no_defaulted_timesheets_every_timesheet_was_]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <oj-bind-if test="[[ $variables.holds.length > 0 ]]">
        <div class="rw-grid-scroll">
          <oj-table aria-label="Salary holds"
                    data="[[ $variables.holdsADP ]]"
                    layout="fixed"
                    horizontal-grid-visible="enabled"
                    selection-mode='{"row": "none", "column": "none"}'
                    columns='[
                      {"headerText":"Employee","field":"employeeName","template":"empCell","weight":3,"minWidth":200},
                      {"headerText":"Country","field":"baseCountry","width":110},
                      {"headerText":"Weeks","field":"weeksSplit","template":"weeksCell","weight":2,"minWidth":170},
                      {"headerText":"Applied","field":"appliedHours","template":"appliedCell","width":100},
                      {"headerText":"Default","field":"defaultHours","template":"defaultCell","width":100},
                      {"headerText":"Status","field":"salaryStatus","template":"statusCell","width":160},
                      {"headerText":"Window","field":"windowExpiresOn","template":"windowCell","width":150},
                      {"headerText":"","field":"holdId","template":"actionCell","width":230,"sortable":"disabled"}
                    ]'>

            <template slot="empCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ cell.row.employeeName ]]"></oj-bind-text>
                <div class="oj-typography-body-xs rw-metric-label">
                  <oj-bind-text value="[[ cell.row.employeeId ]]"></oj-bind-text>
                  <oj-bind-if test="[[ cell.row.workerType === 'Contractor' ]]">
                    <oj-bind-text value="[[$application.translations.appBundle.salary_stopping_contractor]]"></oj-bind-text>
                  </oj-bind-if>
                </div>
              </span>
            </template>

            <template slot="weeksCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ cell.row.weeksDefaulted ]]"></oj-bind-text> <oj-bind-text value="[[$application.translations.appBundle.salary_stopping_defaulted_of]]"></oj-bind-text> <oj-bind-text value="[[ cell.row.weeksTotal ]]"></oj-bind-text>
                <div class="oj-typography-body-xs rw-metric-label">
                  <oj-bind-text value="[[ cell.row.weeksSubmitted ]]"></oj-bind-text> <oj-bind-text value="[[$application.translations.appBundle.salary_stopping_submitted]]"></oj-bind-text>
                </div>
              </span>
            </template>

            <template slot="appliedCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.appliedHours) ]]"></oj-bind-text></span>
            </template>
            <template slot="defaultCell" data-oj-as="cell">
              <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.defaultHours) ]]"></oj-bind-text></span>
            </template>

            <template slot="statusCell" data-oj-as="cell">
              <span :class="[[ $application.functions.outcomeClass(cell.row.salaryStatus) ]]">
                <oj-bind-text value="[[ cell.row.salaryStatus ]]"></oj-bind-text>
              </span>
            </template>

            <template slot="windowCell" data-oj-as="cell">
              <span>
                <oj-bind-text value="[[ $application.functions.fmtDate(cell.row.windowExpiresOn) ]]"></oj-bind-text>
                <oj-bind-if test="[[ cell.row.windowExpired === 'Y' && cell.row.salaryStatus === 'Held' ]]">
                  <span class="rw-flag rw-flag-reversal"><oj-bind-text value="[[$application.translations.appBundle.salary_stopping_expired]]"></oj-bind-text></span>
                </oj-bind-if>
              </span>
            </template>

            <template slot="actionCell" data-oj-as="cell">
              <div class="oj-flex oj-sm-gap-1x oj-sm-flex-wrap">
                <oj-button chroming="borderless"
                           :aria-label="[[ $page.functions.weeksLabel(cell.row.employeeName) ]]"
                           on-oj-action="[[ $listeners.viewWeeks ]]">
                  <span><oj-bind-text value="[[$application.translations.appBundle.common_weeks]]"></oj-bind-text></span>
                </oj-button>

                <oj-bind-if test="[[ cell.row.salaryStatus === 'Held' ]]">
                  <oj-button chroming="borderless"
                             :aria-label="[[ $page.functions.correctLabel(cell.row.employeeName) ]]"
                             on-oj-action="[[ $listeners.editDefaulted ]]">
                    <span><oj-bind-text value="[[$application.translations.appBundle.common_correct]]"></oj-bind-text></span>
                  </oj-button>
                  <oj-button chroming="outlined" disabled="[[ $variables.busy ]]"
                             :aria-label="[[ $page.functions.releaseLabel(cell.row.employeeName) ]]"
                             on-oj-action="[[ $listeners.openRelease ]]">
                    <span><oj-bind-text value="[[$application.translations.appBundle.salary_stopping_release]]"></oj-bind-text></span>
                  </oj-button>
                </oj-bind-if>
              </div>
            </template>
          </oj-table>
        </div>
      </oj-bind-if>
    </div>

    <oj-bind-if test="[[ $variables.busy ]]">
      <div class="oj-flex oj-sm-align-items-center oj-sm-gap-2x" role="status" aria-live="polite">
        <oj-progress-circle size="sm" value="-1"></oj-progress-circle>
        <span class="oj-typography-body-sm"><oj-bind-text value="[[$application.translations.appBundle.common_working]]"></oj-bind-text></span>
      </div>
    </oj-bind-if>

  </div>

  <!-- ══════════════════ Weeks breakdown (#3) ══════════════════ -->
  <oj-dialog id="weeksDlg" dialog-title="[[$application.translations.appBundle.salary_stopping_weeks_breakdown]]" cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-sm rw-metric-label">
        <oj-bind-text value="[[ $variables.weeksLabel ]]"></oj-bind-text> <oj-bind-text value="[[$application.translations.appBundle.salary_stopping_which_weeks_were_filed_and_which_defaulted_m]]"></oj-bind-text>
      </p>

      <div class="rw-grid-scroll">
        <oj-table aria-label="Weeks for this employee"
                  data="[[ $variables.weekRowsADP ]]"
                  layout="fixed"
                  horizontal-grid-visible="enabled"
                  selection-mode='{"row": "none", "column": "none"}'
                  columns='[
                    {"headerText":"Week","field":"weekIndex","template":"wCell","weight":2,"minWidth":170},
                    {"headerText":"Status","field":"weekStatus","template":"wStatusCell","width":170},
                    {"headerText":"Applied","field":"appliedHours","template":"wAppliedCell","width":100},
                    {"headerText":"Default","field":"defaultHours","template":"wDefaultCell","width":100},
                    {"headerText":"Total","field":"totalHours","template":"wTotalCell","width":95}
                  ]'>
          <template slot="wCell" data-oj-as="cell">
            <span>
              <oj-bind-text value="[[$application.translations.appBundle.common_week]]"></oj-bind-text> <oj-bind-text value="[[ cell.row.weekIndex ]]"></oj-bind-text>
              <div class="oj-typography-body-xs rw-metric-label">
                <oj-bind-text value="[[ cell.row.weekRange ]]"></oj-bind-text>
              </div>
            </span>
          </template>
          <template slot="wStatusCell" data-oj-as="cell">
            <span>
              <span :class="[[ $application.functions.statusClass(cell.row.weekStatus) ]]">
                <oj-bind-text value="[[ cell.row.weekStatus ]]"></oj-bind-text>
              </span>
              <oj-bind-if test="[[ cell.row.lockedFlag === 'Y' ]]">
                <span class="rw-flag rw-flag-defaulted" title="Locked to the employee — only a manager can edit it."><oj-bind-text value="[[$application.translations.appBundle.salary_stopping_locked]]"></oj-bind-text></span>
              </oj-bind-if>
            </span>
          </template>
          <template slot="wAppliedCell" data-oj-as="cell">
            <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.appliedHours) ]]"></oj-bind-text></span>
          </template>
          <template slot="wDefaultCell" data-oj-as="cell">
            <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.defaultHours) ]]"></oj-bind-text></span>
          </template>
          <template slot="wTotalCell" data-oj-as="cell">
            <span><oj-bind-text value="[[ $application.functions.fmtHours(cell.row.totalHours) ]]"></oj-bind-text></span>
          </template>
        </oj-table>
      </div>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.closeWeeks ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_close]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

  <!-- ══════════════════ Release dialog (ACT-026) ══════════════════ -->
  <oj-dialog id="releaseDlg" dialog-title="[[$application.translations.appBundle.salary_stopping_release_the_salary_hold]]"
             cancel-behavior="icon">
    <div slot="body">
      <p class="oj-typography-body-sm rw-metric-label">
        <oj-bind-text value="[[ $variables.releaseLabel ]]"></oj-bind-text>
      </p>

      <!-- Said up front rather than after a refused submit: the defaulted week
           has to be corrected before the hold can go (ACT-026 precondition). -->
      <oj-bind-if test="[[ $variables.releaseBlocked ]]">
        <div class="oj-sm-padding-3x rw-notice rw-notice-warning" role="alert">
          <oj-bind-text value="[[$application.translations.appBundle.salary_stopping_this_employee_still_has_a_defaulted_week_cor]]"></oj-bind-text>
        </div>
      </oj-bind-if>

      <oj-form-layout label-edge="top" max-columns="1">
        <oj-text-area label-hint="[[$application.translations.appBundle.common_remarks]]" rows="3"
                      value="{{ $variables.releaseRemarks }}"
                      placeholder="[[$application.translations.appBundle.salary_stopping_why_is_the_hold_being_released]]">
        </oj-text-area>
      </oj-form-layout>
    </div>
    <div slot="footer">
      <oj-button on-oj-action="[[ $listeners.closeRelease ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.common_cancel]]"></oj-bind-text></span>
      </oj-button>
      <oj-button chroming="callToAction"
                 disabled="[[ $variables.busy || $variables.releaseBlocked ]]"
                 on-oj-action="[[ $listeners.doRelease ]]">
        <span><oj-bind-text value="[[$application.translations.appBundle.salary_stopping_release_hold]]"></oj-bind-text></span>
      </oj-button>
    </div>
  </oj-dialog>

</oj-sp-general-overview-page>
