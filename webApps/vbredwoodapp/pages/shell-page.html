<!-- O2C Timesheet Module — application shell -->

<!--
  The styles are inline here, not in shell-page.css, deliberately and to match
  the O2C main application: they describe the frame this file draws, so the two
  are edited together. Per-PAGE styling stays in the page's own .css file.
-->
<style>
  /* ── Redwood design tokens ── */
  :root {
    --rw-coal:     #2a2c33;
    --rw-red:      #485053;
    --rw-red-hov:  #374151;
    --rw-forest:   #1f6a4a;
    --rw-oyster:   #f6f6f4;
    --rw-paper:    #ffffff;
    --rw-slate:    #5b5d65;
    --rw-ink-2:    #3a3c44;
    --rw-border:   #dcdbd7;
    --rw-border-2: #eceae6;
    --rw-hover:    #f0efeb;
    --rw-focus:    rgba(69,79,82,0.22);
    --rw-success:  #1f6a4a;
    --rw-warning:  #a26a0a;
    --rw-danger:   #a73d2f;
    --rw-info:     #1f5d83;
    --shell-header-height: 56px;
  }

  /* ── Shell frame ── */
  .rw-shell { display:flex; height:100vh; overflow:hidden; position:relative; }

  /* Signed out: no chrome at all, so the login page owns the viewport. Driven
     by one class on the parent rather than oj-bind-if around each part, so
     there is a single condition to get wrong instead of three. */
  .rw-shell.shell-guest .rw-sidebar,
  .rw-shell.shell-guest .rw-topbar { display:none; }

  /* ── Right panel: topbar over scrollable content ── */
  .rw-right-panel { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }

  .rw-topbar { height:var(--shell-header-height); min-height:var(--shell-header-height);
               background:#3a3530; border-bottom:3px solid #a23541;
               display:flex; align-items:center; justify-content:space-between;
               padding:0 20px; gap:12px; flex-shrink:0; }
  .rw-topbar-left  { display:flex; align-items:center; gap:12px; min-width:0; }
  .rw-topbar-title { font-size:15px; font-weight:600; color:#fff; letter-spacing:0.01em; white-space:nowrap; }
  .rw-topbar-right { display:flex; align-items:center; gap:12px; }
  .rw-topbar [class*="oj-ux-ico"],
  .rw-topbar [class*="oj-ux-ico"]::before { color:rgba(255,255,255,0.85); }

  .rw-topbar-hamburger { background:transparent; border:none; color:rgba(255,255,255,0.85);
                         cursor:pointer; font-size:18px; padding:6px 8px; border-radius:3px;
                         line-height:1; display:flex; align-items:center; font-family:inherit; }
  .rw-topbar-hamburger:hover { background:rgba(255,255,255,0.10); color:#fff; }

  /* Period and acting-manager selectors sit in the topbar because they are
     context for every page, not a control belonging to any one of them. */
  .rw-topbar-context { display:flex; align-items:center; gap:8px; }
  .rw-topbar-context oj-select-single { min-width:150px; }
  .rw-topbar-context .oj-text-field-container {
    --oj-text-field-height: 30px;
    --oj-text-field-bg-color: rgba(255,255,255,0.10);
    --oj-text-field-border-color: rgba(255,255,255,0.25);
    --oj-text-field-text-color: #fff;
  }

  .rw-user-badge  { display:flex; align-items:center; gap:8px; padding:4px 10px 4px 4px;
                    border-radius:3px; }
  .rw-user-avatar { width:30px; height:30px; border-radius:50%; background:#3b82f6; color:#fff;
                    font-size:11px; font-weight:700; display:flex; align-items:center;
                    justify-content:center; letter-spacing:.02em; flex-shrink:0; }
  .rw-user-name   { font-size:13px; font-weight:600; color:rgba(255,255,255,0.90); white-space:nowrap; }
  .rw-role-badge  { padding:2px 8px; border-radius:3px; font-size:10.5px; font-weight:600;
                    background:rgba(255,255,255,0.15); color:rgba(255,255,255,0.85);
                    letter-spacing:.04em; text-transform:uppercase; white-space:nowrap; }

  /* ── Sidebar: push layout, right-hand side ── */
  .rw-sidebar { width:240px; min-width:240px; background:#3a3530; color:#fff;
                display:flex; flex-direction:column; flex-shrink:0;
                overflow:hidden; transition:width 0.25s ease, min-width 0.25s ease; }
  .rw-sidebar.collapsed { width:0; min-width:0; }
  .rw-sidebar [class*="oj-ux-ico"],
  .rw-sidebar [class*="oj-ux-ico"]::before { color:rgba(255,255,255,0.85); }

  .rw-sidebar-logo { height:var(--shell-header-height); min-height:var(--shell-header-height);
                     padding:0 12px; border-bottom:1px solid rgba(255,255,255,0.08);
                     display:flex; align-items:center; gap:10px; flex-shrink:0; }
  .rw-sidebar-logo-texts { flex:1; min-width:0; }
  .rw-sidebar-logo-title { font-size:15px; font-weight:700; color:#fff; margin:0; }
  .rw-sidebar-logo-sub   { font-size:11px; color:rgba(255,255,255,0.55); margin-top:3px;
                           letter-spacing:.04em; text-transform:uppercase; }
  .rw-sidebar-toggle { background:transparent; border:none; color:rgba(255,255,255,0.70);
                       cursor:pointer; font-size:18px; padding:4px 6px; border-radius:3px;
                       line-height:1; flex-shrink:0; font-family:inherit; }
  .rw-sidebar-toggle:hover { background:rgba(255,255,255,0.10); color:#fff; }

  .rw-sidebar-nav { flex:1; overflow-y:auto; padding:8px; }
  .rw-nav-group-title { font-size:10.5px; font-weight:700; color:rgba(255,255,255,0.45);
                        text-transform:uppercase; letter-spacing:.08em; padding:14px 12px 6px; }
  .rw-nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:6px;
                 font-size:13px; font-weight:600; color:rgba(255,255,255,0.95);
                 cursor:pointer; transition:background 0.12s, color 0.12s; position:relative;
                 user-select:none; border:none; background:transparent; width:100%;
                 text-align:left; font-family:inherit; }
  .rw-nav-item:hover  { background:rgba(255,255,255,0.10); color:#fff; }
  .rw-nav-item.active { background:rgba(255,255,255,0.15); color:#fff; font-weight:700; }
  .rw-nav-item.active::before { content:''; position:absolute; left:0; top:6px; bottom:6px;
                                width:3px; background:#fff; border-radius:0 2px 2px 0; }

  /* A role that resolves to nothing gets an explanation, not an empty panel —
     empty reads as a loading failure. */
  .rw-nav-empty { padding:16px 12px; font-size:12px; line-height:1.5; color:rgba(255,255,255,0.65); }

  /* ── Main content area ── */
  .rw-main { flex:1; overflow-y:auto; overflow-x:hidden; background:var(--rw-oyster); padding:20px 24px; }
  .rw-main [class*="oj-ux-ico"],
  .rw-main [class*="oj-ux-ico"]::before { color:#485053; }

  /* The login page draws its own full-bleed layout, so the shell's padding and
     oyster background come off underneath it. */
  .rw-shell.shell-guest .rw-main { padding:0; background:#fff; }

  /* ── Shell-level failure (not a page error, which goes to the banner) ── */
  .rw-shell-error { max-width:640px; margin:48px auto; background:#fff;
                    border:1px solid var(--rw-border); border-left:3px solid var(--rw-danger);
                    border-radius:4px; padding:18px 20px; }
  .rw-shell-error-title { font-size:15px; font-weight:700; color:var(--rw-coal); margin-bottom:6px; }
  .rw-shell-error-body  { font-size:13px; line-height:1.6; color:var(--rw-slate); }

  /* ── The rejected-week callout on My Timesheet ──
     Its own class, because it borrowed .rw-shell-error - which is the box for
     "the whole shell failed to load" and carries max-width:640px and
     margin:48px auto. The result was a narrow panel floating in the middle of
     the page instead of a banner across it. The prototype's .warn-banner
     recoloured red: full width, 3px danger rule down the left, sitting between
     the week selector and the grid. */
  .rw-reject-banner { background:#fdecef; border-left:3px solid var(--rw-danger);
                      border-radius:3px; padding:12px 16px; margin:0 0 14px;
                      color:#7a2018; font-size:12.5px; line-height:1.6; }
  .rw-reject-banner strong { color:#7a2018; }
  .rw-reject-title  { font-size:13.5px; font-weight:700; margin-bottom:4px; }

  /* ── Approval workflow strip (foot of My Timesheet) ── */
  .rw-wf { border-top:1px solid var(--rw-border); margin-top:4px; }
  .rw-wf-row { display:flex; gap:10px; align-items:baseline; padding:8px 0;
               border-bottom:1px solid var(--rw-border); font-size:12.5px; }
  .rw-wf-row:last-child { border-bottom:none; }
  .rw-wf-when { color:var(--rw-slate); font-size:11.5px; white-space:nowrap; }
  .rw-wf-what { flex:1; }
  .rw-wf-dot  { width:8px; height:8px; border-radius:50%; background:var(--rw-slate);
                flex:none; align-self:center; }
  .rw-wf-dot-reject  { background:var(--rw-danger); }
  .rw-wf-dot-approve { background:#0d7a4f; }

  /* ── Shared page furniture, used by every page in the flow ── */
  .page-band { background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 16px),
      repeating-linear-gradient(115deg, rgba(0,0,0,0.05) 0 1px, transparent 1px 28px),
      linear-gradient(135deg, #374151 0%, #4b5563 50%, #6b7280 100%);
    margin:-20px -24px 0; padding:26px 32px 24px; position:relative; color:#fff; }
  .page-band > * { position:relative; z-index:1; }
  .page-band-header { display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .page-band-back { background:transparent; border:none; color:#fff; cursor:pointer; opacity:0.85;
                    font-size:18px; padding:4px 8px; border-radius:3px; line-height:1; font-family:inherit; }
  .page-band-back:hover { background:rgba(255,255,255,0.10); opacity:1; }
  .page-band-title { font-family:Georgia,"Times New Roman",serif; font-size:28px; font-weight:400;
                     color:#fff; letter-spacing:-0.3px; flex:1; min-width:0; line-height:1.2; }
  .page-band-sub { font-size:13px; color:rgba(255,255,255,0.75); }
  .page-band-actions { display:flex; gap:8px; align-items:center; }

  .filter-bar { display:flex; align-items:flex-end; gap:10px; padding:10px 14px; background:#fff;
                border:1px solid var(--rw-border); border-radius:4px; margin:14px 0; flex-wrap:wrap; }
  .filter-field { display:flex; flex-direction:column; gap:4px; }

  .tbl-wrap { background:#fff; border:1px solid var(--rw-border); border-radius:4px; overflow:auto; }
  .tbl-wrap table { width:100%; border-collapse:collapse; font-size:13px; }
  .tbl-wrap thead th { background:#f5f4f0; padding:8px 12px; text-align:left;
                       font-size:11px; font-weight:600; color:var(--rw-slate);
                       text-transform:uppercase; letter-spacing:0.6px;
                       border-bottom:1px solid var(--rw-border); white-space:nowrap; }
  .tbl-wrap tbody td { padding:8px 12px; border-bottom:1px solid var(--rw-border-2);
                       color:var(--rw-ink-2); vertical-align:middle; }
  .tbl-wrap tbody tr:hover { background:#faf9f6; }
  .tbl-wrap tbody tr:last-child td { border-bottom:none; }

  .oj-table-column-header-cell { background:#f5f4f0 !important; color:var(--rw-slate) !important;
    font-size:11px !important; font-weight:600 !important; text-transform:uppercase !important;
    letter-spacing:0.6px !important; padding:8px 12px !important;
    border-bottom:1px solid var(--rw-border) !important; white-space:nowrap; }
  .oj-table-data-cell { padding:8px 12px !important; font-size:13px !important;
    color:var(--rw-ink-2) !important; border-bottom:1px solid var(--rw-border-2) !important;
    vertical-align:middle !important; }
  .oj-table-body-row:hover .oj-table-data-cell { background:#faf9f6 !important; }
  .oj-table-container { border:none !important; border-radius:0 !important; }

  .page-floating-card { background:#fff; border:1px solid var(--rw-border); border-radius:4px;
                        margin-top:14px; box-shadow:0 2px 12px rgba(0,0,0,0.08); overflow:hidden; }
  .page-card-toolbar { display:flex; align-items:center; gap:8px; padding:10px 14px;
                       border-bottom:1px solid var(--rw-border); flex-wrap:wrap; }
  .page-card-toolbar-right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .page-floating-card .tbl-wrap { border:none; border-radius:0; }

  .btn { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:3px;
         font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent;
         transition:background 0.12s, border-color 0.12s; white-space:nowrap; line-height:1.4;
         min-height:32px; font-family:inherit; }
  .btn:focus-visible { outline:none; box-shadow:0 0 0 2px var(--rw-focus); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn-primary { background:var(--rw-coal); color:#fff; }
  .btn-primary:hover:not(:disabled) { background:#1a1c22; }
  .btn-outline { background:#fff; color:var(--rw-ink-2); border-color:var(--rw-border); }
  .btn-outline:hover:not(:disabled) { background:var(--rw-hover); border-color:#c5c3bd; }
  .btn-ghost { background:transparent; color:var(--rw-ink-2); border-color:transparent; }
  .btn-ghost:hover:not(:disabled) { background:var(--rw-hover); }
  .btn-danger { background:var(--rw-danger); color:#fff; }
  .btn-danger:hover:not(:disabled) { background:#8b2f23; }
  .btn-sm { padding:4px 10px; font-size:12px; min-height:28px; }
  .btn-icon { padding:6px 7px; border-radius:3px; background:transparent; border:none;
              cursor:pointer; color:var(--rw-slate); transition:background 0.12s, color 0.12s;
              display:inline-flex; align-items:center; font-family:inherit; }
  .btn-icon:hover { background:var(--rw-hover); color:var(--rw-ink-2); }

  .form-label { display:block; font-size:11px; font-weight:600; color:var(--rw-slate);
                text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; }
  .form-input { width:100%; height:32px; padding:0 10px; border:1px solid var(--rw-border);
                border-radius:3px; font-size:13px; color:var(--rw-ink-2); outline:none;
                background:#fff; transition:border-color 0.12s, box-shadow 0.12s; }
  .form-input:focus { border-color:var(--rw-red); box-shadow:0 0 0 2px var(--rw-focus); }
  .form-row { display:grid; gap:16px; margin-bottom:16px; }
  .form-row-2 { grid-template-columns:1fr 1fr; }
  .form-row-3 { grid-template-columns:1fr 1fr 1fr; }
  .required { color:var(--rw-danger); margin-left:2px; }

  /* ══ Status capsules — the 7 week statuses ═══════════════════
     Colour is never the only signal: every capsule renders its status text, so
     the meaning survives greyscale and colour blindness (WCAG-AA, Pages sheet).
     The palette is the prototype's, so the built screens and
     doc/STATUS_MODEL.html read as the same product. */
  .rw-status { border-radius:12px; padding:2px 10px; display:inline-block;
               font-weight:600; font-size:0.8125rem; white-space:nowrap; }

  /* Not yet submitted — neutral: nothing has gone wrong yet. */
  .rw-status-notsubmitted { background:#f0f0f0; color:#5a5a5a; }
  /* Submitted — informational: waiting on someone else. */
  .rw-status-submitted    { background:#e8f1fa; color:#04528f; }
  /* Approved / Overridden and approved / Closed — resolved. */
  .rw-status-approved,
  .rw-status-overridden,
  .rw-status-closed       { background:#e6f4ee; color:#0d4f31; }
  /* Closed is terminal, so it reads a shade quieter than a fresh approval. */
  .rw-status-closed       { opacity:0.85; }
  /* Rejected — needs the employee to act. */
  .rw-status-rejected     { background:#fdeceb; color:#8c1d18; }

  /* The "n to review" marker beside approved/total in the monthly summary.
     Page-level <page>.css is never loaded, so every class has to live here. */
  .rw-week-pending { margin-left:8px; font-size:0.75rem; }
  /* Defaulted — a cut-off was missed. Warning, not error: the hours exist. */
  .rw-status-defaulted    { background:#fdf1e0; color:#6b4100; }

  /* ══ Flag chips — the 6 workflow flags ═══════════════════════
     Flags are independent of status and several can be set at once, so they are
     a row of chips rather than one badge. */
  .rw-flag { border-radius:4px; padding:1px 6px; display:inline-block;
             font-size:0.75rem; font-weight:600; border:1px solid transparent;
             white-space:nowrap; }
  .rw-flag-defaulted,
  .rw-flag-late       { background:#fdf1e0; border-color:#a3651a; color:#6b4100; }
  .rw-flag-advance,
  .rw-flag-overridden { background:#e8f1fa; border-color:#2563a8; color:#04528f; }
  /* Reversal carries the negative hours; Adjustment the positive half of the
     pair — opposite colours because they net off against each other. */
  .rw-flag-reversal   { background:#fdeceb; border-color:#b3352c; color:#8c1d18; }
  .rw-flag-adjustment { background:#e6f4ee; border-color:#17795e; color:#0d4f31; }

  /* ══ Weekly entry grid (PAGE-001) ════════════════════════════ */

  /* Day columns are sized in ch so they track the font rather than a fixed
     pixel width, and the table scrolls inside its own container. */
  /* min-width:0 is load-bearing, not tidying. This sits inside .rw-right-panel
     (flex) and .page-floating-card, and a flex item's default min-width is
     auto, meaning "never shrink below your content". With a 1480px grid inside,
     the container refused to shrink to the card, so overflow-x:auto had nothing
     to scroll and .rw-main's overflow-x:hidden clipped the grid instead. Only
     visible once the viewport was narrower than the grid, which is why it
     showed at 100% zoom and not when zoomed out. */
  .rw-grid-scroll { overflow-x:auto; width:100%; min-width:0; max-width:100%; }

  /* ── Why every table stopped short of its card ──
     oj-table is a custom element, and an unknown element defaults to
     display:inline, so it shrank to fit its content instead of filling the
     card. JET works out the space available for the flexible columns from the
     component's own width, and there was none to give: every table rendered at
     the sum of its fixed widths and minWidths and left the rest of the row
     blank, with the header text clipped in the narrow columns. Team Approvals
     came out ~1245px inside an ~1750px card.

     A block that fills the row, so "weight" has something to distribute. */
  oj-table { display:block; width:100%; }
  /* min-width, not width: fill the row when there is room, and still overflow
     into .rw-grid-scroll when the columns genuinely need more than the card has
     - forcing width:100% there would compress them instead of scrolling. */
  .oj-table-container { width:100% !important; }
  .oj-table-element   { min-width:100% !important; }
  .rw-grid-day    { min-width:7ch; text-align:center; }

  /* Non-working days stay enterable — RULE-012 makes Sat/Sun editable with a
     default of zero. The tint marks them unusual; it does not disable them. */
  .rw-grid-nonworking { background:#f4f4f4; }

  /* A cell the server refused, so the reason can sit next to the value. */
  .rw-grid-invalid input { border-color:#c12e2a; }

  .rw-grid-total { font-weight:700; background:#fafafa; }
  /* A day whose total across lines breaks RULE-003 (24h). Surfaced on the
     column total because no single cell is individually at fault. */
  .rw-grid-total-over { color:#c12e2a; }

  /* ── The single weekly grid (PAGE-001) ──────────────────────
     One table for Shift, the entry lines, Entered and Standard / day, so all
     four stay column-aligned; the prototype does the same with a sys-row in
     the tbody and a tfoot. Flex rows, not <table>: <oj-bind-for-each> is
     invalid inside <tr> and the parser lifts it out of the table.

     These live HERE, not in main-my-timesheet-page.css, because a page-level
     .css is NOT loaded — app-flow.json imports only redwood-overrides.css and
     nothing references the per-page files. Putting the grid rules there left
     the whole thing unstyled: every cell became a full-width block and the
     table collapsed into a vertical list. Every other rw- class is defined in
     this file for the same reason. */
  .rw-ts       { min-width:max-content; font-size:13px; }
  .rw-ts-row   { display:flex; align-items:stretch; border-bottom:1px solid var(--rw-border-2); }
  .rw-ts-row:last-child { border-bottom:none; }

  /* The column widths are declared once and every row reuses these four class
     names — that is what guarantees the alignment. */
  /* Narrowed 18-Aug-2026. At 13/11rem plus 7 day columns at 8.5rem the grid
     could not render below about 1480px, which is wider than the card at 100%
     zoom on a laptop -- the reported "timesheet does not come at 100%". The
     scroll fix above makes it reachable; these make it mostly unnecessary,
     which is the better outcome for a grid people type into every day. */
  .rw-ts-proj  { flex:0 0 11rem; padding:8px; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
  .rw-ts-task  { flex:0 0 9rem; padding:8px; }
  /* H8. The task is a button on an editable, non-leave line. It has to read as
     the task name it replaced, not as a control competing with Save draft --
     so no chrome, left aligned, inheriting the cell's type. The affordance is
     the hover and the focus ring, which oj-button supplies. A leave line and a
     locked week render plain text instead, so the absence of a button is
     itself the signal that the line cannot be moved. */
  .rw-ts-task-btn { margin:-4px 0 0 -8px; text-align:left; max-width:100%; }
  .rw-ts-task-btn .oj-button-label { font-weight:inherit; text-align:left;
                 white-space:normal; }
  .rw-ts-tot   { flex:0 0 5.5rem; padding:8px; text-align:center; }
  .rw-ts-act   { flex:0 0 3.5rem; padding:4px; text-align:center; }
  .rw-ts .rw-grid-day { flex:1 1 0; min-width:6.75rem; padding:6px 6px; text-align:center; }

  .rw-ts-head  { background:#f5f4f0; border-bottom:1px solid var(--rw-border); }
  .rw-ts-head > * { font-size:11px; font-weight:600; color:var(--rw-slate);
                    text-transform:uppercase; letter-spacing:0.5px; white-space:nowrap; }
  .rw-ts-sub   { display:block; text-transform:none; letter-spacing:0; font-weight:400; }

  /* Shift / Entered / Standard — system rows, visibly not data. */
  .rw-ts-sys      { background:#fafafa; color:#5a5a5a; }
  .rw-ts-syslabel { font-weight:600; }
  /* Sits under the row label, not in the Task column beside it. */
  .rw-ts-note     { display:block; color:var(--rw-slate); font-size:11.5px;
                    font-weight:400; white-space:normal; }
  .rw-ts-strong   { font-weight:700; }
  .rw-ts-empty    { padding:12px 8px; color:var(--rw-slate); }

  /* The hours editor: a text box with its own arrows, as in the prototype.
     oj-input-number renders an input plus two spinner buttons that do not fit
     a day column — the number was pushed out of sight and the cell looked
     empty while holding 8. */
  .rw-hr      { display:inline-flex; align-items:center; gap:4px; }
  .rw-hr-box  { width:4.5rem; }
  .rw-hr-box .oj-text-field-input { text-align:right; font-variant-numeric:tabular-nums; }
  .rw-hr-arr  { display:inline-flex; flex-direction:column; gap:2px; }

  /* Plain buttons, as in the prototype's .hr-arr, and deliberately out of the
     tab order — see the comment on the day cell. Sized so the pair together is
     no taller than the input beside them. */
  .rw-hr-step { width:20px; height:13px; padding:0; line-height:1;
                border:1px solid var(--rw-border); border-radius:3px;
                background:#fff; color:var(--rw-slate); font-size:9px;
                cursor:pointer; display:flex; align-items:center;
                justify-content:center; font-family:inherit; }
  .rw-hr-step:hover { background:var(--rw-hover); color:var(--rw-coal); }
  .rw-hr-step:active { background:var(--rw-border-2); }

  /* ══ Page-specific odds and ends ═════════════════════════════
     These were written into the pages' own .css files, which are never
     loaded, so all five classes were live in the markup and doing nothing.
     Moved here with them. */

  /* A checkbox in a table cell carries a margin that misaligns it. */
  .apdt-row-pick,
  .vtim-row-pick { margin:0; }

  /* Export/download are anchors, not oj-buttons: SES blocks browser globals in
     a page module, so the browser has to be the thing fetching the file. Styled
     to sit level with the buttons beside them. */
  .ad-export-link,
  .ctim-download-link { align-items:center; display:inline-flex; gap:0.25rem;
                        padding:0.25rem 0.5rem; text-decoration:none;
                        color:var(--oj-core-text-color-primary, inherit); }
  .ad-export-link { font-size:0.875rem; min-height:2rem; }
  .ad-export-link:hover,
  .ctim-download-link:hover { text-decoration:underline; }

  .ctim-muted { color:var(--oj-core-text-color-secondary, #5a5a5a); }

  /* ══ Metric strip ════════════════════════════════════════════ */
  .rw-metric       { background:#fff; border:1px solid var(--rw-border); border-radius:8px; }
  .rw-metric-value { font-size:1.5rem; font-weight:700; line-height:1.1; }
  .rw-metric-label { color:var(--rw-slate); font-size:0.8125rem; }

  /* ══ Cut-off / rule notice ═══════════════════════════════════ */
  .rw-notice { background:#e8f1fa; border-inline-start:3px solid #2563a8;
               border-radius:4px; color:#04528f; font-size:0.8125rem;
               padding:10px 14px; }
  .rw-notice-warning { background:#fdf1e0; border-inline-start-color:#a3651a;
                       color:#6b4100; }

  /* oj-sp-general-overview-page constrains its own max width, which crops the
     wide grids. Applied by class so it is opt-in per page, not global. */
  .rw-page-full { --oj-sp-general-overview-page-max-width: 100% !important;
                  max-width: 100% !important; }

  .stat-card  { background:#fff; border:1px solid var(--rw-border); border-radius:4px; padding:16px 18px; }
  .stat-label { font-size:11px; font-weight:600; color:var(--rw-slate); text-transform:uppercase;
                letter-spacing:0.6px; margin-bottom:6px; }
  .stat-value { font-size:26px; font-weight:600; color:var(--rw-coal); letter-spacing:-0.4px; }
  .stat-sub   { font-size:12px; color:var(--rw-slate); margin-top:4px; }

  .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .grid-4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:14px; }

  .detail-section { background:#fff; border:1px solid var(--rw-border); border-radius:4px;
                    padding:18px; margin-bottom:14px; }
  .section-title  { font-size:13px; font-weight:600; color:var(--rw-coal); margin-bottom:14px;
                    padding-bottom:10px; border-bottom:1px solid var(--rw-border);
                    text-transform:uppercase; letter-spacing:.06em; }

  .info-banner  { background:#eaf1f5; border-left:3px solid #1f5d83; border-radius:3px;
                  padding:10px 14px; margin-bottom:14px; font-size:13px; color:#1f4a6a; }
  .warn-banner  { background:#fbf3d8; border-left:3px solid #a96b00; border-radius:3px;
                  padding:10px 14px; margin-bottom:12px; font-size:13px; color:#7a5a00; }
  .error-banner { background:#fef2f2; border-left:3px solid var(--rw-danger); border-radius:3px;
                  padding:10px 14px; margin-bottom:12px; font-size:13px; color:#991b1b; }

  .divider { border:none; border-top:1px solid var(--rw-border); margin:14px 0; }
  .text-muted { color:var(--rw-slate); font-size:12px; }
  .mb-4 { margin-bottom:14px; }
  .mt-4 { margin-top:14px; }

  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:rgba(91,93,101,0.25); border-radius:3px; }
  ::-webkit-scrollbar-thumb:hover { background:rgba(91,93,101,0.55); }

  /* ── Login and set-password pages ── */
  .login-wrap { min-height:100vh; background:#fff; display:flex; flex-direction:column; }
  .login-topbar { display:flex; align-items:center; gap:10px; padding:14px 24px; background:#fff;
                  border-bottom:1px solid #eaeaea; flex-shrink:0; }
  .login-brand-texts { display:flex; flex-direction:column; line-height:1; }
  .login-brand-title { font-size:15px; font-weight:700; color:#1a1c22; letter-spacing:-0.1px; }
  .login-brand-sub   { font-size:10px; color:#5b5d65; text-transform:uppercase;
                       letter-spacing:0.6px; margin-top:2px; }

  .login-split { flex:1; display:flex; min-height:0; }
  .login-hero { flex:1; background:linear-gradient(145deg,#1a1c22 0%,#2d3748 55%,#3a3530 100%);
                display:flex; align-items:center; justify-content:center; padding:52px 56px;
                position:relative; overflow:hidden; }
  .login-hero::before { content:''; position:absolute; inset:0; pointer-events:none; background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(0deg,   rgba(255,255,255,0.015) 0 1px, transparent 1px 16px); }
  .login-hero-inner { position:relative; z-index:1; max-width:420px; }
  .login-hero-title { font-size:30px; font-weight:700; color:#fff; letter-spacing:-0.4px;
                      margin:0 0 14px; line-height:1.2; }
  .login-hero-sub { font-size:14px; color:rgba(255,255,255,0.60); line-height:1.65; margin:0 0 36px; }
  .login-hero-features { display:flex; flex-direction:column; gap:12px; }
  .login-feature-item { font-size:13px; color:rgba(255,255,255,0.78); display:flex;
                        align-items:center; gap:10px; line-height:1.4; }
  .login-feature-check { width:20px; height:20px; background:rgba(255,255,255,0.12); border-radius:50%;
                         display:inline-flex; align-items:center; justify-content:center;
                         font-size:10px; color:#42A5F5; flex-shrink:0; font-weight:700; }

  .login-form-panel { width:500px; flex-shrink:0; display:flex; align-items:center;
                      justify-content:center; padding:52px 48px; background:#fff; }
  .login-card { width:100%; max-width:380px; }
  .login-form-header { display:flex; align-items:center; gap:14px; margin-bottom:28px; }
  .login-form-icon { width:48px; height:48px; background:#EEF4FC; border-radius:12px;
                     display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .login-logo { font-size:20px; font-weight:700; color:#1a1c22; letter-spacing:-0.2px; margin:0; }
  .login-sub  { font-size:13px; color:#5b5d65; margin-top:2px; }
  .login-field { margin-bottom:16px; }
  .login-error { background:#fef2f2; color:#991b1b; padding:10px 14px; border-radius:4px;
                 font-size:13px; margin-bottom:16px; border:1px solid #fecdca; line-height:1.5; }
  .login-ok    { background:#e6f4ea; color:#1e7d32; padding:10px 14px; border-radius:4px;
                 font-size:13px; margin-bottom:16px; border:1px solid #a5d6a7; line-height:1.5; }
  .login-hint  { background:#f6f6f4; color:#5b5d65; padding:10px 14px; border-radius:4px;
                 font-size:12px; margin-bottom:16px; border:1px solid var(--rw-border); line-height:1.6; }
  .btn-login { display:flex; align-items:center; justify-content:center; width:100%; height:44px;
               background:#1565C0; color:#fff; font-size:14px; font-weight:600; border:none;
               border-radius:4px; cursor:pointer; transition:background 0.15s;
               letter-spacing:0.01em; font-family:inherit; }
  .btn-login:hover:not(:disabled) { background:#0d47a1; }
  .btn-login:disabled { background:#90a4c8; cursor:not-allowed; }
  .login-alt { margin-top:20px; text-align:center; font-size:13px; color:var(--rw-slate); }
  .login-alt-link { color:#1565C0; font-weight:600; cursor:pointer; background:none; border:none;
                    font-size:13px; font-family:inherit; padding:0; }
  .login-alt-link:hover { text-decoration:underline; }

  /* Oracle JET call-to-action buttons, recoloured to the module's grey. */
  :root {
    --oj-button-call-to-action-chrome-bg-color:        #485053;
    --oj-button-call-to-action-chrome-bg-color-hover:  #374151;
    --oj-button-call-to-action-chrome-bg-color-active: #374151;
  }
</style>

<!-- Oracle pillar theme: sets the gallery CDN variables the oj-sp headers use -->
<oj-sp-pillar-theme></oj-sp-pillar-theme>

<div :class="[[ $application.variables.isLoggedIn ? 'rw-shell' : 'rw-shell shell-guest' ]]">

  <!-- ══ Right panel: topbar + router outlet ══════════════════ -->
  <div class="rw-right-panel">

    <header class="rw-topbar">
      <div class="rw-topbar-left">
        <span class="rw-topbar-title"><oj-bind-text value="[[$application.translations.appBundle.shell_o2c_timesheet]]"></oj-bind-text></span>
      </div>

      <div class="rw-topbar-right">

        <!--
          NO period selector here. The prototype's topbar (doc/O2C_Timesheet_Module.html)
          is brand · role · notifications · user · sign-out, and every screen
          that is scoped to a month carries its own picker: "Month" on
          PAGE-001, "Month / Year" on PAGE-003, "Billing Period" on client
          timesheets, and one each on accrual, leave-loss and salary stopping.
          A topbar copy duplicated the page control and let the two disagree.
          The drill-down pages (approval detail, view timesheet) deliberately
          show the month read-only and inherit it from the page they came from,
          which is what the prototype does too.
        -->
        <div class="rw-topbar-context">

          <!-- No manager switcher here either. ACT-011 lives on PAGE-003,
               where the prototype puts it (the "emp-switch" row above the
               Month / Year filters), next to the team it changes. -->
        </div>

        <div class="rw-user-badge">
          <div class="rw-user-avatar">
            <oj-bind-text value="[[ $page.functions.initials($application.variables.userName) ]]"></oj-bind-text>
          </div>
          <span class="rw-user-name">
            <oj-bind-text value="[[ $application.variables.userName ]]"></oj-bind-text>
          </span>
          <span class="rw-role-badge">
            <oj-bind-text value="[[ $page.functions.roleLabel($application.variables.currentRole) ]]"></oj-bind-text>
          </span>
        </div>

        <oj-button display="icons" chroming="borderless"
                   on-oj-action="[[$listeners.doLogout]]" title="Sign out">
          <span slot="startIcon" class="oj-ux-ico-log-out"></span>
          <oj-bind-text value="[[$application.translations.appBundle.shell_sign_out]]"></oj-bind-text>
        </oj-button>

        <button class="rw-topbar-hamburger" title="Toggle menu"
                on-click="[[$listeners.toggleSidebar]]">&#9776;</button>
      </div>
    </header>

    <div class="rw-main">
      <oj-vb-content id="vbRouterContent" config="[[vbRouterFlow]]"></oj-vb-content>

      <!-- Shown only when the shell itself could not establish who the user is.
           An ordinary page error goes to the banner below, not here. -->
      <oj-bind-if test="[[ $variables.shellError ]]">
        <div class="rw-shell-error">
          <div class="rw-shell-error-title"><oj-bind-text value="[[$application.translations.appBundle.shell_cannot_open_the_time_module]]"></oj-bind-text></div>
          <div class="rw-shell-error-body">
            <oj-bind-text value="[[ $variables.shellError ]]"></oj-bind-text>
          </div>
        </div>
      </oj-bind-if>

      <oj-sp-messages-banner data="[[ $variables.messagesBannerADP ]]"
        on-sp-close="[[$listeners.messagesBannerSpClose]]">
      </oj-sp-messages-banner>
      <oj-sp-messages-toast primary-text="[[ $variables.messageToast ]]" id="messageToast">
      </oj-sp-messages-toast>
    </div>

  </div>

  <!-- ══ Sidebar ══════════════════════════════════════════════
       Derived from the role by resources/js/navModel, not filled by a chain, so
       it cannot go stale: change the role and the menu follows in the same
       render. RULE-022 is enforced by omission — a role is never handed an item
       it may not open — and navigateToPageChain re-checks the SAME model for a
       hand-typed URL.
  ══════════════════════════════════════════════════════════ -->
  <aside :class="[[ $variables.sidebarCollapsed ? 'rw-sidebar collapsed' : 'rw-sidebar' ]]">

    <div class="rw-sidebar-logo">
      <div class="rw-sidebar-logo-texts">
        <div class="rw-sidebar-logo-title"><oj-bind-text value="[[$application.translations.appBundle.shell_timesheet]]"></oj-bind-text></div>
        <div class="rw-sidebar-logo-sub"><oj-bind-text value="[[$application.translations.appBundle.common_o2c_platform]]"></oj-bind-text></div>
      </div>
      <button class="rw-sidebar-toggle" title="Close menu"
              on-click="[[$listeners.toggleSidebar]]">&#10005;</button>
    </div>

    <nav class="rw-sidebar-nav">
      <oj-bind-for-each data="[[ $page.functions.navGroups($application.variables.currentRole) ]]">
        <template>
          <div>
            <div class="rw-nav-group-title">
              <oj-bind-text value="[[ $current.data.title ]]"></oj-bind-text>
            </div>
            <oj-bind-for-each data="[[ $current.data.items ]]">
              <template>
                <button type="button"
                        :class="[[ $page.functions.navItemClass(
                                     $current.data.page,
                                     $application.variables.activeNav) ]]"
                        :data-page="[[ $current.data.page ]]"
                        on-click="[[$listeners.navClick]]">
                  <span :class="[[ $current.data.icon ]]" style="font-size:14px;"></span>
                  <!-- Wrapped: an oj-bind-text directly inside a button renders
                       nothing, which would leave every nav item as a bare icon. -->
                  <span>
                    <oj-bind-text value="[[ $current.data.label ]]"></oj-bind-text>
                  </span>
                </button>
              </template>
            </oj-bind-for-each>
          </div>
        </template>
      </oj-bind-for-each>

      <oj-bind-if test="[[ $page.functions.hasNoNav($application.variables.currentRole) ]]">
        <div class="rw-nav-empty">
          <oj-bind-text value="[[$application.translations.appBundle.shell_you_are_signed_in_but_your_account_has_not_b]]"></oj-bind-text>
        </div>
      </oj-bind-if>
    </nav>
  </aside>

</div>
